<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 136" role="img" aria-labelledby="title desc">
  <title id="title">PHOENIX</title>
  <desc id="desc">Golden phoenix emblem and PHOENIX wordmark on a transparent background.</desc>
  <defs>
