version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      # Vendored Cordis sources follow vendor/README.md instead of registry updates.
      - "vendor/**"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    # Codex is updated by PHOENIX Codex Runtime Update instead of the
    # 30-day generic dependency cooldown. That workflow validates the package-local
    # binary and Codex integration before a guarded PR can merge.
    ignore:
      - dependency-name: "@openai/codex"
    groups:
      claude-runtime-quarantine:
        patterns:
          - "@anthropic-ai/claude-agent-sdk"
          - "@anthropic-ai/sdk"
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "uv"
    directory: "/python/sdk"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"
