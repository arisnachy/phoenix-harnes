name: PHOENIX upstream quarantine

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: phoenix-upstream-quarantine
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  DEEPSEEK_UPSTREAM_REPOSITORY: ${{ vars.DEEPSEEK_UPSTREAM_REPOSITORY }}

jobs:
  deepseek-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate and fetch the configured independent upstream
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source="${DEEPSEEK_UPSTREAM_REPOSITORY:-}"
          if [[ -z "$source" ]]; then
            echo '::notice::DeepSeek quarantine skipped: repository variable DEEPSEEK_UPSTREAM_REPOSITORY is not configured.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$source" =~ ^(https://|ssh://|git@)[^[:space:]]+$ ]]; then
            echo '::error::DeepSeek quarantine refused: DEEPSEEK_UPSTREAM_REPOSITORY must be an explicitly configured Git URL.' >&2
            exit 1
          fi
          normalize_remote() {
            local value="$1"
            value="${value#https://}"
            value="${value#http://}"
            value="${value#ssh://}"
            if [[ "$value" == git@* ]]; then
              value="${value#git@}"
              value="${value/:/\/}"
            fi
            value="${value#github.com:}"
            value="${value#github.com/}"
            value="${value%.git}"
            value="${value%/}"
            printf '%s' "$value" | tr '[:upper:]' '[:lower:]'
          }
          configured_identity="$(normalize_remote "$source")"
          phoenix_identity="$(normalize_remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git")"
          if [[ "$configured_identity" == "$phoenix_identity" ]]; then
            echo '::error::DeepSeek quarantine refused: configured upstream resolves to the PHOENIX repository.' >&2
            exit 1
          fi
          git remote add deepseek-upstream "$source"
          git fetch --no-tags deepseek-upstream main
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Stop when this upstream SHA already has a candidate
        id: candidate
        if: steps.source.outputs.configured == 'true'
        shell: bash
        run: |
          upstream_sha="$(git rev-parse deepseek-upstream/main)"
          short_sha="${upstream_sha:0:12}"
          branch="quarantine/deepseek-${short_sha}"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.candidate.outputs.exists == 'false'
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        if: steps.candidate.outputs.exists == 'false'
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Merge only into a quarantine candidate
        if: steps.candidate.outputs.exists == 'false'
        run: |
          git config user.name phoenix-upstream-bot
          git config user.email phoenix-upstream-bot@users.noreply.github.com
          git switch -c "${{ steps.candidate.outputs.branch }}"
          git merge --no-edit --no-ff deepseek-upstream/main

      - name: Protect PHOENIX product identity
        if: steps.candidate.outputs.exists == 'false'
        shell: bash
        run: |
          forbidden='DSH Local Build|Into the Unknown|Deep diving'
          if rg -n "$forbidden" packages/client packages/bundle apps; then
            echo 'Upstream candidate reintroduced a retired product identity.' >&2
            exit 1
          fi
          rg -n 'PHOENIX' packages/client/web packages/client/ui-brand-official >/dev/null

      - name: Install and run the static acceptance gate
        if: steps.candidate.outputs.exists == 'false'
        run: |
          pnpm install --frozen-lockfile
          pnpm run check:ci:static

      - name: Publish candidate branch
        if: steps.candidate.outputs.exists == 'false'
        run: git push --set-upstream origin "${{ steps.candidate.outputs.branch }}"

      - name: Open the KIRA review pull request
        if: steps.candidate.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.candidate.outputs.branch }}" \
            --title "quarantine: review DeepSeek upstream ${{ steps.candidate.outputs.upstream_sha }}" \
            --body-file - <<'EOF'
          Automated PHOENIX quarantine candidate.

          This pull request must not auto-merge. KIRA review must confirm:

          - PHOENIX identity remains intact.
          - Security and secret boundaries remain intact.
          - Windows CI is green.
          - Snapshots and coverage are green.
          - A rollback SHA is recorded.

          Codex and Claude Code are integrations, not source-code upstreams;
          their supported SDK/CLI updates must arrive through separately reviewed
          dependency pull requests.
          EOF
