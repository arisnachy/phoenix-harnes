name: Adversarial gate artifact refresh

on:
  push:
    branches:
      - fix/adversarial-gate-generated-artifacts

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Refresh gate-derived artifacts
        run: |
          pnpm run gen-doc-graphs
          pnpm run gen-cordis-catalog
          pnpm run gen-client-catalog
          pnpm run gen-persistence-catalog
      - name: Verify gate-derived artifacts
        run: |
          pnpm run verify-doc-graphs
          pnpm run verify-cordis-catalog
          pnpm run verify-client-catalog
          pnpm run verify-persistence-catalog
          pnpm vitest run \
            packages/goal/goal/tests/adversarial-completion-gate.spec.ts \
            packages/goal/tool-goal/tests/adversarial-completion-gate.spec.ts \
            packages/client/ui-subagent/tests/completion-verifier-visibility.client.spec.ts \
            packages/session/session-learning/tests/false-pass-procedural-memory.spec.ts
      - name: Commit canonical generated artifacts
        run: |
          rm .github/workflows/adversarial-gate-artifact-refresh.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh completion-gate generated artifacts"
          git push origin HEAD:fix/adversarial-gate-generated-artifacts
