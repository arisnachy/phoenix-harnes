name: Phoenix PR1132 exact merge conflict probe
# Confirm translation pairing after final source-preserving markdown corrections.
on:
  push:
    branches:
      - fix/phoenix-dual-core-integration-20261023
    paths:
      - .github/workflows/phoenix-pr1132-merge-probe.yml
permissions:
  contents: read
jobs:
  audit-merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Print exact Git conflict paths without changing repo
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          echo "head=$(git rev-parse HEAD)"
          echo "base=$(git rev-parse origin/main)"
          git -c user.name='Probe' -c user.email='probe@example.org' merge --no-commit --no-ff origin/main || {
            echo 'CONFLICT_PATHS_BEGIN'
            git diff --name-only --diff-filter=U
            echo 'CONFLICT_PATHS_END'
            exit 1
          }
          echo 'MERGE_CONFLICT_FREE'

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify strict source and test TypeScript without weakened rules
        run: pnpm run build:lib
  docs-and-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify exact bilingual pairing
        run: pnpm run verify-translation-pairing
      - name: Verify strict lint
        run: pnpm run lint:contracts-ready
