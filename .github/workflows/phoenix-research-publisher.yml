name: PHOENIX research publisher smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/phoenix-research-publisher.py'
      - 'scripts/phoenix-research-publisher-smoke.py'
      - 'scripts/phoenix-research-institution-rules.py'
      - 'scripts/phoenix-research-institution-rules-smoke.py'
      - 'packages/hardness/adapters/src/research-publish-tool.ts'
      - '.github/workflows/phoenix-research-publisher.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/phoenix-research-publisher.py'
      - 'scripts/phoenix-research-publisher-smoke.py'
      - 'scripts/phoenix-research-institution-rules.py'
      - 'scripts/phoenix-research-institution-rules-smoke.py'
      - 'packages/hardness/adapters/src/research-publish-tool.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-files:
    name: Word PDF and HTML / real file smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install free document renderers
        run: python -m pip install python-docx reportlab pillow pymupdf
      - name: Exercise real academic publication
        run: |
          python scripts/phoenix-research-publisher-smoke.py
          python scripts/phoenix-research-institution-rules-smoke.py
