name: Final auth connectors regenerate

on:
  push:
    branches:
      - fix/auth-connectors-voice-mail-final-20261004

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate catalogs and graphs
        run: |
          pnpm run prepare:change
          pnpm run gen-tool-catalog
          pnpm run verify-translation-pairing --write packages/credentials/tool-google-workspace/README.md
      - name: Commit generated outputs
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: regenerate final auth connector catalogs"
          git push origin HEAD:fix/auth-connectors-voice-mail-final-20261004
