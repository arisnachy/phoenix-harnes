name: KIRA PR58 auth contract fix

on:
  push:
    branches: [feat/codex-graft-full]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.ref == 'refs/heads/feat/codex-graft-full' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/codex-graft-full
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply focal authorization patch
        run: python3 scripts/kira-pr58-auth-contract-fix.py
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify host contract and focused auth tests
        run: |
          pnpm run typecheck
          pnpm exec vitest run packages/host/apiproxy/tests/api-proxy-authorization.spec.ts packages/host/apiproxy/tests/client-handler.spec.ts packages/host/apiproxy/tests/fetch-carrier.spec.ts packages/client/ui-settings-models/tests/authorization-panel.client.spec.tsx
          git diff --check
      - name: Commit product fix only
        shell: bash
        run: |
          git config user.name "KIRA PHOENIX"
          git config user.email "actions@users.noreply.github.com"
          git add packages/host/apiproxy/src/api-proxy.ts packages/host/apiproxy/tests/client-handler.spec.ts packages/host/apiproxy/tests/fetch-carrier.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(auth): complete disconnect host contract"
          git push origin HEAD:feat/codex-graft-full
