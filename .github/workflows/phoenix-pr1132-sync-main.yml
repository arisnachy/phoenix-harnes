name: Phoenix PR 1132 guarded main sync

# One-shot trigger. Merge current main into the PR only when Git itself finds no conflicts.
on:
  push:
    branches:
      - fix/phoenix-dual-core-integration-20261023
    paths:
      - .github/workflows/phoenix-pr1132-sync-main.yml

permissions:
  contents: write

concurrency:
  group: phoenix-pr1132-sync-main
  cancel-in-progress: false

jobs:
  guarded-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/phoenix-dual-core-integration-20261023
          fetch-depth: 0
          persist-credentials: true
      - name: Merge main without overwriting conflicts or rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Phoenix CI Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "PR already contains current main"
            exit 0
          fi
          if ! git merge --no-ff --no-edit -m "merge: bring PR 1132 in sync with current main" origin/main; then
            echo "::error::Merge conflicts; branch left untouched. Resolve these paths manually:"
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          fi
          git diff HEAD^1 HEAD --check
          git push origin HEAD:fix/phoenix-dual-core-integration-20261023
