name: Temporary wire Codex imagegen

on:
  push:
    branches:
      - feat/kira-floating-codex-imagegen-20260913

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/kira-floating-codex-imagegen-20260913
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Wire image generation into the shipped Web profile
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function addDependency(file, name) {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'))
            value.dependencies ??= {}
            value.dependencies[name] = 'workspace:^'
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n')
          }

          addDependency('apps/cli/package.json', '@phoenix-ai/dsh-tool-image-generation-codex')
          addDependency('packages/bundle/web-app/package.json', '@phoenix-ai/dsh-subagent-codex')

          const presetPath = 'apps/cli/config/agent-presets/standard/agent.cordis.yml'
          let preset = fs.readFileSync(presetPath, 'utf8')
          if (!preset.includes("name: '@phoenix-ai/dsh-tool-image-generation-codex'")) {
            preset += `\n# Codex-backed image generation is a model-facing capability of the full Web agent.\n- id: tool-image-generation-codex\n  name: '@phoenix-ai/dsh-tool-image-generation-codex'\n  config:\n    provider: codex\n    toolName: image_generation\n`
            fs.writeFileSync(presetPath, preset)
          }

          const webPatchPath = 'packages/bundle/web-app/cordis.patch.yml'
          let webPatch = fs.readFileSync(webPatchPath, 'utf8')
          if (!webPatch.includes("name: '@phoenix-ai/dsh-subagent-codex'")) {
            webPatch += `\n# Web-only official Codex provider. The standard agent consumes it through\n# image_generation; headless/base profiles do not pay the Codex payload cost.\n- insert:\n    - id: subagent-codex\n      name: '@phoenix-ai/dsh-subagent-codex'\n`
            fs.writeFileSync(webPatchPath, webPatch)
          }

          const tsconfigPath = 'tsconfig.host.json'
          let tsconfig = fs.readFileSync(tsconfigPath, 'utf8')
          const anchor = '    { "path": "./packages/subagent/tool-subagent" },'
          const addition = '    { "path": "./packages/subagent/tool-image-generation-codex" },'
          if (!tsconfig.includes(addition)) {
            if (!tsconfig.includes(anchor)) throw new Error('tsconfig.host.json anchor missing')
            tsconfig = tsconfig.replace(anchor, `${anchor}\n${addition}`)
            fs.writeFileSync(tsconfigPath, tsconfig)
          }
          NODE
      - name: Regenerate workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated wiring and lockfile
        shell: bash
        run: |
          git config user.name "phoenix-ci"
          git config user.email "phoenix-ci@users.noreply.github.com"
          git add apps/cli/package.json apps/cli/config/agent-presets/standard/agent.cordis.yml packages/bundle/web-app/package.json packages/bundle/web-app/cordis.patch.yml tsconfig.host.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No wiring changes needed"
            exit 0
          fi
          git commit -m "feat(imagegen): wire Codex image generation into web profile"
          git push origin HEAD:feat/kira-floating-codex-imagegen-20260913
