name: Temporary quality lockfile refresh

on:
  push:
    branches:
      - feat/quality-foresight-completion-20260915
    paths:
      - packages/quality/quality/package.json
      - .github/workflows/tmp-quality-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/quality-foresight-completion-20260915
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore: refresh lockfile for quality package"
          git push origin HEAD:feat/quality-foresight-completion-20260915
