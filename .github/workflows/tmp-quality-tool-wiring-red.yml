name: Temporary quality tool wiring RED

on:
  push:
    branches:
      - feat/quality-foresight-completion-20260915
    paths:
      - .github/workflows/tmp-quality-tool-wiring-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Resolve quality source group
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tsconfig.base.json'); s=p.read_text()
          if '"./packages/quality/*/src"' not in s:
              s=s.replace('"./packages/goal/*/src",','"./packages/goal/*/src",\n        "./packages/quality/*/src",')
          p.write_text(s)
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/goal/tool-goal/tests/quality-tool-wiring.spec.ts
