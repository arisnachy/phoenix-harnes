name: PHOENIX Stable Update Channel

on:
  workflow_run:
    workflows: [PHOENIX main guard]
    types: [completed]
    branches: [main, stable]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: phoenix-stable-update-channel
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Resolve verified and current stable commit
        id: target
        shell: bash
        env:
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main stable --quiet
          target="$(git rev-parse origin/stable)"
          if [[ ! "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid stable SHA" >&2
            exit 1
          fi
          if [[ "$TRIGGER_EVENT" == "workflow_run" ]]; then
            if [[ "$TRIGGER_SHA" != "$target" ]]; then
              echo "A newer stable commit exists; skip superseded guard."
              echo "promote=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            successful="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phoenix-main-guard.yml/runs?head_sha=$target&status=success&event=push&per_page=100" --jq '.workflow_runs[].head_sha')"
            if ! grep -Fxq "$target" <<< "$successful"; then
              echo "Manual publication requires a successful exact-SHA stable guard." >&2
              exit 1
            fi
          fi
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "promote=true" >> "$GITHUB_OUTPUT"

      # Stable may be a separately merged, fully verified commit. Never rewrite
      # the protected stable branch from main or require unrelated branch equality.
      - name: Confirm the guarded release is still stable HEAD
        if: steps.target.outputs.promote == 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin stable --quiet
          test "$(git rev-parse origin/stable)" = "$TARGET_SHA"

      - name: Verify updater contract
        if: steps.target.outputs.promote == 'true'
        run: node scripts/phoenix-auto-update.mjs --self-test

      - name: Publish stable manifest
        if: steps.target.outputs.promote == 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin phoenix/update-channel stable --quiet
          if [[ "$(git rev-parse origin/stable)" != "$TARGET_SHA" ]]; then
            echo "stable does not match verified target SHA" >&2
            exit 1
          fi
          channel_dir="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$channel_dir" >/dev/null 2>&1 || true
            rm -rf "$channel_dir"
          }
          trap cleanup EXIT
          git worktree add --detach "$channel_dir" origin/phoenix/update-channel
          mkdir -p "$channel_dir/.phoenix/channel"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > "$channel_dir/.phoenix/channel/stable.json" <<JSON
          {
            "schema": 1,
            "product": "PHOENIX",
            "channel": "stable",
            "sourceBranch": "stable",
            "sourceCommit": "$TARGET_SHA",
            "publishedAt": "$PUBLISHED_AT",
            "minimumNode": "22.19.0",
            "policy": {
              "installMode": "auto",
              "requireCleanWorktree": true,
              "requireFastForward": true,
              "preflightBuild": true,
              "rollbackOnFailure": true
            }
          }
          JSON
          cd "$channel_dir"
          if git diff --quiet -- .phoenix/channel/stable.json; then
            echo "Stable channel already points to $TARGET_SHA"
            exit 0
          fi
          git config user.name "phoenix-update-bot"
          git config user.email "phoenix-update-bot@users.noreply.github.com"
          git add .phoenix/channel/stable.json
          git commit -m "chore(update): publish stable $TARGET_SHA"
          git push origin HEAD:phoenix/update-channel

      - name: Stable channel summary
        if: steps.target.outputs.promote == 'true'
        run: |
          echo "### PHOENIX stable release published" >> "$GITHUB_STEP_SUMMARY"
          echo "- stable: `${{ steps.target.outputs.sha }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- channel: `phoenix/update-channel`" >> "$GITHUB_STEP_SUMMARY"
          echo "- policy: publish only successful exact-SHA stable guard" >> "$GITHUB_STEP_SUMMARY"
