name: PHOENIX Stable Update Channel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phoenix-stable-update-channel
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve current main commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          target="$(git rev-parse origin/main)"
          if [[ ! "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid main SHA: $target" >&2
            exit 1
          fi
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Keep stable exactly aligned with main
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin stable --quiet
          stable_sha="$(git rev-parse origin/stable)"
          if [[ "$stable_sha" == "$TARGET_SHA" ]]; then
            echo "stable already matches main at $TARGET_SHA"
            exit 0
          fi
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$stable_sha" "$TARGET_SHA"
          git push origin "$TARGET_SHA:refs/heads/stable" \
            --force-with-lease="refs/heads/stable:$stable_sha"

      - name: Verify updater contract
        run: node scripts/phoenix-auto-update.mjs --self-test

      - name: Publish stable manifest
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin phoenix/update-channel --quiet
          channel_dir="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$channel_dir" >/dev/null 2>&1 || true
            rm -rf "$channel_dir"
          }
          trap cleanup EXIT
          git worktree add --detach "$channel_dir" origin/phoenix/update-channel
          mkdir -p "$channel_dir/.phoenix/channel"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > "$channel_dir/.phoenix/channel/stable.json" <<JSON
          {
            "schema": 1,
            "product": "PHOENIX",
            "channel": "stable",
            "sourceBranch": "main",
            "sourceCommit": "$TARGET_SHA",
            "publishedAt": "$PUBLISHED_AT",
            "minimumNode": "22.19.0",
            "policy": {
              "installMode": "auto",
              "requireCleanWorktree": true,
              "requireFastForward": true,
              "preflightBuild": true,
              "rollbackOnFailure": true
            }
          }
          JSON
          cd "$channel_dir"
          if git diff --quiet -- .phoenix/channel/stable.json; then
            echo "Stable channel already points to $TARGET_SHA"
            exit 0
          fi
          git config user.name "phoenix-update-bot"
          git config user.email "phoenix-update-bot@users.noreply.github.com"
          git add .phoenix/channel/stable.json
          git commit -m "chore(update): publish stable $TARGET_SHA"
          git push origin HEAD:phoenix/update-channel

      - name: Stable channel summary
        run: |
          echo "### PHOENIX stable synchronized" >> "$GITHUB_STEP_SUMMARY"
          echo "- main/stable: `${{ steps.target.outputs.sha }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- channel: `phoenix/update-channel`" >> "$GITHUB_STEP_SUMMARY"
          echo "- policy: stable branch follows every main push" >> "$GITHUB_STEP_SUMMARY"
