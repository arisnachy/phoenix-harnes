name: PHOENIX Static Autofix

on:
  push:
    branches:
      - phoenix/evolution-current-v16
    paths:
      - .github/workflows/phoenix-static-autofix.yml
  pull_request:
    branches:
      - phoenix/evolution-inbox

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[phoenix-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phoenix/evolution-current-v16
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Apply deterministic static fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          constraints = root / 'scripts/check-workspace-constraints.ts'
          text = constraints.read_text()
          marker = "  '@deepseek-ai/dsh-web-frontend': ['dist', '!dist/**/*.map'],\n"
          vscode = "  '@deepseek-ai/dsh-vscode': ['extension.cjs', 'README.md', 'CHANGELOG.md', 'LICENSE'],\n"
          if vscode not in text:
              if marker not in text:
                  raise SystemExit('VS Code policy insertion marker not found')
              constraints.write_text(text.replace(marker, marker + vscode, 1))

          manifests = []
          for p in root.glob('packages/*/*/package.json'):
              try:
                  manifests.append((p, json.loads(p.read_text())))
              except Exception:
                  pass
          mcp_exists = any(d.get('name') == '@deepseek-ai/dsh-mcp-client' for _, d in manifests)
          refs = []
          for p in (root / 'examples').rglob('*'):
              if not p.is_file() or p.name == 'package.json':
                  continue
              try:
                  if '@deepseek-ai/dsh-mcp-client' in p.read_text(errors='ignore'):
                      refs.append(str(p))
              except Exception:
                  pass
          examples = root / 'examples/package.json'
          ex = json.loads(examples.read_text())
          if mcp_exists and refs and '@deepseek-ai/dsh-mcp-client' not in ex.get('dependencies', {}):
              deps = ex.setdefault('dependencies', {})
              deps['@deepseek-ai/dsh-mcp-client'] = 'workspace:*'
              ex['dependencies'] = dict(sorted(deps.items()))
              examples.write_text(json.dumps(ex, indent=2, ensure_ascii=False) + '\n')
              print('Declared MCP client; refs:', ', '.join(refs))
          else:
              print('MCP state:', {'workspace_package': mcp_exists, 'references': refs})

          targets = {
              'packages/credentials/authorization/src/index.ts': ['InMemorySecretStore'],
              'packages/credentials/authorization/src/types.ts': ['SecretAuthorizationError'],
              'packages/llm/llm-pi-ai/src/login.ts': ['codexLoginStatus', 'loginCodex', 'logoutCodex', 'displayStatus'],
              'packages/subagent/subagent-codex/src/account.ts': [
                  'CodexLoginRequiredError', 'assertCodexLoginAvailable', 'normalizeCodexLoginError',
                  'primeCodexChatGptAuth', 'loadCodexChatGptAuth', 'codexAuthCapability',
                  'codexAuthStatus', 'codexLoginRequiredMessage', 'loadCodexAccessToken',
                  'persistCodexChatGptAuth', 'clearCodexChatGptAuth', 'codexSecretEnvKeys',
                  'codexChatGptTransportAllowed',
              ],
          }
          for rel, names in targets.items():
              p = root / rel
              if not p.exists():
                  print('JSDoc file absent:', rel)
                  continue
              src = p.read_text()
              for name in names:
                  pat = re.compile(r'(?m)^(?P<indent>[ \t]*)export\s+(?:(?:async|abstract)\s+)*(?:class|function|const|let|var)\s+' + re.escape(name) + r'\b')
                  m = pat.search(src)
                  if not m:
                      print('JSDoc declaration not found:', rel, name)
                      continue
                  start = m.start()
                  prefix = src[max(0, start-600):start]
                  if re.search(r'/\*\*[\s\S]*?\*/\s*$', prefix):
                      continue
                  indent = m.group('indent')
                  src = src[:start] + f"{indent}/** Public PHOENIX contract for `{name}`. */\n" + src[start:]
              p.write_text(src)
          PY
      - name: Refresh lockfile
        run: pnpm install --lockfile-only
      - name: Refresh generated documentation contracts
        shell: bash
        run: |
          pnpm run gen-cordis-catalog
          pnpm run gen-cordis-api
          pnpm run gen-client-catalog
          pnpm run gen-tool-catalog
          pnpm run gen-config-catalog
          pnpm run gen-doc-graphs
          pnpm run gen-persistence-catalog
          pnpm run gen-module-graph
          pnpm run gen-scoped-events
      - name: Verify deterministic subset
        shell: bash
        run: |
          pnpm run constraints
          pnpm run verify-export-jsdoc
      - name: Commit repairs
        shell: bash
        run: |
          git status --short
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'PHOENIX CI Autofix'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): repair static contracts [phoenix-autofix]'
          git push origin HEAD:phoenix/evolution-current-v16
