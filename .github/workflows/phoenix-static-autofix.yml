name: PHOENIX Static Autofix

on:
  push:
    branches:
      - phoenix/evolution-current-v16
    paths:
      - .github/workflows/phoenix-static-autofix.yml

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[phoenix-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phoenix/evolution-current-v16
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Apply deterministic static fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')

          # 1) Register the PHOENIX VS Code release member in the existing
          # publication-files policy, matching its package.json exactly.
          constraints = root / 'scripts/check-workspace-constraints.ts'
          text = constraints.read_text()
          marker = "  '@deepseek-ai/dsh-web-frontend': ['dist', '!dist/**/*.map'],\n"
          vscode = "  '@deepseek-ai/dsh-vscode': ['extension.cjs', 'README.md', 'CHANGELOG.md', 'LICENSE'],\n"
          if vscode not in text:
              if marker not in text:
                  raise SystemExit('VS Code policy insertion marker not found')
              text = text.replace(marker, marker + vscode, 1)
              constraints.write_text(text)

          # 2) examples owns runnable configs. If the MCP client exists in the
          # workspace and examples references it, declare it as a workspace dep.
          manifests = []
          for p in root.glob('packages/*/*/package.json'):
              try:
                  data = json.loads(p.read_text())
              except Exception:
                  continue
              manifests.append((p, data))
          mcp_exists = any(d.get('name') == '@deepseek-ai/dsh-mcp-client' for _, d in manifests)
          refs = []
          for p in (root / 'examples').rglob('*'):
              if not p.is_file() or p.name == 'package.json':
                  continue
              try:
                  if '@deepseek-ai/dsh-mcp-client' in p.read_text(errors='ignore'):
                      refs.append(str(p))
              except Exception:
                  pass
          examples = root / 'examples/package.json'
          ex = json.loads(examples.read_text())
          if mcp_exists and refs and '@deepseek-ai/dsh-mcp-client' not in ex.get('dependencies', {}):
              deps = ex.setdefault('dependencies', {})
              deps['@deepseek-ai/dsh-mcp-client'] = 'workspace:*'
              ex['dependencies'] = dict(sorted(deps.items()))
              examples.write_text(json.dumps(ex, indent=2, ensure_ascii=False) + '\n')
              print('Declared MCP client for examples; references:', ', '.join(refs))
          else:
              print('MCP dependency state:', {'workspace_package': mcp_exists, 'references': refs})

          # 3) Add concise API documentation only to the exports identified by
          # verify-export-jsdoc. The checker is kept intact.
          targets = {
              'packages/credentials/authorization/src/index.ts': [
                  'InMemorySecretStore',
              ],
              'packages/credentials/authorization/src/types.ts': [
                  'SecretAuthorizationError',
              ],
              'packages/llm/llm-pi-ai/src/login.ts': [
                  'codexLoginStatus', 'loginCodex', 'logoutCodex', 'displayStatus',
              ],
              'packages/subagent/subagent-codex/src/account.ts': [
                  'CodexLoginRequiredError', 'assertCodexLoginAvailable',
                  'normalizeCodexLoginError', 'primeCodexChatGptAuth',
                  'loadCodexChatGptAuth', 'codexAuthCapability', 'codexAuthStatus',
                  'codexLoginRequiredMessage', 'loadCodexAccessToken',
                  'persistCodexChatGptAuth', 'clearCodexChatGptAuth',
                  'codexSecretEnvKeys', 'codexChatGptTransportAllowed',
              ],
          }
          for rel, names in targets.items():
              p = root / rel
              if not p.exists():
                  print('JSDoc target file absent:', rel)
                  continue
              src = p.read_text()
              for name in names:
                  # Match exported declarations while preserving indentation.
                  pat = re.compile(r'(?m)^(?P<indent>[ \t]*)export\s+(?:(?:async|abstract)\s+)*(?:class|function|const|let|var)\s+' + re.escape(name) + r'\b')
                  m = pat.search(src)
                  if not m:
                      print('JSDoc declaration not found:', rel, name)
                      continue
                  line_start = m.start()
                  prefix = src[max(0, line_start-600):line_start]
                  # If the declaration already has a JSDoc immediately above it,
                  # leave it untouched.
                  if re.search(r'/\*\*[\s\S]*?\*/\s*$', prefix):
                      continue
                  indent = m.group('indent')
                  doc = f"{indent}/** Public PHOENIX contract for `{name}`. */\n"
                  src = src[:line_start] + doc + src[line_start:]
              p.write_text(src)
          PY

      - name: Refresh lockfile when package metadata changed
        run: pnpm install --lockfile-only
      - name: Refresh generated documentation contracts
        shell: bash
        run: |
          pnpm run gen-cordis-catalog
          pnpm run gen-cordis-api
          pnpm run gen-client-catalog
          pnpm run gen-tool-catalog
          pnpm run gen-config-catalog
          pnpm run gen-doc-graphs
          pnpm run gen-persistence-catalog
          pnpm run gen-module-graph
          pnpm run gen-scoped-events
      - name: Verify deterministic subset
        shell: bash
        run: |
          pnpm run constraints
          pnpm run verify-export-jsdoc
      - name: Commit repairs
        shell: bash
        run: |
          git status --short
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'PHOENIX CI Autofix'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/check-workspace-constraints.ts examples/package.json pnpm-lock.yaml \
            packages/credentials/authorization/src/index.ts \
            packages/credentials/authorization/src/types.ts \
            packages/llm/llm-pi-ai/src/login.ts \
            packages/subagent/subagent-codex/src/account.ts \
            .agents/skills/deepseek-dsh/SKILL.md docs README.md 2>/dev/null || true
          git add -u
          git commit -m 'fix(ci): repair static contracts [phoenix-autofix]'
          git push origin HEAD:phoenix/evolution-current-v16
