name: Mission Runtime contract refresh

on:
  push:
    branches:
      - feat/mission-runtime-codex-patterns-20260930

permissions:
  contents: write

concurrency:
  group: mission-runtime-contract-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_EXAMPLE_MODE: lib
      DSH_SNAPSHOT_MAX_CONCURRENCY: '4'
      DSH_WEB_SNAPSHOT_WORKERS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/mission-runtime-codex-patterns-20260930
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Prepare sandbox
        run: bash scripts/prepare-ci-bubblewrap.sh
      - name: Verify bilingual catalogs
        run: pnpm run verify-translation-pairing
      - name: Build official runtime
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: pnpm run build
      - name: Refresh ACP/headless snapshots from replay fixtures
        run: pnpm run test:snapshot:refresh
      - name: Commit refreshed contracts
        run: |
          if git diff --quiet; then
            echo "No snapshot refresh changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(mission): refresh interface contracts"
          git push origin HEAD:feat/mission-runtime-codex-patterns-20260930
