name: Temporary Cordis sync main

on:
  push:
    branches:
      - codex/cordis-visual-workspace-20260913
    paths:
      - .github/workflows/tmp-cordis-sync-main.yml

permissions:
  contents: write

jobs:
  sync-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/cordis-visual-workspace-20260913
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Regenerate merged lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit and push merged tree
        run: |
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(lock): reconcile Cordis workspace with main"
          fi
          git push origin HEAD:codex/cordis-visual-workspace-20260913
