name: PHOENIX public distribution · secret patterns
on:
  pull_request:
  push:
    branches: [main, stable]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tracked-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan tracked release source without disclosing secret values
        run: node scripts/phoenix-public-secret-audit.mjs
