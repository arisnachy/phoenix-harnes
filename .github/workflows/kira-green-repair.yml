name: KIRA Green Repair

on:
  push:
    branches: [kira/green-gate-20260919]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: kira-green-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: (github.event_name == 'push' || github.head_ref == 'kira/green-gate-20260919') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install mutable repair workspace
        run: pnpm install --no-frozen-lockfile

      - name: Regenerate authoritative repository artifacts
        run: |
          set -euo pipefail
          pnpm run prepare:change
          pnpm run gen-cordis-api
          pnpm run gen-tool-catalog
          pnpm run verify-translation-pairing --write --all

      - name: Commit deterministic repairs
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet && [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git config user.name "kira-green-gate"
          git config user.email "kira-green-gate@users.noreply.github.com"
          git add -A
          git commit -m "chore(gates): refresh generated repository artifacts"
          git push origin "HEAD:$TARGET_BRANCH"
