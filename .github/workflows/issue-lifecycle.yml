name: Issue lifecycle

on:
  issues:
    types:
      - opened
      - edited
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - closed
      - reopened
      - field_added
      - field_removed
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - review_requested
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Issue lifecycle
    # ProjectV2 mutation is upstream-specific infrastructure, not a correctness
    # test. Downstreams opt in only after configuring their own App credentials
    # and project policy. If enabled, missing credentials still fail closed.
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Report lifecycle disabled
        if: ${{ vars.DSH_ISSUE_LIFECYCLE_ENABLED != '1' }}
        run: echo "::notice::ProjectV2 issue lifecycle is disabled for this downstream. Set DSH_ISSUE_LIFECYCLE_ENABLED=1 only after configuring this repository's App credentials and project policy."

      - name: Create project token
        id: app-token
        if: ${{ vars.DSH_ISSUE_LIFECYCLE_ENABLED == '1' && (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.DSH_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DSH_ISSUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Handle repository event
        if: ${{ vars.DSH_ISSUE_LIFECYCLE_ENABLED == '1' && (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/issue-management/policy.mjs lifecycle
