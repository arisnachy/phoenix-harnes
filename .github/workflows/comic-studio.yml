name: Comic Studio
on:
  push:
    branches: [main, stable]
    paths:
      - 'scripts/phoenix-comic-studio*.mjs'
      - 'scripts/phoenix-comic-recovery*.mjs'
      - 'scripts/phoenix-comic-canon*.mjs'
      - 'scripts/comic-page-layout*.mjs'
      - 'packages/hardness/adapters/src/comic-tool.ts'
      - 'packages/client/ui-conversation/src/client/chat/HardnessArtifactBody.tsx'
      - 'packages/hardness/adapters/tests/comic-tool.spec.ts'
      - '.github/workflows/comic-studio.yml'
  pull_request:
    paths:
      - 'scripts/phoenix-comic-studio*.mjs'
      - 'scripts/phoenix-comic-recovery*.mjs'
      - 'scripts/phoenix-comic-canon*.mjs'
      - 'scripts/comic-page-layout*.mjs'
      - '.github/workflows/comic-studio.yml'
jobs:
  test-comic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/phoenix-comic-studio.test.mjs scripts/comic-page-layout.test.mjs scripts/phoenix-comic-recovery.test.mjs scripts/phoenix-comic-canon.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/hardness/adapters/tests/comic-tool.spec.ts packages/client/ui-conversation/tests/comic-studio.client.spec.tsx