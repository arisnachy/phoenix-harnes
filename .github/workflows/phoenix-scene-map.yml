name: PHOENIX Native Fictional Maps
on:
  pull_request:
    paths:
      - 'packages/client/ui-conversation/src/client/chat/SceneMap*'
      - 'packages/client/ui-conversation/src/client/chat/GenerativeUi.tsx'
      - 'packages/client/ui-conversation/src/client/chat/HardnessArtifactBody.tsx'
      - 'packages/client/ui-conversation/tests/scene-map.client.spec.tsx'
      - 'apps/cli/config/agent-presets/code/skills/geo-intelligence/SKILL.md'
      - '.github/workflows/phoenix-scene-map.yml'
  push:
    branches: [main]
    paths:
      - 'packages/client/ui-conversation/src/client/chat/SceneMap*'
      - 'packages/client/ui-conversation/src/client/chat/GenerativeUi.tsx'
      - 'packages/client/ui-conversation/src/client/chat/HardnessArtifactBody.tsx'
      - 'packages/client/ui-conversation/tests/scene-map.client.spec.tsx'
      - '.github/workflows/phoenix-scene-map.yml'
jobs:
  fiction-map:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify actual chat map rendering and interactive selection
        run: pnpm exec vitest run packages/client/ui-conversation/tests/scene-map.client.spec.tsx packages/client/ui-conversation/tests/geo-map.client.spec.ts
      - name: Compile native client including scene_map
        run: pnpm exec tsc -b tsconfig.client.json
