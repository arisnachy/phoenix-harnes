name: PHOENIX P0 bilingual diff diagnostic

on:
  push:
    branches:
      - fix/p0-main-stable-release-integrity
    paths:
      - .github/workflows/p0-i18n-diff.yml

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/p0-main-stable-release-integrity
          fetch-depth: 0
      - name: Show semantic deltas since last bilingual-consistent English blobs
        shell: bash
        run: |
          set -euo pipefail
          show_delta() {
            local path="$1"
            local old_blob="$2"
            echo "===== $path ====="
            git cat-file -p "$old_blob" > /tmp/old-doc
            diff -u /tmp/old-doc "$path" || true
          }
          show_delta docs/config-catalog.md 3e93dd703a8194cd012661ada072b946aef44ecd
          show_delta docs/event-producer-consumer.md 9e08d176f0e9344ff7de4e5efe46fc521c177570
          show_delta docs/module-graph.md 042ae370a847603a7c48e20b869f7637a86a6270
          show_delta docs/persistence-catalog.md 1f419d88284f17bbeda46186eb69c87103be2cf8
