name: PHOENIX MLB evidence research
on:
  pull_request:
    paths:
      - 'packages/core/tool-sports/src/mlb-evidence-research.ts'
      - 'packages/core/tool-sports/src/mlb-market-research-review.ts'
      - 'packages/core/tool-sports/tests/mlb-evidence-research.test.mjs'
      - 'packages/core/tool-sports/src/index.ts'
      - '.github/workflows/phoenix-mlb-evidence-research.yml'
  workflow_dispatch:
jobs:
  mlb-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify MLB pregame evidence and roster matchups
        run: node --experimental-strip-types --test packages/core/tool-sports/tests/mlb-evidence-research.test.mjs
      - name: Verify MLB source TypeScript
        run: pnpm exec tsc -b tsconfig.host.json --pretty false
