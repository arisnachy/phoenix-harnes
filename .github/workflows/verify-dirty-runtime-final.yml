name: Verify dirty runtime final

on:
  push:
    branches:
      - candidate/dirty-runtime-final-clean-20260914

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e005a7f2691abd309e5b949558f31ab114a34a63
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Parse updater and Windows supervisor
        run: |
          node --check scripts/phoenix-auto-update.mjs
          node --check scripts/phoenix-windows-supervisor.mjs
      - name: Run updater contract tests
        run: corepack pnpm exec vitest run scripts/phoenix-update-contract.spec.ts
      - name: Run updater self-test
        run: node scripts/phoenix-auto-update.mjs --self-test
      - name: Full build
        run: corepack pnpm run build
