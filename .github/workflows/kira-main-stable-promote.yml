name: KIRA finalize main and promote stable

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  linux-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    outputs:
      final_sha: ${{ steps.commit.outputs.final_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Remove orphan Knip entry and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('knip.json')
          text = p.read_text()
          needle = '        "scripts/promote-client-artifacts.ts",\n'
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'Expected exactly one orphan Knip entry, found {count}')
          p.write_text(text.replace(needle, '', 1))
          PY
          git rm .github/workflows/kira-main-stable-promote.yml
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Verify Linux release gates
        run: |
          git diff --check
          pnpm run check:ci:static
          pnpm run typecheck
          pnpm exec vitest run \
            packages/host/apiproxy/tests/api-proxy-authorization.spec.ts \
            packages/host/apiproxy/tests/client-handler.spec.ts \
            packages/host/apiproxy/tests/fetch-carrier.spec.ts \
            packages/client/ui-settings-models/tests/authorization-panel.client.spec.tsx
          pnpm run build
      - name: Commit verified main repair
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(ci): remove orphan Knip entry before stable promotion'
          git push origin HEAD:main
          final_sha=$(git rev-parse HEAD)
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "Final main SHA: $final_sha"

  windows-wine:
    needs: linux-finalize
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.linux-finalize.outputs.final_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Install Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine
      - name: Run Wine Windows gates
        run: bash scripts/wine-windows-gates.sh
      - name: Shut down wineserver
        if: always()
        run: wineserver -k 2>/dev/null || true

  windows-native:
    needs: linux-finalize
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      DSH_GATE_CONCURRENCY: '1'
      DSH_PUBLINT_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.linux-finalize.outputs.final_sha }}
          persist-credentials: false
      - name: Enable Developer Mode
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install immutable workspace
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Run required native Windows gates
        shell: pwsh
        run: pnpm run check:ci:windows-blocking

  promote-stable:
    needs: [linux-finalize, windows-wine, windows-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.linux-finalize.outputs.final_sha }}
          fetch-depth: 0
      - name: Promote exact verified SHA to stable
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ needs.linux-finalize.outputs.final_sha }}'
          git fetch origin main
          current_main=$(git rev-parse origin/main)
          if [ "$current_main" != "$sha" ]; then
            echo "main moved during validation: expected $sha, got $current_main" >&2
            exit 1
          fi
          git push origin "$sha:refs/heads/stable"
          remote_stable=$(git ls-remote origin refs/heads/stable | cut -f1)
          if [ "$remote_stable" != "$sha" ]; then
            echo "stable mismatch: expected $sha, got $remote_stable" >&2
            exit 1
          fi
          echo "stable now points exactly to $sha"
