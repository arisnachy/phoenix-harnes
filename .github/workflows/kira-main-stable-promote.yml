name: KIRA finalize main and promote stable

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  prepare-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    outputs:
      final_sha: ${{ steps.commit.outputs.final_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Remove obsolete Knip entry if present and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('knip.json')
          text = p.read_text()
          orphan = '        "scripts/promote-client-artifacts.ts",\n'
          if orphan in text:
              p.write_text(text.replace(orphan, '', 1))
          PY
          git rm .github/workflows/kira-main-stable-promote.yml

      - name: Repair and freeze workspace lockfile
        run: |
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Regenerate canonical repository-owned surfaces
        run: |
          pnpm run gen-client-catalog
          pnpm run gen-cordis-api
          pnpm run gen-config-catalog
          pnpm run gen-doc-graphs
          pnpm run gen-module-graph
          pnpm run gen-cordis-catalog

      - name: Synchronize paired generated technical structures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/codex-plugin-arsenal.md')
          text = p.read_text()
          switcher = 'English | [中文](codex-plugin-arsenal.zh.md)'
          if switcher not in text:
              lines = text.splitlines()
              if not lines or not lines[0].startswith('# '):
                  raise SystemExit('codex-plugin-arsenal.md has no H1')
              lines[1:1] = ['', switcher]
              p.write_text('\n'.join(lines) + ('\n' if text.endswith('\n') else ''))

          en_path = Path('docs/config-catalog.md')
          zh_path = Path('docs/config-catalog.zh.md')
          en = en_path.read_text()
          zh = zh_path.read_text()
          timeout_anchor = '<a id="deepseek-aidsh-tool-call-timeout-policy"></a>'
          next_anchor = '<a id="deepseek-aidsh-tool-fs"></a>'
          if timeout_anchor in en and timeout_anchor not in zh:
              start = en.index(timeout_anchor)
              end = en.index(next_anchor, start)
              section = en[start:end]
              section = section.replace('\nRequires: `tools`\n', '\n需要：`tools`\n', 1)
              section = section.replace('\nSource: [', '\n来源：[', 1)
              if next_anchor not in zh:
                  raise SystemExit('config-catalog Chinese insertion anchor missing')
              zh = zh.replace(next_anchor, section + next_anchor, 1)
              zh = re.sub(r'^- `@deepseek-ai/dsh-tool-call-timeout-policy`[^\n]*\n', '', zh, count=1, flags=re.M)

          fence = re.compile(r'```ts config-catalog\n.*?\n```', re.S)
          en_blocks = fence.findall(en)
          zh_blocks = fence.findall(zh)
          if len(en_blocks) != len(zh_blocks):
              raise SystemExit(f'config-catalog fence count differs: EN={len(en_blocks)} ZH={len(zh_blocks)}')
          iterator = iter(en_blocks)
          zh = fence.sub(lambda _: next(iterator), zh)
          zh_path.write_text(zh)

          en_path = Path('docs/module-graph.md')
          zh_path = Path('docs/module-graph.zh.md')
          en = en_path.read_text()
          zh = zh_path.read_text()
          mermaid = re.compile(r'```mermaid\n.*?\n```', re.S)
          en_graph = mermaid.search(en)
          zh_graph = mermaid.search(zh)
          if not en_graph or not zh_graph:
              raise SystemExit('module graph mermaid block missing')
          zh = zh[:zh_graph.start()] + en_graph.group(0) + zh[zh_graph.end():]

          def table_span(text: str):
              lines = text.splitlines(keepends=True)
              start = next((i for i, line in enumerate(lines) if line.startswith('| Package | Group | Depends on |')), None)
              if start is None:
                  raise SystemExit('module graph technical table header missing')
              end = start
              while end < len(lines) and lines[end].startswith('|'):
                  end += 1
              return lines, start, end

          en_lines, es, ee = table_span(en)
          zh_lines, zs, ze = table_span(zh)
          zh_lines[zs:ze] = en_lines[es:ee]
          zh_path.write_text(''.join(zh_lines))
          PY

      - name: Refresh and verify bilingual pairing records
        run: |
          pnpm run verify-translation-pairing --write \
            .agents/notes/implemented/process/2026-08-24-phoenix-package-scope-migration.md \
            docs/codex-plugin-arsenal.md \
            docs/config-catalog.md \
            docs/event-producer-consumer.md \
            docs/module-graph.md \
            docs/subsystems/credentials.md \
            docs/subsystems/sandbox.md \
            docs/subsystems/subprocess.md \
            docs/superpowers/plans/2026-08-26-web-search-free-fallback.md \
            docs/superpowers/specs/2026-08-26-web-search-free-fallback-design.md \
            packages/credentials/authorization/README.md \
            packages/sandbox/sandbox-policy/README.md
          pnpm run verify-translation-pairing
          git diff --check

      - name: Commit prepared main head
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(ci): finalize release surfaces for stable'
          git push origin HEAD:main
          final_sha=$(git rev-parse HEAD)
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "Final main SHA: $final_sha"

  linux-diagnostic:
    needs: prepare-main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-main.outputs.final_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Linux static diagnostic
        continue-on-error: true
        run: pnpm run check:ci:static
      - name: Linux typecheck diagnostic
        continue-on-error: true
        run: pnpm run typecheck
      - name: Linux Auth/Disconnect regressions
        continue-on-error: true
        run: >-
          pnpm exec vitest run
          packages/host/apiproxy/tests/api-proxy-authorization.spec.ts
          packages/host/apiproxy/tests/client-handler.spec.ts
          packages/host/apiproxy/tests/fetch-carrier.spec.ts
          packages/client/ui-settings-models/tests/authorization-panel.client.spec.tsx
      - name: Linux build diagnostic
        continue-on-error: true
        run: pnpm run build

  windows-wine:
    needs: prepare-main
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-main.outputs.final_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Install Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine
      - name: Run Wine Windows gates
        run: bash scripts/wine-windows-gates.sh
      - name: Shut down wineserver
        if: always()
        run: wineserver -k 2>/dev/null || true

  windows-native:
    needs: prepare-main
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      DSH_GATE_CONCURRENCY: '1'
      DSH_PUBLINT_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-main.outputs.final_sha }}
          persist-credentials: false
      - name: Enable Developer Mode
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install immutable workspace
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Run required native Windows gates
        shell: pwsh
        run: pnpm run check:ci:windows-blocking
      - name: Run Auth/Disconnect regressions on Windows
        shell: pwsh
        run: >-
          pnpm exec vitest run
          packages/host/apiproxy/tests/api-proxy-authorization.spec.ts
          packages/host/apiproxy/tests/client-handler.spec.ts
          packages/host/apiproxy/tests/fetch-carrier.spec.ts
          packages/client/ui-settings-models/tests/authorization-panel.client.spec.tsx

  promote-stable:
    needs: [prepare-main, windows-wine, windows-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-main.outputs.final_sha }}
          fetch-depth: 0
      - name: Promote exact Windows-verified SHA to stable
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ needs.prepare-main.outputs.final_sha }}'
          git fetch origin main
          current_main=$(git rev-parse origin/main)
          if [ "$current_main" != "$sha" ]; then
            echo "main moved during Windows validation: expected $sha, got $current_main" >&2
            exit 1
          fi
          git push origin "$sha:refs/heads/stable"
          remote_stable=$(git ls-remote origin refs/heads/stable | cut -f1)
          if [ "$remote_stable" != "$sha" ]; then
            echo "stable mismatch: expected $sha, got $remote_stable" >&2
            exit 1
          fi
          echo "stable now points exactly to $sha"
