name: Phoenix repair Knip diagnostics

on:
  push:
    branches: [repair-knip-20260927]

permissions:
  contents: read

jobs:
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair-knip-20260927
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Knip compact diagnostics
        shell: bash
        run: |
          set +e
          pnpm exec knip --reporter compact --treat-config-hints-as-errors 2>&1 | tee /tmp/knip.log
          code=${PIPESTATUS[0]}
          echo "KNIP_EXIT=${code}"
          exit "${code}"
