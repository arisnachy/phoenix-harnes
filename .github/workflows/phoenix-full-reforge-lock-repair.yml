name: PHOENIX Full Reforge Lock Repair

on:
  push:
    branches:
      - phoenix/full-reforge-20260824

permissions:
  contents: write

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  repair-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phoenix/full-reforge-20260824
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Validate bounded lockfile repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- pnpm-lock.yaml
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          read -r added deleted < <(git diff --numstat -- pnpm-lock.yaml | awk '{print $1, $2}')
          echo "Lockfile delta: +${added} -${deleted}"
          if [ "${added}" -gt 220 ] || [ "${deleted}" -gt 5 ]; then
            echo "Refusing lockfile rewrite outside audited bounds."
            git diff --stat -- pnpm-lock.yaml
            exit 1
          fi
          diff=$(git diff -- pnpm-lock.yaml)
          grep -q '@deepseek-ai/dsh-authorization' <<<"${diff}"
          grep -q 'packages/client/ui-kira-teams' <<<"${diff}"
          grep -q 'packages/client/ui-settings-profile' <<<"${diff}"
          grep -q 'packages/mcp/chrome-connector' <<<"${diff}"
          grep -q 'packages/phoenix/continuity' <<<"${diff}"
          grep -q 'packages/profile/user-profile' <<<"${diff}"
          grep -q 'packages/web/web-search-openrouter' <<<"${diff}"
      - name: Commit exact repair
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --check
          git commit -m "chore(lock): synchronize full-reforge workspace importers"
          git push origin HEAD:phoenix/full-reforge-20260824
