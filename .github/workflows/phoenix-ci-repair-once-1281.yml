name: PHOENIX repair PR 1281 (one-time)

on:
  push:
    branches:
      - feat/compact-espn-live-game-center-20261031

permissions:
  contents: write

concurrency:
  group: phoenix-ci-repair-once-1281
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[run-ci-repair-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Run official fixers and generators without changing CI thresholds
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          run_repair() {
            echo "::group::Repair: $*"
            if "$@"; then
              echo "PASS: $*"
            else
              code=$?
              echo "::warning::Repair command failed ($code): $*"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          }
          run_repair pnpm run lint:fix
          run_repair pnpm run gen-cordis-catalog
          run_repair pnpm run gen-client-catalog
          run_repair pnpm run gen-tool-catalog
          run_repair pnpm run gen-config-catalog
          run_repair pnpm run gen-doc-graphs
          run_repair pnpm run gen-module-graph
          run_repair pnpm run gen-persistence-catalog
          run_repair pnpm run gen-cordis-inspect-catalog
          echo "REPAIR_COMMAND_FAILURES=$failures" >> "$GITHUB_ENV"
          echo "### PHOENIX auto-generated repair" >> "$GITHUB_STEP_SUMMARY"
          echo "Commands failed: $failures (not hidden)" >> "$GITHUB_STEP_SUMMARY"
          git status --short | head -100 || true
      - name: Commit generated and autofixed sources into PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source modifications produced by repair commands.'
            exit 0
          fi
          git diff --cached --stat | tail -60
          git commit -m 'fix(ci): apply official lint autofixes and regenerate stale catalogs'
          git push origin HEAD:refs/heads/feat/compact-espn-live-game-center-20261031
          echo 'Auto-fix commit published. A follow-up user-authored commit must trigger CI.'
      - name: Record incomplete generator runs
        if: env.REPAIR_COMMAND_FAILURES != '0'
        shell: bash
        run: |
          echo "::error::Some official repair commands failed. Inspect job logs; this does not certify the CI as passing."
          exit 1
