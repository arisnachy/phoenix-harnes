name: PHOENIX fork portability repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phoenix-fork-portability-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PHOENIX head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch issue-management repository identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          policy_path = Path('.github/issue-management/policy.mjs')
          policy = policy_path.read_text()

          anchor = """if (typeof config.lifecycleActor !== 'string' || !config.lifecycleActor) {
            throw new Error('config.lifecycleActor 未设置')
          }
          """
          insert = anchor + """
          /** Resolve the repository that emitted the workflow event. Project ownership
           * remains separately configured because a downstream may use a different
           * repository owner while retaining or replacing its Project policy.
           * @param {string|undefined} value GitHub owner/repository slug.
           * @returns {{owner: string, repository: string, slug: string}} Coordinates.
           */
          export function resolveRepositoryCoordinates(value = process.env.GITHUB_REPOSITORY) {
            const fallback = `${config.organization}/${config.repository}`
            const raw = (value?.trim() || fallback)
            const parts = raw.split('/')
            if (parts.length !== 2 || parts.some((part) => !/^[A-Za-z0-9_.-]+$/.test(part))) {
              throw new Error(`GITHUB_REPOSITORY 非法：${raw}`)
            }
            const [owner, repository] = parts
            return { owner, repository, slug: `${owner}/${repository}` }
          }

          const ACTIVE_REPOSITORY = resolveRepositoryCoordinates()
          """
          if anchor not in policy:
              raise SystemExit('policy insertion anchor not found')
          policy = policy.replace(anchor, insert, 1)

          old_repo = "/repos/${config.organization}/${config.repository}"
          new_repo = "/repos/${ACTIVE_REPOSITORY.owner}/${ACTIVE_REPOSITORY.repository}"
          count = policy.count(old_repo)
          if count < 1:
              raise SystemExit('no hard-coded REST repository references found')
          policy = policy.replace(old_repo, new_repo)

          old_parse = "repository: `${config.organization}/${config.repository}`"
          if old_parse not in policy:
              raise SystemExit('reference parser repository anchor not found')
          policy = policy.replace(old_parse, "repository: ACTIVE_REPOSITORY.slug", 1)

          old_query = """    `query(
                $organization: String!
                $repository: String!
                $number: Int!
                $project: Int!
                $includeStatusActor: Boolean!
              ) {
                organization(login: $organization) {
          """
          new_query = """    `query(
                $projectOwner: String!
                $repositoryOwner: String!
                $repository: String!
                $number: Int!
                $project: Int!
                $includeStatusActor: Boolean!
              ) {
                organization(login: $projectOwner) {
          """
          if old_query not in policy:
              raise SystemExit('GraphQL query owner anchor not found')
          policy = policy.replace(old_query, new_query, 1)

          old_repository_owner = "repository(owner: $organization, name: $repository)"
          if old_repository_owner not in policy:
              raise SystemExit('GraphQL repository owner anchor not found')
          policy = policy.replace(
              old_repository_owner,
              "repository(owner: $repositoryOwner, name: $repository)",
              1,
          )

          old_vars = """    {
                organization: config.organization,
                repository: config.repository,
                number,
                project: config.projectNumber,
                includeStatusActor,
              },
          """
          new_vars = """    {
                projectOwner: config.organization,
                repositoryOwner: ACTIVE_REPOSITORY.owner,
                repository: ACTIVE_REPOSITORY.repository,
                number,
                project: config.projectNumber,
                includeStatusActor,
              },
          """
          if old_vars not in policy:
              raise SystemExit('GraphQL variables anchor not found')
          policy = policy.replace(old_vars, new_vars, 1)
          policy_path.write_text(policy)

          test_path = Path('.github/issue-management/policy.test.mjs')
          tests = test_path.read_text()
          import_anchor = "  parseReferences,\n"
          if import_anchor not in tests:
              raise SystemExit('test import anchor not found')
          tests = tests.replace(
              import_anchor,
              import_anchor + "  resolveRepositoryCoordinates,\n",
              1,
          )
          tests += """

          test('resolves the active downstream repository independently of project config', () => {
            assert.deepEqual(resolveRepositoryCoordinates('arisnachy/phoenix-harnes'), {
              owner: 'arisnachy',
              repository: 'phoenix-harnes',
              slug: 'arisnachy/phoenix-harnes',
            })
          })

          test('rejects malformed workflow repository coordinates', () => {
            assert.throws(() => resolveRepositoryCoordinates('broken/repo/slug'), /GITHUB_REPOSITORY/)
          })
          """
          test_path.write_text(tests)
          PY

      - name: Run issue-management unit tests
        run: node --test .github/issue-management/policy.test.mjs

      - name: Show targeted diff
        run: git diff --check && git diff -- .github/issue-management/policy.mjs .github/issue-management/policy.test.mjs

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/issue-management/policy.mjs .github/issue-management/policy.test.mjs
          git commit -m "fix(ci): resolve active repository in issue policy"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
