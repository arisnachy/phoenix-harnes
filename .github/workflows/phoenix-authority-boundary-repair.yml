name: PHOENIX authority boundary repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phoenix-authority-boundary-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PHOENIX head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile

      - name: Enforce capability-authority separation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              return updated

          ladder_path = Path('packages/phoenix/runtime/src/model-ladder.ts')
          ladder = ladder_path.read_text()
          ladder = sub_once(
              ladder,
              r"interface EvidencePoint \{\n  score: number\n  weight: number\n  observedAt: number\n\}",
              "interface EvidencePoint {\n  score: number\n  weight: number\n  observedAt: number\n  source: EvidenceSource\n}",
              'evidence source field',
          )
          old_line = "      observedAt: evidence.observedAt ?? Date.now(),"
          if ladder.count(old_line) != 1:
              raise SystemExit(f'observedAt anchor count={ladder.count(old_line)}')
          ladder = ladder.replace(old_line, old_line + "\n      source: evidence.source,", 1)

          old = "if (state.trust !== 'quarantined' && this.hasOperationalEvidence(state)) state.trust = 'qualified'"
          if ladder.count(old) != 1:
              raise SystemExit('qualification anchor missing')
          ladder = ladder.replace(old, "if (state.trust !== 'quarantined' && this.hasAuthorityEvidence(state)) state.trust = 'qualified'", 1)

          old = "state.trust = this.hasOperationalEvidence(state) ? 'qualified' : 'provisional'"
          if ladder.count(old) != 1:
              raise SystemExit('quarantine release anchor missing')
          ladder = ladder.replace(old, "state.trust = this.hasAuthorityEvidence(state) ? 'qualified' : 'provisional'", 1)

          ladder = sub_once(
              ladder,
              r"  private hasOperationalEvidence\(state: ModelState\): boolean \{.*?\n  \}\n\n  private dimensionSnapshot",
              """  private hasAuthorityEvidence(state: ModelState): boolean {
            let weightedSamples = 0
            for (const points of state.evidence.values()) {
              for (const point of points) {
                if (point.source === 'benchmark' || point.source === 'operator') weightedSamples += point.weight
              }
            }
            return weightedSamples >= 3
          }

          private dimensionSnapshot""",
              'authority evidence function',
              re.S,
          )
          ladder_path.write_text(ladder)

          runtime_path = Path('packages/phoenix/runtime/src/index.ts')
          runtime = runtime_path.read_text()
          runtime = sub_once(
              runtime,
              r"  recordBenchmark\(evidence: CapabilityEvidence\): void \{.*?\n  \}\n\n  quarantine",
              """  recordBenchmark(evidence: CapabilityEvidence): void {
            if (evidence.source !== 'benchmark' && evidence.source !== 'operator') {
              throw new Error('PHOENIX authority evidence must come from benchmark or operator sources')
            }
            const safe: CapabilityEvidence = { ...evidence }
            this.ladder.record(safe)
            if (this.config.localEvolution) {
              this.localState.evidence.push(safe)
              this.localState.evidence = this.localState.evidence.slice(-5000)
              this.flushState()
            }
          }

          quarantine""",
              'recordBenchmark authority gate',
              re.S,
          )
          runtime_path.write_text(runtime)

          test_path = Path('packages/phoenix/runtime/tests/model-ladder.spec.ts')
          tests = test_path.read_text()
          close = '\n})\n'
          if not tests.endswith(close):
              raise SystemExit('model-ladder describe closing anchor missing')
          addition = """

            it('never grants authority from mission or collective observation alone', () => {
              const ladder = new ModelCapabilityLadder()
              for (let i = 0; i < 40; i++) {
                ladder.record({ ...A, dimension: 'reliability', score: 100, source: 'mission', reproducible: true })
                ladder.record({ ...A, dimension: 'reasoning', score: 100, source: 'collective-observation', reproducible: true })
              }
              expect(ladder.snapshot(A)?.trust).toBe('provisional')
              expect(ladder.rank('routine')).toEqual([])
            })

            it('returns to provisional after quarantine when only non-authority evidence exists', () => {
              const ladder = new ModelCapabilityLadder()
              for (let i = 0; i < 20; i++) {
                ladder.record({ ...A, dimension: 'reliability', score: 99, source: 'mission', reproducible: true })
              }
              ladder.quarantine(A)
              ladder.releaseQuarantine(A)
              expect(ladder.snapshot(A)?.trust).toBe('provisional')
            })
          """
          tests = tests[:-len(close)] + addition + close
          test_path.write_text(tests)
          PY

      - name: Run PHOENIX ladder tests
        run: pnpm exec vitest run packages/phoenix/runtime/tests/model-ladder.spec.ts

      - name: Typecheck PHOENIX package surface
        run: pnpm exec tsc -p packages/phoenix/runtime/tsconfig.json --noEmit

      - name: Validate diff
        run: git diff --check

      - name: Commit authority hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/phoenix/runtime/src/model-ladder.ts packages/phoenix/runtime/src/index.ts packages/phoenix/runtime/tests/model-ladder.spec.ts
          git commit -m "fix(phoenix): separate mission evidence from authority"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
