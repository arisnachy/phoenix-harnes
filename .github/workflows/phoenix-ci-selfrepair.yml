name: PHOENIX one-shot CI repair

on:
  push:
    branches:
      - fix/ci-general-repair-20261031

permissions:
  contents: write

concurrency:
  group: phoenix-ci-selfrepair
  cancel-in-progress: false

jobs:
  selfrepair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository lint autofixes and keep partial fixes
        shell: bash
        run: |
          set +e
          pnpm run lint:fix:contracts-ready
          result=$?
          echo "Autofix exit=$result; remaining lint violations will still be enforced by regular CI."
          exit 0
      - name: Regenerate source-derived catalogs and migrate canonical fixtures
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          for script in gen-cordis-catalog gen-client-catalog gen-config-catalog gen-tool-catalog gen-doc-graphs gen-module-graph gen-scoped-events gen-persistence-catalog gen-third-party-notices migrate:packed-session-fixtures; do
            echo "=== pnpm run $script ==="
            pnpm run "$script" || { echo "Generator failed: $script"; failures=$((failures + 1)); }
          done
          echo "Generator failures: $failures; no quality gate was disabled."
      - name: Review diff and commit generated repairs
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat
          git add -u
          if ! git diff --cached --quiet; then
            git -c user.name='PHOENIX CI Repair' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'fix(ci): apply official lint autofixes and regenerate committed catalogs'
            git push origin HEAD:refs/heads/fix/ci-general-repair-20261031
          fi
