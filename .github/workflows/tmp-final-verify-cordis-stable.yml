name: Temporary final verify Cordis stable backport

on:
  push:
    branches:
      - backport/cordis-visual-workspace-stable-20260913

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run packages/client/ui-layout/tests/layout-store.client.spec.ts packages/client/ui-layout/tests/service.client.spec.ts packages/client/ui-layout/tests/visual-workspace-frame.client.spec.tsx packages/client/ui-workspace/tests/apply.client.spec.ts packages/client/ui-workspace/tests/cordis-visual-workspace.client.spec.ts packages/client/ui-kira-teams/tests/browser-plugin.client.spec.ts packages/client/ui-subagent/tests/browser-plugin.client.spec.ts
      - run: pnpm run verify-cordis-catalog
      - run: pnpm run verify-client-catalog
