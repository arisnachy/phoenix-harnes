name: Updater Same-SHA Regression

on:
  push:
    branches:
      - fix/update-same-sha-loop

permissions:
  contents: read

jobs:
  updater-same-sha:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check updater control plane
        run: |
          node --check scripts/phoenix-auto-update.mjs
          node --check scripts/phoenix-prepared-restart-bridge.mjs
          node --check scripts/phoenix-update-state.mjs
          node --check scripts/phoenix-windows-supervisor.mjs

      - name: Prove prepared bridge is idempotent for the active SHA
        env:
          PHOENIX_UPDATE_SUPERVISED: "1"
        run: |
          set -euo pipefail
          control="$(mktemp -d)"
          runtime="$(mktemp -d)"
          trap 'rm -rf "$control" "$runtime"' EXIT

          git -C "$runtime" init -q
          git -C "$runtime" config user.email phoenix-test@example.invalid
          git -C "$runtime" config user.name "Phoenix Test"
          printf 'active runtime\n' > "$runtime/README.md"
          git -C "$runtime" add README.md
          git -C "$runtime" commit -q -m "active runtime"
          target="$(git -C "$runtime" rev-parse HEAD)"

          printf '{"schema":1,"target":"%s","base":"%040d","mode":"full"}\n' "$target" 0 > "$control/phoenix-update-prepared.json"
          printf '{"schema":1,"target":"%s","path":"%s"}\n' "$target" "$runtime" > "$control/phoenix-active-runtime.json"

          node scripts/phoenix-prepared-restart-bridge.mjs \
            --wait-target "$target" \
            --common-dir "$control" \
            --timeout-ms 1000

          test ! -e "$control/phoenix-update-restart-request.json"
          test ! -e "$control/phoenix-host-restart-request.json"

      - name: Prove ready state is idempotent for the active SHA
        env:
          PHOENIX_UPDATE_SUPERVISED: "1"
          PHOENIX_AUTO_UPDATE: "1"
          PHOENIX_UPDATE_MODE: "auto"
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { existsSync, mkdtempSync, readFileSync, rmSync, writeFileSync } from 'node:fs'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import { writePhoenixUpdateState } from './scripts/phoenix-update-state.mjs'

          const root = mkdtempSync(join(tmpdir(), 'phoenix-same-sha-'))
          try {
            const git = (...args) => execFileSync('git', args, { cwd: root, encoding: 'utf8' }).trim()
            git('init')
            git('config', 'user.email', 'phoenix-test@example.invalid')
            git('config', 'user.name', 'Phoenix Test')
            writeFileSync(join(root, 'README.md'), 'active runtime\n', 'utf8')
            git('add', 'README.md')
            git('commit', '-m', 'active runtime')
            const target = git('rev-parse', 'HEAD')

            writeFileSync(join(root, 'phoenix-active-runtime.json'), JSON.stringify({
              schema: 1,
              target,
              path: root,
            }), 'utf8')
            writeFileSync(join(root, 'phoenix-update-restart-request.json'), JSON.stringify({
              schema: 1,
              target,
            }), 'utf8')
            writeFileSync(join(root, 'phoenix-host-restart-request.json'), JSON.stringify({
              schema: 1,
              kind: 'host-restart',
              reason: `verified stable update ${target.slice(0, 12)} ready; activate and restart`,
            }), 'utf8')

            const statePath = join(root, 'phoenix-update-state.json')
            writePhoenixUpdateState(statePath, { schema: 1, status: 'ready', target })

            const state = JSON.parse(readFileSync(statePath, 'utf8'))
            if (state.status !== 'current' || state.current !== target || state.target !== target) {
              throw new Error(`unexpected state: ${JSON.stringify(state)}`)
            }
            if (existsSync(join(root, 'phoenix-update-restart-request.json'))) {
              throw new Error('duplicate update restart request was not cleared')
            }
            if (existsSync(join(root, 'phoenix-host-restart-request.json'))) {
              throw new Error('duplicate host restart request was not cleared')
            }
          } finally {
            rmSync(root, { recursive: true, force: true })
          }
          NODE
