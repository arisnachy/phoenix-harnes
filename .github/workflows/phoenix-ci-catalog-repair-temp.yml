name: Phoenix temporary generated-catalog repair
on:
  push:
    branches: [fix/phoenix-ci-gates-20261010]
    paths:
      - .github/workflows/phoenix-ci-catalog-repair-temp.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate source-of-truth catalogs
        run: |
          pnpm run gen-doc-graphs
          pnpm run gen-cordis-catalog
          pnpm run gen-client-catalog
          pnpm run gen-tool-catalog
          pnpm run gen-config-catalog
      - name: Commit generated tracked content only
        run: |
          git config user.name 'phoenix-ci-repair[bot]'
          git config user.email 'phoenix-ci-repair@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'docs(generated): refresh Phoenix catalogs and graphs'
            git push origin HEAD:fix/phoenix-ci-gates-20261010
          fi
