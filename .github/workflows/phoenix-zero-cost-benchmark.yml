name: PHOENIX zero-cost harness benchmark rerun

on:
  workflow_dispatch:
  push:
    branches:
      - 'benchmark/phoenix-zero-cost-*'
    paths:
      - '.github/workflows/phoenix-zero-cost-benchmark.yml'
      - 'scripts/phoenix-zero-cost-benchmark.mjs'
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - '.github/workflows/phoenix-zero-cost-benchmark.yml'
      - 'scripts/phoenix-zero-cost-benchmark.mjs'
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

env:
  CI: '1'
  DSH_TELEMETRY_DISABLED: '1'
  OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  DEEPSEEK_API_KEY: ''
  GOOGLE_API_KEY: ''
  GEMINI_API_KEY: ''
  GROQ_API_KEY: ''
  OPENROUTER_API_KEY: ''
  XAI_API_KEY: ''

concurrency:
  group: phoenix-zero-cost-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-benchmark:
    name: deep deterministic harness benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile

      - name: Run zero-cost Phoenix benchmark
        run: PHOENIX_BENCH_DEEP=1 node scripts/phoenix-zero-cost-benchmark.mjs

      - name: Publish benchmark summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/phoenix-zero-cost-benchmark/benchmark-report.md ]]; then
            cat artifacts/phoenix-zero-cost-benchmark/benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# PHOENIX zero-cost harness benchmark" >> "$GITHUB_STEP_SUMMARY"
            echo "Benchmark report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-zero-cost-benchmark-deep-${{ github.run_id }}
          path: artifacts/phoenix-zero-cost-benchmark/
          if-no-files-found: warn
          retention-days: 30
