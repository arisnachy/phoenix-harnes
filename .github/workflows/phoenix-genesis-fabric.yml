      - '.github/workflows/phoenix-genesis-fabric.yml'
  push:
    branches: [main, stable]
    paths:
      - 'scripts/phoenix-genesis-fabric.mjs'
      - 'scripts/phoenix-fabric-broker.mjs'
      - 'scripts/phoenix-fabric-broker.test.mjs'
      - 'scripts/phoenix-fabric-client.mjs'
      - 'scripts/phoenix-fabric-worker.mjs'
      - 'scripts/phoenix-fabric-worker.test.mjs'
      - 'scripts/phoenix-genesis-institutional-registry.mjs'
      - 'scripts/phoenix-genesis-institutional-registry.test.mjs'
      - 'scripts/phoenix-genesis-registry-cli.mjs'
      - 'scripts/phoenix-genesis-workbench.mjs'
      - 'scripts/phoenix-genesis-workbench.test.mjs'
      - 'scripts/phoenix-genesis-console.mjs'
      - 'scripts/phoenix-genesis-console.html'
      - 'scripts/phoenix-genesis-console-ui.js'
      - 'scripts/phoenix-genesis-console.css'
      - 'scripts/phoenix-genesis-importer.mjs'
      - 'scripts/phoenix-genesis-importer.test.mjs'
      - 'scripts/phoenix-genesis-legacy-csv.mjs'
      - 'scripts/phoenix-genesis-legacy-csv.test.mjs'
      - 'scripts/phoenix-genesis-legacy-csv-http.test.mjs'
      - 'scripts/phoenix-genesis-sector-packs.mjs'
      - 'scripts/phoenix-genesis-healthcare-catalog.json'
      - 'scripts/phoenix-genesis-healthcare-catalog.mjs'
      - 'scripts/phoenix-genesis-healthcare-catalog.test.mjs'
      - 'scripts/phoenix-genesis-document-intake.mjs'
      - 'scripts/phoenix-genesis-document-intake.test.mjs'
      - 'scripts/phoenix-genesis-area-census.mjs'
      - 'scripts/phoenix-genesis-area-census.test.mjs'
      - 'scripts/phoenix-genesis-area-census-http.test.mjs'
      - 'scripts/phoenix-genesis-census-ui.js'
      - 'docs/phoenix-genesis-document-intake.md'
      - 'docs/phoenix-genesis-healthcare-domain-pack.md'
      - 'scripts/phoenix-genesis-fabric-integration.test.mjs'
      - 'scripts/phoenix-genesis-paths.mjs'
      - 'docs/phoenix-genesis-operational-console.md'
      - 'scripts/phoenix-genesis-fabric.test.mjs'
      - 'scripts/phoenix-genesis-plan-cli.mjs'
      - 'scripts/phoenix-genesis-fabric-example.json'
      - '.github/workflows/phoenix-genesis-fabric.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genesis-contracts:
    name: Genesis contracts / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Genesis and Fabric offline contracts
        run: node --test scripts/phoenix-genesis-fabric.test.mjs
      - name: Test real durable Fabric HTTP communication and SQLite recovery
        run: node --test scripts/phoenix-fabric-broker.test.mjs scripts/phoenix-fabric-worker.test.mjs
      - name: Test durable Genesis evidence registry and traceable POA
        run: node --test scripts/phoenix-genesis-institutional-registry.test.mjs
      - name: Test Genesis organizational workbench and local console
        run: node --test scripts/phoenix-genesis-workbench.test.mjs
      - name: Test safe institutional imports, site revisions and open-universe sector packs
        run: node --test scripts/phoenix-genesis-importer.test.mjs
      - name: Verify legacy-system CSV adapter, privacy, integrity and UI endpoints
        run: node --test scripts/phoenix-genesis-legacy-csv.test.mjs scripts/phoenix-genesis-legacy-csv-http.test.mjs
      - name: Test real Genesis-to-Fabric node enrollment and heartbeat
        run: node --test scripts/phoenix-genesis-fabric-integration.test.mjs
      - name: Test all institutional healthcare catalog references and UI queries
        run: node --test scripts/phoenix-genesis-healthcare-catalog.test.mjs
      - name: Test evidence-bound TXT/DOCX/PDF document intake and human review
        run: node --test scripts/phoenix-genesis-document-intake.test.mjs
      - name: Test interactive 60-area census, migrations and race-safe approvals
        run: node --test scripts/phoenix-genesis-area-census.test.mjs scripts/phoenix-genesis-area-census-http.test.mjs
      - name: Verify browser console scripts parse
        run: node --check scripts/phoenix-genesis-console-ui.js && node --check scripts/phoenix-genesis-census-ui.js && node --check scripts/phoenix-genesis-console.mjs
      - name: Exercise the Genesis CLI with synthetic hospital input
        run: |
          node scripts/phoenix-genesis-plan-cli.mjs scripts/phoenix-genesis-fabric-example.json > genesis-demo-output.json
          node -e "const p=require('./genesis-demo-output.json');if(p.summary.logicalInstances!==9||p.network.connectionState!=='not-connected')process.exit(1)"
          rm genesis-demo-output.json
