name: PHOENIX Full Reforge Build Repair

on:
  push:
    branches:
      - phoenix/full-reforge-20260824

permissions:
  contents: write

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  DSH_GATE_CONCURRENCY: '1'

jobs:
  repair-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phoenix/full-reforge-20260824
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Apply deterministic build repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          host = 'tsconfig.host.json'
          replace_once(host,
              '    { "path": "./packages/credentials/authorization" },\n',
              '    { "path": "./packages/credentials/authorization" },\n    { "path": "./packages/profile/user-profile" },\n')
          replace_once(host,
              '    { "path": "./packages/web/web-search-deepseek" },\n',
              '    { "path": "./packages/web/web-search-deepseek" },\n    { "path": "./packages/web/web-search-openrouter" },\n')
          replace_once(host,
              '    { "path": "./packages/mcp/mcp-client" },\n',
              '    { "path": "./packages/mcp/mcp-client" },\n    { "path": "./packages/mcp/chrome-connector" },\n')
          replace_once(host,
              '    { "path": "./packages/phoenix/ai-bus" },\n',
              '    { "path": "./packages/phoenix/ai-bus" },\n    { "path": "./packages/phoenix/continuity" },\n')

          repo = 'packages/phoenix/repo-brain/src/index.ts'
          replace_once(repo,
              'const MAX_IMPACT_DEPTH = 8\n',
              '''const MAX_IMPACT_DEPTH = 8\nconst MAX_TOOL_OUTPUT_BYTES = 16_384\nconst TOOL_OUTPUT_TRUNCATION_SUFFIX = '[truncated]'\n\n/** Cap model-facing text by UTF-8 bytes without splitting a code point. */\nexport function capToolText(text: string, maxBytes: number): string {\n  const budget = Number.isSafeInteger(maxBytes) && maxBytes > 0 ? maxBytes : 0\n  if (Buffer.byteLength(text, 'utf8') <= budget) return text\n\n  const truncateUtf8 = (value: string, byteBudget: number): string => {\n    let output = ''\n    let used = 0\n    for (const char of value) {\n      const bytes = Buffer.byteLength(char, 'utf8')\n      if (used + bytes > byteBudget) break\n      output += char\n      used += bytes\n    }\n    return output\n  }\n\n  const suffixBytes = Buffer.byteLength(TOOL_OUTPUT_TRUNCATION_SUFFIX, 'utf8')\n  if (suffixBytes > budget) return truncateUtf8(TOOL_OUTPUT_TRUNCATION_SUFFIX, budget)\n  const prefix = truncateUtf8(text, budget - suffixBytes)\n  return `${prefix}${TOOL_OUTPUT_TRUNCATION_SUFFIX}`\n}\n''')
          replace_once(repo,
              '          return { text: formatSearch(await this.index.search(query, limit)) }',
              '          return { text: capToolText(formatSearch(await this.index.search(query, limit)), MAX_TOOL_OUTPUT_BYTES) }')
          replace_once(repo,
              '          return { text: formatImpact(path, await this.index.impact(path, depth, limit)) }',
              '          return { text: capToolText(formatImpact(path, await this.index.impact(path, depth, limit)), MAX_TOOL_OUTPUT_BYTES) }')
          replace_once(repo,
              '          return { text: `Repo Brain refreshed ${summary.files} files: reread=${summary.reread}, reused=${summary.reused}, removed=${summary.removed}, truncated=${String(summary.truncated)}.` }',
              '          return { text: capToolText(`Repo Brain refreshed ${summary.files} files: reread=${summary.reread}, reused=${summary.reused}, removed=${summary.removed}, truncated=${String(summary.truncated)}.`, MAX_TOOL_OUTPUT_BYTES) }')
          replace_once(repo,
              '          return { text: `Repo Brain stats: files=${stats.files}, symbols=${stats.symbols}, edges=${stats.edges}, indexed=${String(stats.indexed)}.` }',
              '          return { text: capToolText(`Repo Brain stats: files=${stats.files}, symbols=${stats.symbols}, edges=${stats.edges}, indexed=${String(stats.indexed)}.`, MAX_TOOL_OUTPUT_BYTES) }')

          test = 'packages/profile/user-profile/tests/user-profile.spec.ts'
          replace_once(test,
              '''    const next = mergeUserProfile(current, {\n      fullName: 'Changed',\n      preferredName: undefined,\n      family: [{ relationship: 'friend' }],\n      consent: { fullName: true },\n    })''',
              '''    const patch: unknown = {\n      fullName: 'Changed',\n      preferredName: undefined,\n      family: [{ relationship: 'friend' }],\n      consent: { fullName: true },\n    }\n    validateUserProfileUpdate(patch)\n    const next = mergeUserProfile(current, patch)''')

          readme = 'packages/phoenix/repo-brain/README.md'
          replace_once(readme,
              '- **Result byte ceiling** — item counts are bounded, but a separate byte-level cap for the complete rendered tool result is still required before this package should be treated as production-complete.',
              '- **Result byte ceiling** — complete model-facing tool text is capped at 16 KiB with UTF-8-safe truncation. This protects context growth, but unusually large result sets can end with `[truncated]`.')
          PY
          git diff --check
      - name: Verify focused regressions
        run: pnpm exec vitest run packages/phoenix/repo-brain/tests/output-cap.spec.ts packages/profile/user-profile/tests/user-profile.spec.ts
      - name: Verify full build
        run: pnpm run build
      - name: Commit verified repairs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tsconfig.host.json packages/phoenix/repo-brain/src/index.ts packages/phoenix/repo-brain/README.md packages/profile/user-profile/tests/user-profile.spec.ts
          if git diff --cached --quiet; then
            echo "No repair diff remains."
            exit 0
          fi
          git commit -m "fix(build): close full-reforge project and output-cap gaps"
          git push origin HEAD:phoenix/full-reforge-20260824
