name: HARDNESS hotfix JSDoc verifier

on:
  push:
    branches:
      - graft/openclaw-inline-v4
    paths:
      - .github/workflows/hotfix-generate.yml

permissions:
  contents: read

jobs:
  jsdoc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify-export-jsdoc
