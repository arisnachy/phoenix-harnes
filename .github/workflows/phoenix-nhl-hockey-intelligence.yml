name: PHOENIX NHL Hockey Intelligence
on:
  pull_request:
    paths:
      - 'packages/core/tool-sports/src/nhl-evidence-research.ts'
      - 'packages/core/tool-sports/src/nhl-market-settlement.ts'
      - 'packages/core/tool-sports/tests/nhl-evidence-research.test.mjs'
      - 'packages/core/tool-sports/src/index.ts'
      - '.github/workflows/phoenix-nhl-hockey-intelligence.yml'
  workflow_dispatch:
jobs:
  nhl-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify NHL roster, goalie, markets and settlement
        run: node --experimental-strip-types --test packages/core/tool-sports/tests/nhl-evidence-research.test.mjs packages/core/tool-sports/tests/nhl-espn-roster-recovery.test.mjs
      - name: Verify TypeScript host compilation
        run: pnpm exec tsc -b tsconfig.host.json --pretty false
