name: One-shot memory targeted verification

on:
  push:
    branches:
      - verify/memory-targeted-20260914

jobs:
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Run memory learning tests
        run: pnpm exec vitest run packages/session-learning/tool-session-learning/tests/presentation.spec.ts packages/session-learning/tool-session-learning/tests/autonomous-curator.spec.ts packages/session-learning/tool-session-learning/tests/plugin.spec.ts
      - name: Verify memory source typecheck
        run: pnpm exec tsc --noEmit -p packages/session-learning/tool-session-learning/tsconfig.json
