name: Temporary quality composition RED

on:
  push:
    branches:
      - feat/quality-foresight-completion-20260915
    paths:
      - .github/workflows/tmp-quality-composition-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/bundle/base/tests/quality-base.spec.ts apps/cli/tests/quality-agent-presets.spec.ts
