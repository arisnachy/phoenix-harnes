name: PHOENIX NBA WNBA evidence research
on:
  pull_request:
    paths:
      - 'packages/core/tool-sports/src/basketball-research-core.ts'
      - 'packages/core/tool-sports/src/basketball-evidence-dossier.ts'
      - 'packages/core/tool-sports/src/basketball-player-market.ts'
      - 'packages/core/tool-sports/tests/basketball-player-market.test.mjs'
      - 'packages/core/tool-sports/tests/basketball-evidence-research.test.mjs'
      - 'packages/core/tool-sports/src/index.ts'
      - '.github/workflows/phoenix-basketball-intelligence.yml'
  workflow_dispatch:
jobs:
  basketball-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify NBA and WNBA research with isolated fixtures
        run: node --experimental-strip-types --test packages/core/tool-sports/tests/basketball-evidence-research.test.mjs packages/core/tool-sports/tests/basketball-player-market.test.mjs
      - name: Verify TypeScript host composite graph
        run: pnpm exec tsc -b tsconfig.host.json --pretty false
