name: Temporary quality living GREEN

on:
  push:
    branches:
      - feat/quality-foresight-completion-20260915
    paths:
      - .github/workflows/tmp-quality-living-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/quality-foresight-completion-20260915
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify live evidence through ctx.living
        run: |
          python - <<'PY'
          from pathlib import Path

          gate = Path('packages/goal/tool-goal/src/completion-gate.ts')
          s = gate.read_text()
          anchor = "import type { ContentBlock, LlmRuntime } from '@phoenix-ai/dsh-llm'\n"
          addition = anchor + "import { LivingCreationId, livingLevelRank, type LivingRegistry } from '@phoenix-ai/dsh-living'\n"
          if "type LivingRegistry" not in s:
              if anchor not in s: raise SystemExit('living import anchor missing')
              s = s.replace(anchor, addition, 1)

          tools_old = "const EXECUTION_TOOLS = ['bash', 'read', 'read_image', 'glob', 'grep'] as const"
          tools_new = "const EXECUTION_TOOLS = ['bash', 'read', 'read_image', 'glob', 'grep', 'living_inspect_creation', 'living_read_state', 'living_verify_creation'] as const"
          if tools_old in s:
              s = s.replace(tools_old, tools_new, 1)

          runtime_anchor = "type CompletionRuntime = Pick<SubagentRuntime, 'getProvider' | 'start'>\n  & Partial<Pick<SubagentRuntime, 'list'>>\n"
          runtime_new = runtime_anchor + "type LivingReadRuntime = Pick<LivingRegistry, 'inspect' | 'readState'>\n"
          if "type LivingReadRuntime" not in s:
              if runtime_anchor not in s: raise SystemExit('living runtime anchor missing')
              s = s.replace(runtime_anchor, runtime_new, 1)

          marker = "/** Run fresh independent adversarial and foresight verification for one completion attempt. */\n"
          helper = r'''async function verifyLivingEvidence(
            result: GoalCompletionGateResult,
            living: LivingReadRuntime | undefined,
          ): Promise<GoalCompletionGateResult> {
            const scenarios: QualityScenario[] = []
            const findings = [...result.findings]
            let valid = true
            for (const scenario of result.realWorldScenarios) {
              if (scenario.evidenceKind !== 'live' || scenario.status !== 'pass') {
                scenarios.push(scenario)
                continue
              }
              const reference = scenario.authorityRef
              if (reference === undefined || !reference.startsWith('living:') || reference.slice('living:'.length).trim().length === 0) {
                valid = false
                const blocker = `Live scenario ${scenario.id} does not name a valid living:<creation-id> authority.`
                findings.push(blocker)
                scenarios.push({ ...scenario, status: 'untested', blocker })
                continue
              }
              if (living === undefined) {
                valid = false
                const blocker = `Live scenario ${scenario.id} cannot be verified because the living registry is unavailable.`
                findings.push(blocker)
                scenarios.push({ ...scenario, status: 'untested', blocker })
                continue
              }
              const rawId = reference.slice('living:'.length)
              try {
                const id = LivingCreationId(rawId)
                const snapshot = living.inspect(id)
                if (!snapshot.connected) throw new Error(`living creation ${rawId} is offline`)
                if (livingLevelRank(snapshot.achievedLevel) < livingLevelRank(snapshot.manifest.targetLevel)) {
                  throw new Error(`living creation ${rawId} achieves ${snapshot.achievedLevel}, below target ${snapshot.manifest.targetLevel}`)
                }
                if (snapshot.manifest.state.length > 0) await living.readState(id)
                scenarios.push(scenario)
              } catch (error) {
                valid = false
                const detail = error instanceof Error ? error.message : String(error)
                const blocker = `Live authority ${reference} failed verification: ${detail}`.slice(0, MAX_TEXT)
                findings.push(blocker)
                scenarios.push({ ...scenario, status: 'untested', blocker })
              }
            }
            return {
              ...result,
              foresightComplete: result.foresightComplete && valid,
              realWorldScenarios: scenarios,
              findings: findings.slice(0, MAX_ITEMS),
            }
          }

          '''
          if "async function verifyLivingEvidence(" not in s:
              if marker not in s: raise SystemExit('living helper anchor missing')
              s = s.replace(marker, helper + marker, 1)

          sig_old = "  readonly round: number\n  readonly signal: AbortSignal\n}): Promise<GoalCompletionGateResult> {"
          sig_new = "  readonly round: number\n  readonly signal: AbortSignal\n  readonly living?: LivingReadRuntime\n}): Promise<GoalCompletionGateResult> {"
          if "readonly living?: LivingReadRuntime" not in s:
              if sig_old not in s: raise SystemExit('gate living signature anchor missing')
              s = s.replace(sig_old, sig_new, 1)

          prompt_old = "A live PASS is allowed only when an authoritative runtime/tool path was actually observed; provide authority_ref such as a concrete living/runtime/tool locator. Never call a mock, unit test, synthetic fixture, screenshot, or inference live evidence. '
"
          prompt_new = "A live PASS is allowed only when an authoritative runtime/tool path was actually observed; for Phoenix-created live systems use authority_ref exactly as living:<creation-id> after inspecting/verifying it with the read-only living tools. Never call a mock, unit test, synthetic fixture, screenshot, or inference live evidence. '
"
          if prompt_old in s:
              s = s.replace(prompt_old, prompt_new, 1)

          ret_old = "  return readExecution(executed) ?? unavailable('Independent adversarial execution did not return valid clean-room evidence.')\n}"
          ret_new = "  const parsed = readExecution(executed)\n  if (parsed === undefined) return unavailable('Independent adversarial execution did not return valid clean-room evidence.')\n  return verifyLivingEvidence(parsed, input.living)\n}"
          if "return verifyLivingEvidence(parsed, input.living)" not in s:
              if ret_old not in s: raise SystemExit('living verification return anchor missing')
              s = s.replace(ret_old, ret_new, 1)
          gate.write_text(s)

          judge = Path('packages/goal/tool-goal/src/judge.ts')
          s = judge.read_text()
          anchor = "import type { ContentBlock, LlmRuntime } from '@phoenix-ai/dsh-llm'\n"
          addition = anchor + "import type { LivingRegistry } from '@phoenix-ai/dsh-living'\n"
          if "type { LivingRegistry }" not in s:
              if anchor not in s: raise SystemExit('judge living import anchor missing')
              s = s.replace(anchor, addition, 1)
          type_anchor = "type GoalQualityRuntime = Pick<QualityService, 'get' | 'start' | 'record'>\n"
          if "type GoalLivingRuntime" not in s:
              if type_anchor not in s: raise SystemExit('judge living runtime anchor missing')
              s = s.replace(type_anchor, type_anchor + "type GoalLivingRuntime = Pick<LivingRegistry, 'inspect' | 'readState'>\n", 1)
          sig_old = "  readonly signal: AbortSignal\n  readonly quality?: GoalQualityRuntime\n}): Promise<GoalJudgeResult> {"
          sig_new = "  readonly signal: AbortSignal\n  readonly quality?: GoalQualityRuntime\n  readonly living?: GoalLivingRuntime\n}): Promise<GoalJudgeResult> {"
          if "readonly living?: GoalLivingRuntime" not in s:
              if sig_old not in s: raise SystemExit('judge living signature anchor missing')
              s = s.replace(sig_old, sig_new, 1)
          gate_call = "    round: input.round,\n    signal: input.signal,\n  })"
          gate_call_new = "    round: input.round,\n    signal: input.signal,\n    ...input.living === undefined ? {} : { living: input.living },\n  })"
          if "{ living: input.living }" not in s:
              if gate_call not in s: raise SystemExit('judge living forwarding anchor missing')
              s = s.replace(gate_call, gate_call_new, 1)
          judge.write_text(s)

          index = Path('packages/goal/tool-goal/src/index.ts')
          s = index.read_text()
          lookup = "        const quality = ctx.get('quality', false)\n"
          if "const living = ctx.get('living', false)" not in s:
              if lookup not in s: raise SystemExit('index living lookup anchor missing')
              s = s.replace(lookup, lookup + "        const living = ctx.get('living', false)\n", 1)
          arg = "          ...quality === undefined ? {} : { quality },\n"
          if "...living === undefined ? {} : { living }," not in s:
              if arg not in s: raise SystemExit('index living argument anchor missing')
              s = s.replace(arg, arg + "          ...living === undefined ? {} : { living },\n", 1)
          index.write_text(s)

          pkg = Path('packages/goal/tool-goal/package.json')
          s = pkg.read_text()
          goal_peer = '    "@phoenix-ai/dsh-goal": "workspace:^",\n'
          if '"@phoenix-ai/dsh-living"' not in s:
              if goal_peer not in s: raise SystemExit('living dependency anchor missing')
              s = s.replace(goal_peer, goal_peer + '    "@phoenix-ai/dsh-living": "workspace:^",\n', 1)
              # peer and dev blocks both contain goal; replace second occurrence if dev still missing.
              second = s.find(goal_peer, s.find(goal_peer) + len(goal_peer))
              if second >= 0 and '"@phoenix-ai/dsh-living": "workspace:^"' not in s[second:s.find('}', second)]:
                  s = s[:second] + s[second:].replace(goal_peer, goal_peer + '    "@phoenix-ai/dsh-living": "workspace:^",\n', 1)
          pkg.write_text(s)
          PY
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/goal/tool-goal/tests/living-quality-evidence.spec.ts packages/goal/tool-goal/tests/quality-tool-wiring.spec.ts packages/goal/tool-goal/tests/quality-judge.spec.ts
      - name: Commit living verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/goal/tool-goal/src/completion-gate.ts packages/goal/tool-goal/src/judge.ts packages/goal/tool-goal/src/index.ts packages/goal/tool-goal/package.json pnpm-lock.yaml
          git diff --cached --check
          git commit -m "feat(quality): verify live evidence through living registry"
          git push origin HEAD:feat/quality-foresight-completion-20260915
