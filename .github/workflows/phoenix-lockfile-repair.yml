name: PHOENIX lockfile repair

on:
  pull_request:
    branches:
      - main
    paths:
      - packages/phoenix/**
      - packages/bundle/phoenix/**
      - .github/workflows/phoenix-lockfile-repair.yml

permissions:
  contents: write

concurrency:
  group: phoenix-lockfile-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PHOENIX head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Regenerate lockfile from workspace manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen install accepts regenerated lockfile
        run: pnpm install --frozen-lockfile

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): sync PHOENIX workspaces"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
