name: CI

on:
  pull_request:

permissions:
  contents: write

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-generated:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: repair canonical generated docs
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Regenerate and repair paired skill contract
        run: |
          pnpm run gen-doc-graphs
          pnpm run gen-cordis-catalog
          pnpm run gen-client-catalog
          pnpm run gen-config-catalog
          python - <<'PY'
          from pathlib import Path
          needle = "  /** Parsed optional metadata object from frontmatter. */\n  readonly metadata?: Readonly<Record<string, unknown>>\n"
          addition = needle + "  /** Runtime-derived operational guidance added by the common skill loader. */\n  readonly operational?: SkillOperationalProfile\n"
          for name in ("docs/subsystems/skills.md", "docs/subsystems/skills.zh.md"):
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              if "readonly operational?: SkillOperationalProfile" not in text:
                  if needle not in text:
                      raise SystemExit(f"expected SkillDefinition block not found in {name}")
                  text = text.replace(needle, addition, 1)
                  p.write_text(text, encoding="utf-8")
          PY
          pnpm run verify-translation-pairing --write docs/subsystems/skills.md
          git config user.name "phoenix-ci"
          git config user.email "phoenix-ci@users.noreply.github.com"
          git add docs/event-producer-consumer.md docs/config-catalog.md packages/extensions/tool-cordis/src/api-catalog.ts packages/extensions/cordis-client-runner/src/client/slot-catalog.ts docs/subsystems/skills.md docs/subsystems/skills.zh.md docs/subsystems/skills.i18n.yaml
          if git diff --cached --quiet; then
            echo "Canonical generated outputs already current."
            exit 0
          fi
          git commit -m "chore: refresh generated docs and skill contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
