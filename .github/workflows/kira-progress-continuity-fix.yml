name: KIRA progress feedback and continuity repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Apply progress and continuity repair
        run: |
          python3 .github/kira-progress-continuity-fix.py
          git rm .github/kira-progress-continuity-fix.py
          git rm .github/workflows/kira-progress-continuity-fix.yml
          git diff --check

      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile

      - name: Verify progress narration and uninterrupted turns
        run: |
          pnpm exec vitest run packages/core/agent-loop/tests/loop.spec.ts packages/core/system-prompt/tests
          pnpm run typecheck
          pnpm run check:ci:static
          pnpm run build

      - name: Commit verified repair to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(agent): narrate progress and continue bounded turns'
          git push origin HEAD:main
          git rev-parse HEAD
