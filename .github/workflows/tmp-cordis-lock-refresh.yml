name: Temporary Cordis lock refresh

on:
  push:
    branches:
      - codex/cordis-visual-workspace-20260913
    paths:
      - .github/workflows/tmp-cordis-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/cordis-visual-workspace-20260913
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore(lock): sync ui-subagent manifest"
          git push origin HEAD:codex/cordis-visual-workspace-20260913
