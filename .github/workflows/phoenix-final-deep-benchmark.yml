name: PHOENIX final replay repair and deep benchmark

on:
  push:
    branches:
      - 'repair/benchmark-green-current-main-20260923'

permissions:
  contents: write

env:
  CI: '1'
  DSH_TELEMETRY_DISABLED: '1'
  PHOENIX_BENCH_DEEP: '1'
  OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  DEEPSEEK_API_KEY: ''
  GOOGLE_API_KEY: ''
  GEMINI_API_KEY: ''
  GROQ_API_KEY: ''
  OPENROUTER_API_KEY: ''
  XAI_API_KEY: ''

jobs:
  repair-and-benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/benchmark-green-current-main-20260923
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Refresh current-main headless baseline
        run: pnpm run test:snapshot:refresh -- -t "runs one task through the product headless profile command"

      - name: Verify repaired headless scenario
        run: pnpm run test:snapshot -- -t "runs one task through the product headless profile command"

      - name: Run final deep zero-cost benchmark
        run: node scripts/phoenix-zero-cost-benchmark.mjs

      - name: Require all benchmark lanes green
        run: |
          node -e "const r=require('./artifacts/phoenix-zero-cost-benchmark/benchmark-report.json'); if (r.summary.failed !== 0 || r.summary.skipped !== 0) { console.error(r.summary); process.exit(1) } console.log('PHOENIX benchmark green:', r.summary)"

      - name: Publish report
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/phoenix-zero-cost-benchmark/benchmark-report.md ]]; then
            cat artifacts/phoenix-zero-cost-benchmark/benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-final-deep-benchmark-${{ github.run_id }}
          path: artifacts/phoenix-zero-cost-benchmark/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit verified current-main snapshot baseline
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/headless-agent/tests
          git commit -m "test(snapshot): sync headless baseline with current main"
          git push origin HEAD:repair/benchmark-green-current-main-20260923
