name: Phoenix lint contracts autofix

on:
  push:
    branches:
      - repair/lint-contracts-ready-20260928

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[lint-autofix]') }}
    runs-on: ubuntu-24.04
    env:
      DSH_OXLINT_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/lint-contracts-ready-20260928
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Apply supported Oxlint fixes
        run: pnpm run lint:fix:contracts-ready || true
      - name: Commit supported fixes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "Phoenix CI Repair"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "fix(lint): apply contracts-ready autofixes [lint-autofix]"
            git push origin HEAD:repair/lint-contracts-ready-20260928
          fi
      - name: Report remaining contracts-ready lint
        run: pnpm run lint:contracts-ready
