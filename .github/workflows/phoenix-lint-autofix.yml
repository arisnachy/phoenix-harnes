name: Phoenix lint project discovery probe

on:
  push:
    branches:
      - repair/lint-contracts-ready-20260928

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      DSH_OXLINT_THREADS: '2'
      OXC_LOG: debug
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Contracts-ready lint project discovery
        continue-on-error: true
        run: pnpm run lint:contracts-ready
      - name: Client domain graph
        run: pnpm run verify-client-domain-graph
