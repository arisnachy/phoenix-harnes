name: Phoenix sports live ESPN chat
on:
  pull_request:
    paths:
      - 'packages/core/tool-sports/src/sports.ts'
      - 'packages/core/tool-sports/src/index.ts'
      - 'packages/client/ui-conversation/src/client/chat/GenerativeUi.tsx'
      - 'packages/client/ui-conversation/src/client/chat/SportsLive*'
      - 'packages/client/ui-conversation/tests/sports-live.client.spec.tsx'
      - '.github/workflows/phoenix-sports-live.yml'
  push:
    branches: [main,stable]
    paths:
      - 'packages/client/ui-conversation/src/client/chat/SportsLive*'
      - 'packages/client/ui-conversation/tests/sports-live.client.spec.tsx'
      - '.github/workflows/phoenix-sports-live.yml'
permissions:
  contents: read
jobs:
  sports-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify live MLB/NBA/provider update paths
        run: pnpm exec vitest run packages/client/ui-conversation/tests/sports-live.client.spec.tsx packages/client/ui-conversation/tests/sports-rich-ui.client.spec.tsx packages/client/ui-conversation/tests/sports-tool-visual.client.spec.ts
      - name: Validate Phoenix client contract and strict TypeScript build
        run: |
          pnpm run build:lib:host
          pnpm run build:lib:client
