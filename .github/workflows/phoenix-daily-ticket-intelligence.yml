name: PHOENIX Daily Ticket Intelligence
on:
  pull_request:
    paths:
      - 'packages/core/tool-sports/src/daily-market-*.ts'
      - 'packages/core/tool-sports/src/daily-market-selection.ts'
      - 'packages/core/tool-sports/src/daily-special-market-research.ts'
      - 'packages/core/tool-sports/src/sports-event-market-menu.ts'
      - 'packages/core/tool-sports/src/daily-sports-scout.ts'
      - 'packages/core/tool-sports/src/index.ts'
      - 'packages/core/tool-sports/src/sports-historical-scoreboard.ts'
      - 'packages/core/tool-sports/src/sports-calibration.ts'
      - 'packages/core/tool-sports/tests/sports-calibration.test.mjs'
      - 'packages/core/tool-sports/src/basketball-evidence-dossier.ts'
      - 'packages/core/tool-sports/src/soccer-worldwide-dossier.ts'
      - 'packages/core/tool-sports/src/sports-direct-stats.ts'
      - 'packages/core/tool-sports/src/free-sports-source-audit.ts'
      - 'packages/core/tool-sports/src/nflverse-injury-report.ts'
      - 'packages/core/tool-sports/src/espn-odds.ts'
      - 'packages/core/tool-sports/src/sports.ts'
      - 'packages/core/tool-sports/tests/espn-odds-multiroute.test.mjs'
      - 'packages/core/tool-sports/tests/sports-historical-scoreboard.test.mjs'
      - 'packages/core/tool-sports/tests/sports-direct-stats.test.mjs'
      - 'packages/core/tool-sports/tests/free-sports-source-audit.test.mjs'
      - 'packages/core/tool-sports/tests/nflverse-injury-report.test.mjs'
      - 'packages/core/tool-sports/src/multi-sport-research.ts'
      - 'packages/core/tool-sports/src/evidence-ticket.ts'
      - 'packages/core/tool-sports/src/research-ticket.ts'
      - 'packages/core/tool-sports/src/keyless-odds.ts'
      - 'packages/core/tool-sports/src/sports-fast-free-probes.ts'
      - 'packages/core/tool-sports/src/sports-source-health.ts'
      - 'packages/core/tool-sports/src/sports-odds-coverage.ts'
      - 'packages/core/tool-sports/tests/sports-fast-free-probes.test.mjs'
      - 'packages/core/tool-sports/tests/keyless-odds.test.mjs'
      - 'packages/core/tool-sports/tests/sports-research-recovery.test.mjs'
      - 'packages/client/ui-conversation/src/client/chat/SportsForecastLive.tsx'
      - 'packages/core/tool-sports/src/ticket-specialist-gate.ts'
      - 'packages/core/tool-sports/src/daily-specialist-checklist.ts'
      - 'packages/core/tool-sports/tests/daily-specialist-checklist.test.mjs'
      - 'packages/core/tool-sports/src/espn-injury-backup.ts'
      - 'packages/core/tool-sports/tests/espn-injury-backup.test.mjs'
      - 'packages/core/tool-sports/src/open-odds-providers.ts'
      - 'packages/core/tool-sports/src/betbetter-model-evidence.ts'
      - 'packages/core/tool-sports/tests/open-odds-providers.test.mjs'
      - 'packages/core/tool-sports/src/evidence-priced-ticket.ts'
      - 'packages/core/tool-sports/src/sports-daily-preload.ts'
      - 'packages/core/tool-sports/tests/sports-daily-preload.test.mjs'
      - 'packages/core/tool-sports/src/sports-ticket-decision.ts'
      - 'packages/core/tool-sports/tests/sports-ticket-decision.test.mjs'
      - 'packages/core/tool-sports/tests/ticket-specialist-gate.test.mjs'
      - 'packages/core/tool-sports/tests/evidence-priced-ticket.test.mjs'
      - 'packages/core/tool-sports/tests/daily-*.test.mjs'
      - 'packages/core/tool-sports/tests/sports-event-market-menu.test.mjs'
      - '.github/workflows/phoenix-daily-ticket-intelligence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  daily-ticket-integrity:
    name: Six-sport 5/6-leg market and research contracts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify real-match IDs, market menus, injury uncertainty, no-vig and five/six target
        run: node --experimental-strip-types --test packages/core/tool-sports/tests/sports-calibration.test.mjs packages/core/tool-sports/tests/espn-odds-multiroute.test.mjs packages/core/tool-sports/tests/sports-historical-scoreboard.test.mjs packages/core/tool-sports/tests/sports-direct-stats.test.mjs packages/core/tool-sports/tests/free-sports-source-audit.test.mjs packages/core/tool-sports/tests/nflverse-injury-report.test.mjs packages/core/tool-sports/tests/daily-sports-scout.test.mjs packages/core/tool-sports/tests/daily-market-shortlist.test.mjs packages/core/tool-sports/tests/daily-market-selection.test.mjs packages/core/tool-sports/tests/daily-market-evidence.test.mjs packages/core/tool-sports/tests/daily-market-ranking.test.mjs packages/core/tool-sports/tests/daily-special-market-research.test.mjs packages/core/tool-sports/tests/sports-event-market-menu.test.mjs packages/core/tool-sports/tests/ticket-specialist-gate.test.mjs packages/core/tool-sports/tests/daily-specialist-checklist.test.mjs packages/core/tool-sports/tests/espn-injury-backup.test.mjs packages/core/tool-sports/tests/sports-research-recovery.test.mjs packages/core/tool-sports/tests/sports-fast-free-probes.test.mjs packages/core/tool-sports/tests/sports-source-health.test.mjs packages/core/tool-sports/tests/sports-odds-coverage.test.mjs packages/core/tool-sports/tests/evidence-ticket.test.mjs packages/core/tool-sports/tests/research-ticket.test.mjs packages/core/tool-sports/tests/keyless-odds.test.mjs packages/core/tool-sports/tests/evidence-priced-ticket.test.mjs packages/core/tool-sports/tests/sports-daily-preload.test.mjs packages/core/tool-sports/tests/sports-ticket-decision.test.mjs packages/core/tool-sports/tests/open-odds-providers.test.mjs
      - name: Strict host TypeScript validation
        run: pnpm exec tsc -b tsconfig.host.json --pretty false
