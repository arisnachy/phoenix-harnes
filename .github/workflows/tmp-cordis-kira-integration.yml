name: Temporary Cordis KIRA integration

on:
  push:
    branches:
      - codex/cordis-visual-workspace-20260913

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/cordis-visual-workspace-20260913
          fetch-depth: 0
      - name: Patch KIRA dock visual workspace lease
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          dock = 'packages/client/ui-kira-teams/src/client/KiraTeamsDock.tsx'
          replace(
              dock,
              "import {\n  IconChevronDownOutline14, IconRefreshOutline14, StateDot,\n} from '@phoenix-ai/dsh-client-ui-primitives'\n",
              "import {\n  IconChevronDownOutline14, IconRefreshOutline14, StateDot,\n} from '@phoenix-ai/dsh-client-ui-primitives'\nimport type { ILayout } from '@phoenix-ai/dsh-client-ui-layout/client'\n",
          )
          replace(
              dock,
              "  /** Navigate to one deployed child session. */\n  openChild: (address: SubagentAddress) => void\n",
              "  /** Shared shell layout used to announce the expanded subagent window. */\n  layout: Pick<ILayout, 'setWorkspaceOccupant'>\n  /** Navigate to one deployed child session. */\n  openChild: (address: SubagentAddress) => void\n",
          )
          replace(
              dock,
              "export function KiraTeamsDock({ list, openChild, refresh, t }: KiraTeamsDockProps) {\n",
              "export function KiraTeamsDock({ list, openChild, refresh, t, layout }: KiraTeamsDockProps) {\n",
          )
          replace(
              dock,
              "  const runningCount = rows.reduce((total, row) => total + (row.summary.running ? 1 : 0), 0)\n\n  // A deployment must never be silent again: a rising running count reopens\n",
              "  const runningCount = rows.reduce((total, row) => total + (row.summary.running ? 1 : 0), 0)\n  const workspaceOpen = root !== undefined && rows.length > 0 && !collapsed\n\n  // The expanded subagent card owns the upper half of Phoenix's shared visual\n  // workspace. A collapsed pill does not reserve the dock, so Cordis can use\n  // the full height. Unmount always releases the lease.\n  useEffect(() => {\n    layout.setWorkspaceOccupant('subagent', workspaceOpen)\n    return () => { layout.setWorkspaceOccupant('subagent', false) }\n  }, [layout, workspaceOpen])\n\n  // A deployment must never be silent again: a rising running count reopens\n",
          )

          index = 'packages/client/ui-kira-teams/src/client/index.ts'
          replace(
              index,
              "export const inject = ['sessions', 'slots', 'locale']\n",
              "export const inject = ['sessions', 'slots', 'locale', 'layout']\n",
          )
          replace(
              index,
              "  const dockActions = () => ({\n    list: sessions.list,\n",
              "  const dockActions = () => ({\n    list: sessions.list,\n    layout: ctx.layout,\n",
          )

          pkg = 'packages/client/ui-kira-teams/package.json'
          replace(
              pkg,
              '        "@phoenix-ai/dsh-client-runtime",\n        "@phoenix-ai/dsh-client-ui-primitives"\n',
              '        "@phoenix-ai/dsh-client-runtime",\n        "@phoenix-ai/dsh-client-ui-layout",\n        "@phoenix-ai/dsh-client-ui-primitives"\n',
          )

          test = 'packages/client/ui-kira-teams/tests/browser-plugin.client.spec.ts'
          replace(
              test,
              "  ctx.provide('settingsScope', { bind: () => stubSettingsScope().scope } as never)\n  await provideSlotFaces(ctx)\n",
              "  ctx.provide('settingsScope', { bind: () => stubSettingsScope().scope } as never)\n  const layout = {\n    toggleSidebar() {},\n    openDetails() {},\n    closeDetails() {},\n    setWorkspaceOccupant() {},\n    getWorkspaceOccupancy: () => ({ subagent: false, cordis: false }),\n    subscribeWorkspaceOccupancy: () => () => {},\n  }\n  ctx.provide('layout', layout as never)\n  await provideSlotFaces(ctx)\n",
          )
          replace(
              test,
              "  return { face, ctx }\n",
              "  return { face, ctx, layout }\n",
          )
          replace(
              test,
              "    expect(inject).toEqual(['sessions', 'slots', 'locale'])\n",
              "    expect(inject).toEqual(['sessions', 'slots', 'locale', 'layout'])\n",
          )
          replace(
              test,
              "    const { ctx, face } = await fullBench(FAMILY, sid('root'))\n",
              "    const { ctx, face, layout } = await fullBench(FAMILY, sid('root'))\n",
          )
          replace(
              test,
              "      list: { getSnapshot(): SessionListState }\n      openChild: (address: SubagentAddress) => void\n",
              "      list: { getSnapshot(): SessionListState }\n      layout: unknown\n      openChild: (address: SubagentAddress) => void\n",
          )
          replace(
              test,
              "    expect(injected.list.getSnapshot().current).toBe(sid('root'))\n",
              "    expect(injected.list.getSnapshot().current).toBe(sid('root'))\n    expect(injected.layout).toBe(layout)\n",
          )
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/client/ui-kira-teams
          git commit -m "feat(ui): coordinate KIRA subagent dock with Cordis workspace"
          git push origin HEAD:codex/cordis-visual-workspace-20260913
