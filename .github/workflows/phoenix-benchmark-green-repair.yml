name: PHOENIX snapshot repair and replay

on:
  push:
    branches:
      - 'repair/snapshot-green-final-20260923'

permissions:
  contents: write


env:
  CI: '1'
  DSH_TELEMETRY_DISABLED: '1'
  OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  DEEPSEEK_API_KEY: ''
  GOOGLE_API_KEY: ''
  GEMINI_API_KEY: ''
  GROQ_API_KEY: ''
  OPENROUTER_API_KEY: ''
  XAI_API_KEY: ''

jobs:
  repair-replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/snapshot-green-final-20260923
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Refresh reviewed snapshot baseline
        run: pnpm run test:snapshot:refresh

      - name: Commit refreshed snapshot contracts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No snapshot changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "test(snapshot): refresh reviewed Phoenix replay baseline"
            git push origin HEAD:repair/snapshot-green-final-20260923
          fi

      - name: Verify complete replay
        run: pnpm run test:snapshot

      - name: Verify judge gate
        run: pnpm exec vitest run packages/goal/tool-goal/tests/adversarial-completion-gate.spec.ts --maxWorkers=1

      - name: Verify host and client build
        run: pnpm run build:lib
