name: PHOENIX deep zero-cost benchmark

on:
  push:
    branches:
      - 'repair/benchmark-green-20260923'

permissions:
  contents: read

concurrency:
  group: phoenix-benchmark-green-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  DSH_TELEMETRY_DISABLED: '1'
  OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  DEEPSEEK_API_KEY: ''
  GOOGLE_API_KEY: ''
  GEMINI_API_KEY: ''
  GROQ_API_KEY: ''
  OPENROUTER_API_KEY: ''
  XAI_API_KEY: ''
  PHOENIX_BENCH_DEEP: '1'

jobs:
  deep-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run deep zero-cost benchmark
        run: node scripts/phoenix-zero-cost-benchmark.mjs
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/phoenix-zero-cost-benchmark/benchmark-report.md ]]; then
            cat artifacts/phoenix-zero-cost-benchmark/benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-zero-cost-benchmark-${{ github.run_id }}
          path: artifacts/phoenix-zero-cost-benchmark/
          if-no-files-found: warn
          retention-days: 30
