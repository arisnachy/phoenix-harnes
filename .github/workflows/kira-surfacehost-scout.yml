name: KIRA SurfaceHost Scout

on:
  push:
    branches:
      - feat/surfacehost-windows-native-update

permissions:
  contents: read

jobs:
  scout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate integration seams
        shell: bash
        run: |
          set -euo pipefail
          echo '=== tool registration candidates ==='
          grep -RInE "register.*tool|tool.*register|ToolDefinition|createTool|toolName|tools:" packages apps --include='*.ts' --include='*.tsx' | head -500 || true
          echo '=== browser symbols ==='
          grep -RInE "browser|playwright|chromium|page\." packages apps --include='*.ts' --include='*.tsx' | head -500 || true
          echo '=== slots / turn tail / message images ==='
          grep -RInE "MessageImages|TurnTail|ProducedFiles|ToolDetails|openFile" packages/client --include='*.ts' --include='*.tsx' | head -500 || true
          echo '=== package names mentioning browser/web-search/tools ==='
          find packages -name package.json -print0 | xargs -0 grep -IlE 'browser|playwright|tools|web-search' | sort | head -200
          echo '=== subprocess windows inspector ==='
          sed -n '1,280p' packages/subprocess/subprocess-local/src/windows-inspector.ts
          echo '=== tool slot model ==='
          sed -n '1,300p' packages/client/ui-tool/src/client/tool/ToolDetails.tsx
          find packages/client/ui-tool/src/client/tool/models -type f -maxdepth 1 -print -exec sh -c 'echo --- $1; sed -n "1,260p" "$1"' _ {} \;
          echo '=== conversation slots ==='
          grep -RInE "slot|TurnTail|MessageImages" packages/client/ui-conversation/src/client --include='*.ts' --include='*.tsx' | head -500 || true
