name: Temporary Generate Tool Catalog

on:
  push:
    branches:
      - integration/cognitive-reconciled-20260914

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run gen-tool-catalog
      - uses: actions/upload-artifact@v6
        with:
          name: generated-tool-catalog
          path: docs/tool-catalog.md
          if-no-files-found: error
