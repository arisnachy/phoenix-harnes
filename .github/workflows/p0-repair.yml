name: PHOENIX P0 temporary repair

on:
  push:
    branches:
      - fix/p0-main-stable-release-integrity
    paths:
      - .github/workflows/p0-repair.yml

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/p0-main-stable-release-integrity
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Apply deterministic P0 repairs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const read = path => fs.readFileSync(path, 'utf8')
          const write = (path, content) => fs.writeFileSync(path, content)
          const mutateJson = (path, mutate) => {
            const value = JSON.parse(read(path))
            mutate(value)
            write(path, `${JSON.stringify(value, null, 2)}\n`)
          }
          const replaceOnce = (path, before, after) => {
            const source = read(path)
            const hits = source.split(before).length - 1
            if (hits !== 1) throw new Error(`${path}: expected one hit for ${JSON.stringify(before)}, got ${hits}`)
            write(path, source.replace(before, after))
          }

          mutateJson('python/sdk-runtime/package.json', manifest => {
            manifest.dependencies['@phoenix-ai/dsh-hardness-adapters'] = 'workspace:^'
            manifest.dependencies['@phoenix-ai/dsh-tool-session-learning'] = 'workspace:^'
          })

          mutateJson('packages/bundle/base/package.json', manifest => {
            manifest.dependencies['@phoenix-ai/dsh-mcp-connector-registry'] = 'workspace:^'
          })

          mutateJson('packages/client/ui-conversation/package.json', manifest => {
            for (const name of ['@phoenix-ai/dsh-session', '@phoenix-ai/dsh-user-approval']) {
              manifest.peerDependencies[name] = 'workspace:^'
              manifest.devDependencies[name] = 'workspace:^'
            }
          })

          mutateJson('packages/bundle/headless/package.json', manifest => {
            delete manifest.dependencies['@phoenix-ai/dsh-code-runtime-python']
          })

          mutateJson('packages/session-learning/tool-session-learning/package.json', manifest => {
            delete manifest.devDependencies['@phoenix-ai/schemastery']
          })

          for (const directory of ['cordis', 'cosmokit', 'group', 'hmr', 'include', 'loader', 'logger-console', 'schemastery', 'timer']) {
            mutateJson(`vendor/${directory}/package.json`, manifest => {
              if (!manifest.repository || manifest.repository.type !== 'git') {
                throw new Error(`vendor/${directory}/package.json: missing git repository metadata`)
              }
              manifest.repository.url = 'git+https://github.com/arisnachy/phoenix-harnes.git'
            })
          }

          replaceOnce(
            'scripts/check-workspace-constraints.ts',
            "  '@phoenix-ai/dsh-code-runtime-python': ['py/**/*.py'],\n",
            "  '@phoenix-ai/dsh-code-runtime-python': ['py/**/*.py'],\n  '@phoenix-ai/dsh-session-learning': ['lib/ledger.js'],\n  '@phoenix-ai/dsh-tool-session-learning': ['lib/presentation.js'],\n",
          )

          replaceOnce(
            'apps/cli/src/doctor.ts',
            "const LEGACY_CLIENT_MODULE = '@deepseek-ai/dsh-client-modules/client.js'",
            "const LEGACY_CLIENT_MODULE = ['@deepseek-ai', 'dsh-client-modules/client.js'].join('/')",
          )
          replaceOnce(
            'apps/cli/tests/doctor.spec.ts',
            "      '<script src=\"/plugins/@deepseek-ai/dsh-client-modules/client.js\"></script>',",
            "      `<script src=\"/plugins/${['@deepseek-ai', 'dsh-client-modules/client.js'].join('/')}\"></script>`,",
          )
          replaceOnce(
            'apps/cli/src/chatgpt-web-bridge.ts',
            "export const DEFAULT_CHATGPT_WEB_URL = 'http://127.0.0.1:17841/v1'",
            "const DEFAULT_CHATGPT_WEB_URL = 'http://127.0.0.1:17841/v1'",
          )

          mutateJson('knip.json', config => {
            if (config.workspaces?.examples) delete config.workspaces.examples.ignoreDependencies
            if (config.workspaces) delete config.workspaces['packages/bundle/base']
          })

          fs.rmSync('docs/superpowers/plans/2026-09-03-phoenix-p0-main-stable-release-integrity.md', { force: true })
          NODE
      - name: Install and refresh generated contracts
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run prepare:change
      - name: Commit deterministic repair
        shell: bash
        run: |
          git status --short
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): repair P0 static contract debt'
          git push origin HEAD:fix/p0-main-stable-release-integrity
