name: Phoenix PR generated documentation repair (temporary)

on:
  push:
    branches:
      - fix/phoenix-dual-core-integration-20261023
    paths:
      - .github/workflows/phoenix-pr-generated-doc-repair.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/fix/phoenix-dual-core-integration-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate only first-party derived documentation
        run: |
          pnpm run gen-config-catalog
          pnpm run gen-doc-graphs
      - name: Commit generated documentation only on the integration branch
        shell: bash
        run: |
          git add -u -- docs/
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Regenerate source-derived Phoenix config and capability documentation'
            git push origin HEAD:refs/heads/fix/phoenix-dual-core-integration-20261023
          fi
