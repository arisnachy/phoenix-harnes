name: PHOENIX Sports secure credential connectors

on:
  pull_request:
    paths:
      - 'packages/host/plugin-inventory/src/sports-api-connectors.ts'
      - 'packages/host/plugin-inventory/src/index.ts'
      - 'packages/host/plugin-inventory/src/types.ts'
      - 'packages/host/plugin-inventory/tests/sports-api-connectors.spec.ts'
      - 'packages/client/ui-settings-plugin-inventory/**'
      - 'packages/core/tool-sports/src/sports-credential-ask.ts'
      - 'packages/core/tool-sports/src/sports-credential-env.ts'
      - 'packages/core/tool-sports/tests/sports-credential-ask.test.mjs'
      - 'packages/api/remotes/src/client/index.ts'
      - '.github/workflows/phoenix-sports-credential-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-sports-credentials:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vault and secure user-input regressions
        run: >-
          pnpm exec vitest run
          packages/host/plugin-inventory/tests/sports-api-connectors.spec.ts
          packages/client/ui-settings-plugin-inventory/tests/sports-api-keys.client.spec.tsx
          packages/core/tool-sports/tests/sports-credential-env.spec.ts
      - name: Ask consent and do-not-ask persistence
        run: node --experimental-strip-types --test packages/core/tool-sports/tests/sports-credential-ask.test.mjs
