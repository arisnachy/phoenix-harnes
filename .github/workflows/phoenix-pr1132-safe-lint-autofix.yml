name: Phoenix PR1132 Safe Lint Autofix
on:
  push:
    branches:
      - fix/phoenix-dual-core-integration-20261023
    paths:
      - .github/workflows/phoenix-pr1132-safe-lint-autofix.yml
permissions:
  contents: write
concurrency:
  group: phoenix-pr1132-safe-lint-autofix
  cancel-in-progress: false
jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/phoenix-dual-core-integration-20261023
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Build type-aware lint dependencies
        run: pnpm run build:lib:host
      - name: Fix autofixable lint without modifying lint baselines
        shell: bash
        run: |
          set +e
          DSH_OXLINT_THREADS=2 pnpm run lint:fix:contracts-ready
          fix_status=$?
          set -e
          echo "Autofix status: ${fix_status}; any residual errors remain CI blockers"
      - name: Publish exact scoped autofixes
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then echo 'No automatic changes'; exit 0; fi
          git -c user.name='Phoenix CI Repair' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(pr1132): apply safe lint autofixes'
          git push origin HEAD:fix/phoenix-dual-core-integration-20261023
