name: KIRA PR58 pull request finalization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event.pull_request.number == 58 && github.head_ref == 'feat/codex-graft-full' && !startsWith(github.event.pull_request.title, '[finalized]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/codex-graft-full
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply deterministic finalization patch
        run: python3 scripts/kira-pr58-finalize.py
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused release checks
        run: |
          pnpm exec vitest run packages/sdk/server/tests/lifecycle-v2.spec.ts packages/subagent/subagent-codex/tests/account-boundary.spec.ts packages/host/apiproxy/tests/api-proxy-authorization.spec.ts packages/client/ui-settings-models/tests/authorization-panel.client.spec.tsx
          pnpm run check:ci:static
          git diff --check
      - name: Commit finalization
        shell: bash
        run: |
          git config user.name "KIRA PHOENIX"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset .github/workflows/kira-pr58-repair.yml .github/workflows/kira-pr58-pull-request-repair.yml scripts/kira-pr58-repair.py scripts/kira-pr58-finalize.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(release): close auth and SDK lifecycle gates"
          git push origin HEAD:feat/codex-graft-full
