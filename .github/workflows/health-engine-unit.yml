name: PHOENIX Health Clinical Flow Tests
on:
  pull_request:
    paths:
      - 'packages/core/tool-health/**'
      - 'packages/bundle/web-app/src/health-*.ts'
      - 'packages/bundle/web-app/tests/health-*.test.mjs'
      - 'packages/bundle/web-app/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/health-engine-unit.yml'
  push:
    paths:
      - 'packages/core/tool-health/**'
      - '.github/workflows/health-engine-unit.yml'
jobs:
  clinical-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install linked clinical workspace dependencies
        run: pnpm install --frozen-lockfile --filter '@phoenix-ai/dsh-web-app...'
      - name: Validate deterministic clinical state and mail gates
        run: node --experimental-strip-types --test packages/core/tool-health/tests/*.test.mjs packages/bundle/web-app/tests/health-store.test.mjs packages/bundle/web-app/tests/health-ui.test.mjs
