name: Temporary quality tasks2-3 GREEN

on:
  push:
    branches:
      - feat/quality-foresight-completion-20260915
    paths:
      - .github/workflows/tmp-quality-task3-green.yml

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Resolve quality source group inside verifier checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tsconfig.base.json')
          s = p.read_text()
          if '"./packages/quality/*/src"' not in s:
              s = s.replace('"./packages/goal/*/src",', '"./packages/goal/*/src",\n        "./packages/quality/*/src",')
          p.write_text(s)
          PY
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec vitest run packages/quality/quality-session/tests/quality-session.spec.ts packages/quality/tool-quality/tests/tool-quality.spec.ts
      - run: pnpm exec tsc -p packages/quality/quality/tsconfig.json --noEmit
      - run: pnpm exec tsc -p packages/quality/quality-session/tsconfig.json --noEmit
      - run: pnpm exec tsc -p packages/quality/tool-quality/tsconfig.json --noEmit
