name: Phoenix PR1132 safe lint autofix (temporary)
on:
  push:
    branches:
      - fix/phoenix-dual-core-integration-20261023
permissions:
  contents: write
concurrency:
  group: phoenix-pr1132-safe-autofix
  cancel-in-progress: false
jobs:
  safe-oxlint:
    if: contains(github.event.head_commit.message, 'lint autofix dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build host libraries for type-aware lint
        run: pnpm run build:lib:host
      - name: Fix only tracked TypeScript and JavaScript files changed by PR #1132
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          mapfile -d '' -t paths < <(git diff --name-only -z origin/main...HEAD -- '*.ts' '*.tsx' '*.mts' '*.cts' '*.js' '*.jsx' '*.mjs' '*.cjs')
          echo "Changed source files: ${#paths[@]}"
          if (( ${#paths[@]} > 0 )); then
            set +e
            DSH_OXLINT_THREADS=2 pnpm exec tsx scripts/run-oxlint.ts "${paths[@]}" --fix
            code=$?
            set -e
            echo "Auto-fix exit status: $code (remaining manual lint problems are not suppressed)"
          fi
          git diff --check
          git diff --stat
      - name: Commit only safe formatter changes to the existing PR
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No automatic changes"
            exit 0
          fi
          git config user.name 'Phoenix CI Safe Autofix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style(pr1132): apply safe oxlint fixes to changed source files'
          git push origin HEAD:fix/phoenix-dual-core-integration-20261023
