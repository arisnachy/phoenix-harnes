name: PHOENIX All Sports Evidence Gate
on:
  pull_request:
    branches: [main, stable]
    paths:
      - '.github/workflows/phoenix-all-sports-evidence-gate.yml'
      - 'packages/core/tool-sports/**'
      - 'scripts/phoenix-sports*'
  workflow_dispatch:
  schedule:
    - cron: '35 10 * * 2,5'
permissions:
  contents: read
jobs:
  discipline-contracts:
    name: ${{ matrix.sport }} research and settlement
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - sport: NBA-WNBA
            test: basketball-evidence-research.test.mjs basketball-player-market.test.mjs
          - sport: NHL
            test: nhl-evidence-research.test.mjs
          - sport: NFL
            test: nfl-evidence-research.test.mjs
          - sport: MLB
            test: mlb-evidence-research.test.mjs mlb-live-source-contract.test.mjs
          - sport: Soccer-MLS
            test: soccer-worldwide-intelligence.test.mjs soccer-90min-settlement.test.mjs
          - sport: ATP-WTA
            test: tennis-evidence-research.test.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run discipline-specific evidence and market tests
        shell: bash
        run: |
          read -r -a tests <<< "${{ matrix.test }}"
          args=()
          for file in "${tests[@]}"; do
            args+=("packages/core/tool-sports/tests/${file}")
          done
          node --experimental-strip-types --test "${args[@]}"
      - name: Verify TypeScript host graph
        run: pnpm exec tsc -b tsconfig.host.json --pretty false

  real-source-contracts:
    name: ESPN, live adapters, fallback routes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Public ESPN endpoints live
        run: node scripts/phoenix-sports-live-probe.mjs
      - name: Audit provider endpoints and record failures
        run: node scripts/phoenix-sports-endpoint-audit.mjs
      - name: Exercise live adapters
        run: node --experimental-strip-types scripts/phoenix-sports-adapter-live-probe.mjs
      - name: Audit all three sources for all research steps
        run: node --experimental-strip-types scripts/phoenix-sports-three-source-step-audit.mjs
      - name: Preserve exact observations even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-sports-live-source-observations
          path: |
            phoenix-sports-endpoint-audit.json
            phoenix-sports-adapter-live.json
            phoenix-3-source-step-audit.json
            phoenix-3-source-step-audit.md
          if-no-files-found: warn
          retention-days: 28

  chronological-calibration:
    name: Historical calibration, no future leakage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types --test packages/core/tool-sports/tests/sports-calibration.test.mjs
      - name: Run full ESPN chronological evaluation for all supported leagues
        run: node --experimental-strip-types scripts/phoenix-sports-chronological-backtest.mjs
        env:
          PHOENIX_BACKTEST_MODE: full
      - name: Save league coverage, errors and calibration metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-sports-chronological-calibration
          path: |
            phoenix-sports-chronological-backtest.json
            phoenix-sports-chronological-backtest.md
          if-no-files-found: error
          retention-days: 28

  ticket-decision-contract:
    name: Ticket integrity, no invented odds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test packages/core/tool-sports/tests/daily-market-selection.test.mjs packages/core/tool-sports/tests/evidence-priced-ticket.test.mjs packages/core/tool-sports/tests/sports-research-coverage.test.mjs packages/core/tool-sports/tests/sports-ticket-decision.test.mjs
      - run: pnpm exec tsc -b tsconfig.host.json --pretty false
