name: PHOENIX Inline Chart Regression

on:
  pull_request:
    branches: [main, stable]
    paths:
      - 'packages/hardness/adapters/src/visual-chart-contract.ts'
      - 'packages/hardness/adapters/src/visualize-tool.ts'
      - 'packages/hardness/adapters/src/canvas-tool.ts'
      - 'packages/hardness/adapters/tests/*visualize*.spec.ts'
      - 'packages/hardness/adapters/tests/canvas-tool.spec.ts'
      - 'packages/client/ui-conversation/src/client/chat/PhoenixVisualizer.tsx'
      - 'packages/client/ui-conversation/src/client/chat/HardnessArtifactBody.tsx'
      - 'packages/client/ui-conversation/tests/hardness-artifact-renderer.client.spec.tsx'
      - 'apps/cli/config/agent-presets/code/agent.cordis.yml'
      - 'apps/cli/config/agent-presets/standard/agent.cordis.yml'
      - '.github/workflows/phoenix-inline-chart-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inline-chart:
    name: Native fictional chart and HTML fallback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile
      - name: Run scoped chart and HTML preview regressions
        run: |
          pnpm exec vitest run \
            packages/hardness/adapters/tests/visualize-tool.spec.ts \
            packages/hardness/adapters/tests/canvas-tool.spec.ts \
            packages/client/ui-conversation/tests/hardness-artifact-renderer.client.spec.tsx \
            packages/client/ui-conversation/tests/visual-quality-gate.client.spec.ts
