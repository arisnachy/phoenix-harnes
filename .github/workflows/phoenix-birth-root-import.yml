name: PHOENIX Birth Root Import

on:
  push:
    branches:
      - phoenix/birth-root-v11

permissions:
  contents: write

concurrency:
  group: phoenix-birth-root-v11-import
  cancel-in-progress: false

jobs:
  import-deepseek-root:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      DSH_SHA: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
      DSH_ARCHIVE: https://github.com/deepseek-ai/DeepSeek-Harness/archive/b150a551b8d465e31e418e1b2eaf5e79bbb7d28e.tar.gz
    steps:
      - name: Checkout PHOENIX birth branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phoenix/birth-root-v11

      - name: Import exact DeepSeek Harness snapshot as PHOENIX root
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "PHOENIX birth failed at line ${LINENO}: ${BASH_COMMAND}" >&2' ERR

          birth_head="$(git rev-parse HEAD)"
          cp -L LICENSE /tmp/phoenix-agpl-license
          if [[ -f SECURITY.md ]]; then cp -L SECURITY.md /tmp/phoenix-security-v10.md; fi

          rm -rf /tmp/phoenix-dsh /tmp/phoenix-dsh.tar.gz
          mkdir -p /tmp/phoenix-dsh
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 \
            "$DSH_ARCHIVE" -o /tmp/phoenix-dsh.tar.gz
          tar -xzf /tmp/phoenix-dsh.tar.gz --strip-components=1 -C /tmp/phoenix-dsh

          test -f /tmp/phoenix-dsh/package.json
          test -f /tmp/phoenix-dsh/LICENSE
          test -d /tmp/phoenix-dsh/apps
          test -d /tmp/phoenix-dsh/packages
          test -d /tmp/phoenix-dsh/native
          test -d /tmp/phoenix-dsh/vendor
          test -d /tmp/phoenix-dsh/website
          node -e "const p=require('/tmp/phoenix-dsh/package.json'); if(p.version!=='0.1.1-rc.2') process.exit(1)"

          cp -L /tmp/phoenix-dsh/LICENSE /tmp/deepseek-harness-mit-license
          if [[ -f /tmp/phoenix-dsh/NOTICE ]]; then cp -L /tmp/phoenix-dsh/NOTICE /tmp/deepseek-harness-notice; fi
          cp -L /tmp/phoenix-dsh/README.md /tmp/deepseek-harness-readme

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          # Upstream workflows are deliberately not activated in the downstream repo.
          # PHOENIX imports source/configuration and installs its own minimal birth gate.
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/phoenix-dsh/ ./

          rm -f LICENSE
          cp /tmp/phoenix-agpl-license LICENSE
          cp /tmp/deepseek-harness-mit-license LICENSE.deepseek-harness
          cp /tmp/deepseek-harness-readme README.deepseek-harness.md
          if [[ -f /tmp/deepseek-harness-notice ]]; then cp /tmp/deepseek-harness-notice NOTICE.deepseek-harness; fi

          mkdir -p docs/phoenix .github/workflows
          if [[ -f /tmp/phoenix-security-v10.md ]]; then cp /tmp/phoenix-security-v10.md docs/phoenix/SECURITY-v10-legacy.md; fi

          cat > PHOENIX_UPSTREAM.json <<'JSON'
          {
            "product": "PHOENIX",
            "upstream": "https://github.com/deepseek-ai/DeepSeek-Harness",
            "upstreamCommit": "b150a551b8d465e31e418e1b2eaf5e79bbb7d28e",
            "upstreamVersion": "0.1.1-rc.2",
            "importMode": "root-downstream",
            "upstreamLicense": "MIT",
            "phoenixModificationsLicense": "AGPL-3.0-only",
            "legacyPhoenixBranch": "legacy/standalone-v10"
          }
          JSON

          cat > README.md <<'MD'
          # PHOENIX

          **PHOENIX is an evolutive, provider-neutral AI engineering harness born from DeepSeek Harness and transformed as an independent downstream product.**

          This repository intentionally keeps the DeepSeek Harness monorepo anatomy (`apps/`, `packages/`, `native/`, `scripts/`, `vendor/`, `website/`) because PHOENIX evolves that codebase rather than wrapping it beside another harness.

          The first PHOENIX-native evolution layer is capability-aware model selection built against the existing DSH LLM/catalog seams. Subsequent evolution ports mission resilience, cost/context governance, MCP/tool intelligence, evidence-driven learning, security membranes and model-mesh orchestration into the same native runtime.

          ## Genealogy

          PHOENIX root was imported from `deepseek-ai/DeepSeek-Harness` commit `b150a551b8d465e31e418e1b2eaf5e79bbb7d28e` (`0.1.1-rc.2`). See `PHOENIX_UPSTREAM.json` and `README.deepseek-harness.md` for the upstream snapshot genealogy and original documentation.

          ## Licensing

          The imported DeepSeek Harness material retains its MIT license in `LICENSE.deepseek-harness` (and upstream notice, when present, in `NOTICE.deepseek-harness`). PHOENIX-specific additions are distributed under `AGPL-3.0-only`; see root `LICENSE`.

          ## Birth principle

          > DeepSeek Harness is the initial DNA. PHOENIX is the organism we evolve from it.

          Historical standalone PHOENIX v1-v10 is preserved on branch `legacy/standalone-v10` as a migration quarry; it is not the new runtime body.
          MD

          cat > NOTICE <<'TXT'
          PHOENIX

          PHOENIX is an independent downstream work derived in part from DeepSeek Harness.
          The imported DeepSeek Harness snapshot is identified in PHOENIX_UPSTREAM.json and retains its MIT terms in LICENSE.deepseek-harness and its upstream notice in NOTICE.deepseek-harness when supplied.
          PHOENIX-specific additions are licensed under AGPL-3.0-only as stated in LICENSE.

          DeepSeek and DeepSeek Harness names remain the property of their respective owners. PHOENIX is not represented as an official DeepSeek product.
          TXT

          cat > .github/workflows/ci.yml <<'YAML'
          name: PHOENIX Root CI

          on:
            pull_request:
            push:
              branches: [main]

          permissions:
            contents: read

          concurrency:
            group: phoenix-ci-${{ github.ref }}
            cancel-in-progress: true

          env:
            DSH_TELEMETRY_DISABLED: '1'
            DSH_GATE_CONCURRENCY: '2'

          jobs:
            birth-and-runtime:
              runs-on: ubuntu-24.04
              timeout-minutes: 60
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - uses: pnpm/action-setup@v4
                  with:
                    version: 11.7.0
                    run_install: false
                - uses: actions/setup-node@v4
                  with:
                    node-version: '24'
                    cache: pnpm
                - name: Verify PHOENIX genealogy and root anatomy
                  run: |
                    node -e "const p=require('./PHOENIX_UPSTREAM.json'); if(p.upstreamCommit!=='b150a551b8d465e31e418e1b2eaf5e79bbb7d28e'||p.importMode!=='root-downstream') process.exit(1)"
                    test -d apps
                    test -d packages
                    test -d native
                    test -d scripts
                    test -d vendor
                    test -d website
                    test -f pnpm-lock.yaml
                    test -f README.deepseek-harness.md
                    test -f LICENSE.deepseek-harness
                    test -f LICENSE
                - name: Install upstream-derived workspace
                  run: pnpm install --frozen-lockfile
                - name: Build host contracts
                  run: pnpm run build:lib:host
                - name: Typecheck
                  run: pnpm run typecheck:contracts-ready
                - name: Unit tests
                  run: pnpm test
          YAML

          test -d apps
          test -d packages
          test -d native
          test -d scripts
          test -d vendor
          test -d website
          test -f pnpm-lock.yaml
          test -f LICENSE.deepseek-harness
          test -f PHOENIX_UPSTREAM.json

          git add -A
          tracked="$(git ls-files | wc -l | tr -d ' ')"
          echo "PHOENIX birth staged tracked files: ${tracked}"
          if (( tracked < 5000 )); then
            echo "Refusing incomplete PHOENIX root import: only ${tracked} tracked files" >&2
            exit 1
          fi

          git config user.name 'PHOENIX Birth Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'birth: PHOENIX rises from DeepSeek Harness root'

          # Refuse to overwrite a concurrent human/connector update to the dedicated birth branch.
          git fetch origin phoenix/birth-root-v11
          remote_head="$(git rev-parse origin/phoenix/birth-root-v11)"
          if [[ "$remote_head" != "$birth_head" ]]; then
            echo "Birth branch moved concurrently: expected ${birth_head}, found ${remote_head}" >&2
            exit 1
          fi
          git push --force-with-lease=refs/heads/phoenix/birth-root-v11:${birth_head} origin HEAD:phoenix/birth-root-v11
