name: Phoenix lint repair check
on:
  push:
    branches: [repair-lint-check-20260928]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair-lint-check-20260928
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contracts lint
        run: pnpm run lint:contracts-ready
      - name: Duplication
        if: always()
        run: pnpm run duplication
