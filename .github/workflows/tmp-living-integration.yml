name: Living integration gate

on:
  push:
    branches: ['feat/universal-living-creations-20260913']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Wire base composition
        run: node .github/tmp-living-integrate.mjs
      - name: Install and regenerate
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run prepare:change
          pnpm run gen-tool-catalog
          pnpm run gen-cordis-api
      - name: Test living capability
        run: pnpm exec vitest run packages/core/living-local/tests/living-local.spec.ts packages/core/tool-living/tests/tool-living.spec.ts
      - name: Verify composition and types
        run: |
          pnpm run verify-cordis-config
          pnpm run typecheck
      - name: Commit generated integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset .github/workflows/tmp-living-integration.yml .github/tmp-living-integrate.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(living): regenerate integration artifacts'
          git push origin HEAD:feat/universal-living-creations-20260913
