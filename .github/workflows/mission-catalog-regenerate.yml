name: Mission catalog regeneration

on:
  push:
    branches:
      - feat/mission-runtime-codex-patterns-20260930

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Regenerate affected catalogs
        run: |
          pnpm run gen-config-catalog
          pnpm run gen-tool-catalog
          pnpm run gen-persistence-catalog
      - name: Commit generated artifacts and retire this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mission-catalog-regenerate.yml
          git add docs/config-catalog.md docs/tool-catalog.md docs/persistence-catalog.md packages/core/session/src/known-event-types.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(mission): regenerate catalogs"
          git push origin HEAD:feat/mission-runtime-codex-patterns-20260930
