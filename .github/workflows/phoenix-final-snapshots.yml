name: Phoenix final snapshots

on:
  push:
    branches: [repair-final-snapshots-20260928]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair-final-snapshots-20260928
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh Typert snapshot
        run: pnpm exec vitest run packages/typert/generator/tests/type-model.spec.ts -u --maxWorkers=1
      - name: Refresh headless connector snapshot
        run: pnpm exec vitest run --config vitest.e2e.config.ts examples/headless-agent/tests/keyless-smoke.e2e.ts -u --maxWorkers=1
      - name: Commit canonical snapshot updates
        run: |
          if git diff --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "Phoenix Repair Bot"
          git config user.email "phoenix-repair-bot@users.noreply.github.com"
          git add -A
          git commit -m "test: refresh final Phoenix snapshots"
          git push origin HEAD:repair-final-snapshots-20260928
