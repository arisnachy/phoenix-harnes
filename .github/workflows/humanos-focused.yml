name: HumanOS focused regression

on:
  pull_request:
    paths:
      - 'packages/hardness/adapters/**'
      - '.github/workflows/humanos-focused.yml'

concurrency:
  group: humanos-focused-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  humanos-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Verify HumanOS model and registration
        run: pnpm exec vitest run packages/hardness/adapters/tests/humanos-self-model.spec.ts packages/hardness/adapters/tests/adapters.spec.ts
