name: PHOENIX Genesis doc materializer

on:
  pull_request:
    branches:
      - phoenix/genesis-v12

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/genesis-native-contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Materialize PHOENIX downstream contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              ('@deepseek-ai/dsh-phoenix-runtime', '@arisnachy/phoenix-runtime'),
              ('@deepseek-ai/dsh-phoenix', '@arisnachy/phoenix-bundle'),
          ]
          targets = [Path('packages/phoenix'), Path('packages/bundle/phoenix')]
          extra = [Path('packages/bundle/README.md'), Path('packages/bundle/README.zh.md')]
          suffixes = {'.json', '.ts', '.md', '.yml', '.yaml'}
          for root in targets:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in suffixes:
                      continue
                  text = path.read_text()
                  for old, new in replacements:
                      text = text.replace(old, new)
                  path.write_text(text)
          for path in extra:
              text = path.read_text()
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text)

          path = Path('packages/README.md')
          text = path.read_text()
          text = text.replace('npm scope: `@deepseek-ai/dsh-*`;', 'Scopes: DSH `@deepseek-ai/dsh-*`, PHOENIX `@arisnachy/phoenix-*`;')
          text = text.replace('Groups hold `packages/<group>/<pkg>/`; names stay `@deepseek-ai/dsh-<pkg>`.', 'Groups hold `packages/<group>/<pkg>/`; names follow their owning scope.')
          path.write_text(text)
          path = Path('packages/README.zh.md')
          text = path.read_text()
          text = text.replace('npm scope 为 `@deepseek-ai/dsh-*`；', 'Scope：DSH 使用 `@deepseek-ai/dsh-*`，PHOENIX 使用 `@arisnachy/phoenix-*`；')
          text = text.replace('包按组置于 `packages/<group>/<pkg>/`；包名仍为 `@deepseek-ai/dsh-<pkg>`。', '包按组置于 `packages/<group>/<pkg>/`；包名遵循各自的所有权 scope。')
          path.write_text(text)

          ladder = Path('packages/phoenix/runtime/src/model-ladder.ts')
          code = ladder.read_text()
          code = code.replace('  snapshot(ref: ModelRef, now = Date.now()): ModelSnapshot | undefined {', '  snapshot(ref: ModelRef, now: number = Date.now()): ModelSnapshot | undefined {')
          code = code.replace('  all(now = Date.now()): ModelSnapshot[] {', '  all(now: number = Date.now()): ModelSnapshot[] {')
          code = code.replace('  rank(role: PhoenixRole, candidates?: readonly ModelRef[], now = Date.now()): RankedModel[] {', '  rank(role: PhoenixRole, candidates?: readonly ModelRef[], now: number = Date.now()): RankedModel[] {')
          code = code.replace(
              "  private hasAuthorityEvidence(state: ModelState): boolean {\n  let weightedSamples = 0\n  for (const points of state.evidence.values()) {\n    for (const point of points) {\n      if (point.source === 'benchmark' || point.source === 'operator') weightedSamples += point.weight\n    }\n  }\n  return weightedSamples >= 3\n}\n\nprivate dimensionSnapshot(points: EvidencePoint[] | undefined, now: number): DimensionSnapshot | undefined {",
              "  private hasAuthorityEvidence(state: ModelState): boolean {\n    let weightedSamples = 0\n    for (const points of state.evidence.values()) {\n      for (const point of points) {\n        if (point.source === 'benchmark' || point.source === 'operator') weightedSamples += point.weight\n      }\n    }\n    return weightedSamples >= 3\n  }\n\n  private dimensionSnapshot(points: EvidencePoint[] | undefined, now: number): DimensionSnapshot | undefined {",
          )
          ladder.write_text(code)

          constraints = Path('scripts/check-workspace-constraints.ts')
          text = constraints.read_text()
          marker = "const experimentalPackageNamePrefix = '@deepseek-ai/dsh-experimental-'\n"
          addition = marker + """/** Downstream PHOENIX packages published from this repository, not DeepSeek's namespace. */
          const phoenixPackageDirectory = /^(?:packages\\/phoenix\\/[^/]+|packages\\/bundle\\/phoenix)$/
          const phoenixPackageNamePrefix = '@arisnachy/phoenix-'
          const phoenixPublishedRepositoryUrl = 'git+https://github.com/arisnachy/phoenix-harnes.git'
          """
          if 'const phoenixPackageDirectory' not in text:
              if marker not in text:
                  raise SystemExit('constraints identity anchor missing')
              text = text.replace(marker, addition, 1)
          release_anchor = "  } else if (releaseMemberDirectory.test(dir)) {\n"
          phoenix_branch = """  } else if (phoenixPackageDirectory.test(dir)) {
            if (manifest.name?.startsWith(phoenixPackageNamePrefix) !== true) {
              errors.push(`${label}: downstream PHOENIX package name must start with ${JSON.stringify(phoenixPackageNamePrefix)}`)
            }
            if (manifest.private === true) errors.push(`${label}: downstream PHOENIX package must not set \"private\": true`)
            if (manifest.publishConfig?.access !== 'public') errors.push(`${label}: downstream PHOENIX package must set publishConfig.access to \"public\"`)
            if (manifest.repository?.type !== 'git' || manifest.repository.url !== phoenixPublishedRepositoryUrl || manifest.repository.directory !== dir) {
              errors.push(`${label}: downstream PHOENIX package repository must use ${phoenixPublishedRepositoryUrl} with directory ${dir}`)
            }
          } else if (releaseMemberDirectory.test(dir)) {
          """
          if 'downstream PHOENIX package repository must use' not in text:
              if release_anchor not in text:
                  raise SystemExit('constraints release anchor missing')
              text = text.replace(release_anchor, phoenix_branch, 1)
          shape_anchor = "  if (dir.startsWith('packages/') && manifest.name?.startsWith('@deepseek-ai/dsh-')) {\n"
          shape_replacement = "  if (dir.startsWith('packages/') && (manifest.name?.startsWith('@deepseek-ai/dsh-') || phoenixPackageDirectory.test(dir))) {\n"
          if shape_anchor in text:
              text = text.replace(shape_anchor, shape_replacement, 1)
          elif shape_replacement not in text:
              raise SystemExit('constraints package-shape anchor missing')
          constraints.write_text(text)

          config = Path('tsconfig.base.json')
          text = config.read_text()
          anchor = '      "@deepseek-ai/dsh-*": [\n'
          mappings = """      "@arisnachy/phoenix-runtime": ["./packages/phoenix/runtime/src"],
                "@arisnachy/phoenix-runtime/invariant": ["./packages/phoenix/runtime/src/invariant.ts"],
                "@arisnachy/phoenix-bundle": ["./packages/bundle/phoenix/src"],
                "@arisnachy/phoenix-bundle/invariant": ["./packages/bundle/phoenix/src/invariant.ts"],
                "@arisnachy/phoenix-*": ["./packages/phoenix/*/src"],
                "@arisnachy/phoenix-*/invariant": ["./packages/phoenix/*/src/invariant.ts"],
          """
          if '"@arisnachy/phoenix-runtime"' not in text:
              if anchor not in text:
                  raise SystemExit('tsconfig PHOENIX mapping anchor missing')
              config.write_text(text.replace(anchor, mappings + anchor, 1))

          catalog = Path('scripts/gen-cordis-catalog.ts')
          text = catalog.read_text()
          service_anchor = "  planMode: 'plan.md',\n"
          if "  phoenix: 'core.md',\n" not in text:
              if service_anchor not in text:
                  raise SystemExit('Typert SERVICE_PAGE anchor missing')
              text = text.replace(service_anchor, service_anchor + "  phoenix: 'core.md',\n", 1)
          link_anchor = "  ModelSelection: 'core.md',\n"
          phoenix_types = """  CapabilityEvidence: 'core.md',
            ModelRef: 'core.md',
            PhoenixRole: 'core.md',
            RankedModel: 'core.md',
          """
          if "  CapabilityEvidence: 'core.md',\n" not in text:
              if link_anchor not in text:
                  raise SystemExit('Typert LINK_MAP anchor missing')
              text = text.replace(link_anchor, link_anchor + phoenix_types, 1)
          catalog.write_text(text)

          graphs = Path('scripts/gen-doc-graphs.ts')
          text = graphs.read_text()
          role_anchor = 'const SERVICE_ROLES: ServiceRole[] = [\n'
          role = """  {
            key: 'phoenix',
            pkg: 'phoenix-runtime',
            title: 'PHOENIX adaptive policy runtime',
            mode: 'core',
            consumers: [],
            note: 'Downstream evidence-ranked routing, bounded cross-provider recovery, token-flight observation, ROI gating, quarantine, and monotonic safety policy around native DSH seams.',
          },
          """
          if "key: 'phoenix'" not in text:
              if role_anchor not in text:
                  raise SystemExit('service-role anchor missing')
              text = text.replace(role_anchor, role_anchor + role, 1)
          graphs.write_text(text)
          PY

      - name: Synchronize lockfile and install
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Regenerate PHOENIX-owned documentation
        run: |
          pnpm run constraints
          pnpm run gen-cordis-catalog
          pnpm run gen-cordis-api
          pnpm run gen-tool-catalog
          pnpm run gen-config-catalog
          pnpm run gen-module-graph
          pnpm run gen-doc-graphs

      - name: Synchronize generated bilingual contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          # Config catalog: keep the generated PHOENIX config declaration at the
          # same ordinal as English, and mirror the downstream library entry.
          english = Path('docs/config-catalog.md')
          chinese = Path('docs/config-catalog.zh.md')
          en = english.read_text()
          zh = chinese.read_text()
          marker = '## `@arisnachy/phoenix-runtime`'
          idx = en.find(marker)
          if idx < 0:
              raise SystemExit('generated PHOENIX config section missing')
          start = en.rfind('<a id=', 0, idx)
          if start < 0:
              start = idx
          end = en.find('\n<a id=', idx + len(marker))
          if end < 0:
              end = len(en)
          section = en[start:end].rstrip()
          old_markers = ['## `@deepseek-ai/dsh-phoenix-runtime`', marker]
          existing = next((zh.find(value) for value in old_markers if zh.find(value) >= 0), -1)
          if existing >= 0:
              old_start = zh.rfind('<a id=', 0, existing)
              if old_start < 0:
                  old_start = existing
              old_end = zh.find('\n<a id=', existing + 1)
              if old_end < 0:
                  old_end = len(zh)
              zh = zh[:old_start].rstrip() + '\n\n' + section + '\n' + zh[old_end:]
          else:
              first_entry = zh.find('<a id=')
              if first_entry < 0:
                  raise SystemExit('Chinese config catalog has no package entry anchor')
              zh = zh[:first_entry] + section + '\n\n' + zh[first_entry:]
          phoenix_bundle_line = '- `@arisnachy/phoenix-bundle` ([`packages/bundle/phoenix/src/index.ts`](../packages/bundle/phoenix/src/index.ts))\n'
          acp_snapshot = '- `@deepseek-ai/dsh-acp-snapshot`'
          if phoenix_bundle_line.strip() not in zh:
              lib_index = zh.find(acp_snapshot)
              if lib_index < 0:
                  raise SystemExit('Chinese config catalog library-list anchor missing')
              zh = zh[:lib_index] + phoenix_bundle_line + zh[lib_index:]
          chinese.write_text(zh)

          # Capability graph: generated Mermaid blocks are structural protocol
          # and therefore byte-identical between language peers. Add only the
          # downstream node/edge/row; keep surrounding Chinese prose untouched.
          capability = Path('docs/capability-seams.zh.md')
          cap = capability.read_text()
          nodes = '  pkg_phoenix_runtime["phoenix-runtime"]\n  svc_phoenix["ctx.phoenix<br/>PHOENIX adaptive policy runtime"]\n'
          if 'svc_phoenix["ctx.phoenix<br/>PHOENIX adaptive policy runtime"]' not in cap:
              anchor = 'flowchart LR\n'
              if anchor not in cap:
                  raise SystemExit('Chinese capability Mermaid anchor missing')
              cap = cap.replace(anchor, anchor + nodes, 1)
          edge = '  pkg_phoenix_runtime --> svc_phoenix\n'
          if edge.strip() not in cap:
              anchor = '  pkg_permission_presets --> svc_permissionPresets\n'
              if anchor not in cap:
                  raise SystemExit('Chinese capability edge anchor missing')
              cap = cap.replace(anchor, anchor + edge, 1)
          row = '| `ctx.phoenix` | `core` | `phoenix-runtime` | - | - | - | Downstream evidence-ranked routing, bounded cross-provider recovery, token-flight observation, ROI gating, quarantine, and monotonic safety policy around native DSH seams. |\n'
          if '| `ctx.phoenix` |' not in cap:
              anchor = '| `ctx.attachments` |'
              index = cap.find(anchor)
              if index < 0:
                  raise SystemExit('Chinese capability table anchor missing')
              cap = cap[:index] + row + cap[index:]
          capability.write_text(cap)

          def blob(path: Path) -> str:
              return subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()

          def record(left: str, right: str, record_path: str) -> None:
              a, b = Path(left), Path(right)
              Path(record_path).write_text(f'{a.name}: {blob(a)}\n{b.name}: {blob(b)}\n')

          pairs = [
              ('docs/config-catalog.md', 'docs/config-catalog.zh.md', 'docs/config-catalog.i18n.yaml'),
              ('docs/capability-seams.md', 'docs/capability-seams.zh.md', 'docs/capability-seams.i18n.yaml'),
              ('docs/event-producer-consumer.md', 'docs/event-producer-consumer.zh.md', 'docs/event-producer-consumer.i18n.yaml'),
              ('packages/README.md', 'packages/README.zh.md', 'packages/README.i18n.yaml'),
              ('packages/bundle/README.md', 'packages/bundle/README.zh.md', 'packages/bundle/README.i18n.yaml'),
              ('packages/bundle/phoenix/README.md', 'packages/bundle/phoenix/README.zh.md', 'packages/bundle/phoenix/README.i18n.yaml'),
              ('packages/phoenix/README.md', 'packages/phoenix/README.zh.md', 'packages/phoenix/README.i18n.yaml'),
              ('packages/phoenix/runtime/README.md', 'packages/phoenix/runtime/README.zh.md', 'packages/phoenix/runtime/README.i18n.yaml'),
          ]
          for left, right, output in pairs:
              record(left, right, output)
          PY

      - name: Checkpoint materialized contract state
        run: |
          if git diff --quiet; then
            echo 'PHOENIX Genesis materialized state already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(phoenix): synchronize downstream bilingual contracts'
          git push origin HEAD:${{ github.head_ref }}

      - name: Prove documentation contract
        run: |
          pnpm run verify-doc-graphs
          pnpm run verify-translation-pairing
          pnpm run verify-export-jsdoc
          pnpm run verify-package-readme-model-experience
          pnpm run verify-doc-budgets
          git diff --check
