name: PHOENIX Intelligent UI components

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/client/ui-conversation/src/client/chat/**'
      - 'packages/client/ui-conversation/tests/generative-canvas.client.spec.tsx'
      - '.github/workflows/phoenix-intelligent-ui.yml'
  push:
    branches:
      - 'feat/phoenix-prebuilt-generative-components-20261008'
      - main
    paths:
      - 'packages/client/ui-conversation/src/client/chat/**'
      - 'packages/client/ui-conversation/tests/generative-canvas.client.spec.tsx'
      - '.github/workflows/phoenix-intelligent-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intelligent-ui:
    name: Rendered chat widgets and actions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Immutable dependencies
        run: pnpm install --frozen-lockfile
      - name: Intelligent UI regression suite
        run: pnpm exec vitest run packages/client/ui-conversation/tests/generative-canvas.client.spec.tsx
