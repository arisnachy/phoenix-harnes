name: PHOENIX v13 integration

on:
  pull_request:
    branches:
      - phoenix/genesis-v12

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'phoenix/cognition-v13'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PHOENIX v13 head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Integrate v13 into canonical host graph and harden Repo Brain
        run: |
          python - <<'PY'
          from pathlib import Path

          host = Path('tsconfig.host.json')
          text = host.read_text()
          anchor = '    { "path": "./packages/phoenix/runtime" },\n'
          wanted = [
              '    { "path": "./packages/phoenix/ai-bus" },\n',
              '    { "path": "./packages/phoenix/repo-brain" },\n',
          ]
          if anchor not in text:
              raise SystemExit('PHOENIX runtime reference anchor not found')
          insertion = anchor + ''.join(row for row in wanted if row.strip() not in text)
          if insertion != anchor:
              text = text.replace(anchor, insertion, 1)
              host.write_text(text)

          source = Path('packages/phoenix/repo-brain/src/index.ts')
          code = source.read_text()
          code = code.replace(
              "import { readdir, readFile, stat } from 'node:fs/promises'",
              "import { open, readdir, stat } from 'node:fs/promises'",
          )
          old_read = """      const bytesToRead = Math.min(info.size, this.config.maxFileBytes)\n      const handle = await readFile(absolute)\n      const text = handle.subarray(0, bytesToRead).toString('utf8')\n"""
          new_read = """      const bytesToRead = Math.min(info.size, this.config.maxFileBytes)\n      const file = await open(absolute, 'r')\n      let text: string\n      try {\n        const buffer = Buffer.alloc(bytesToRead)\n        const { bytesRead } = await file.read(buffer, 0, bytesToRead, 0)\n        text = buffer.subarray(0, bytesRead).toString('utf8')\n      } finally {\n        await file.close()\n      }\n"""
          if old_read in code:
              code = code.replace(old_read, new_read, 1)
          elif new_read not in code:
              raise SystemExit('Repo Brain bounded-read anchor not found')

          old_candidates = """        const candidates: string[] = [base]\n        for (const extension of IMPORTABLE_EXTENSIONS) {\n          candidates.push(`${base}${extension}`)\n          candidates.push(resolve(base, `index${extension}`))\n        }\n"""
          new_candidates = """        const candidates: string[] = [base]\n        const declaredExtension = extname(base).toLowerCase()\n        if (['.js', '.jsx', '.mjs', '.cjs'].includes(declaredExtension)) {\n          const stem = base.slice(0, -declaredExtension.length)\n          for (const extension of ['.ts', '.tsx', '.mts', '.cts']) candidates.push(`${stem}${extension}`)\n        }\n        for (const extension of IMPORTABLE_EXTENSIONS) {\n          candidates.push(`${base}${extension}`)\n          candidates.push(resolve(base, `index${extension}`))\n        }\n"""
          if old_candidates in code:
              code = code.replace(old_candidates, new_candidates, 1)
          elif new_candidates not in code:
              raise SystemExit('Repo Brain import-resolution anchor not found')
          source.write_text(code)
          PY

      - name: Synchronize workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Prove frozen install
        run: pnpm install --frozen-lockfile

      - name: Run focused PHOENIX tests
        run: >-
          pnpm exec vitest run
          packages/phoenix/ai-bus/tests/ai-bus.spec.ts
          packages/phoenix/repo-brain/tests/repo-brain.spec.ts
          packages/phoenix/runtime/tests/model-ladder.spec.ts
          packages/phoenix/runtime/tests/task-role.spec.ts
          packages/bundle/phoenix/tests/phoenix.spec.ts

      - name: Run canonical typecheck
        run: pnpm run typecheck

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit verified integration state
        run: |
          if git diff --quiet -- packages/phoenix/repo-brain/src/index.ts tsconfig.host.json pnpm-lock.yaml; then
            echo 'v13 integration state is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/phoenix/repo-brain/src/index.ts tsconfig.host.json pnpm-lock.yaml
          git commit -m 'chore(phoenix): verify and synchronize v13 integration'
          git push origin HEAD:${{ github.head_ref }}
