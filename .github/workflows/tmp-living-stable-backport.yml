name: Living stable backport gate

on:
  push:
    branches: ['backport/universal-living-creations-stable-20260913']

permissions:
  contents: write

jobs:
  backport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Apply verified Living squash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main stable
          if ! git merge-base --is-ancestor c2207e4b7623482df77f07a591a7b3d2feda4274 HEAD; then
            git cherry-pick c2207e4b7623482df77f07a591a7b3d2feda4274
          fi
      - name: Install and regenerate
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run prepare:change
          pnpm run gen-tool-catalog
          pnpm run gen-cordis-api
          pnpm run verify-translation-pairing --write packages/core/living/README.md
          pnpm run verify-translation-pairing --write packages/core/living-local/README.md
          pnpm run verify-translation-pairing --write packages/core/tool-living/README.md
          pnpm run verify-translation-pairing --write docs/subsystems/living.md
          pnpm run verify-translation-pairing --write .agents/notes/implemented/architecture/2026-09-13-universal-living-creations.md
      - name: Test Living capability
        run: pnpm exec vitest run packages/core/living-local/tests/living-local.spec.ts packages/core/tool-living/tests/tool-living.spec.ts
      - name: Verify stable composition and types
        run: |
          pnpm run verify-cordis-config
          pnpm run typecheck
      - name: Publish verified backport
        run: |
          git add -A
          git reset .github/workflows/tmp-living-stable-backport.yml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(stable): regenerate Living integration artifacts'
          fi
          git push origin HEAD:backport/universal-living-creations-stable-20260913
