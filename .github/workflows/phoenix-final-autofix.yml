name: Phoenix final autofix

on:
  push:
    branches: [repair-final-autofix-20260928]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair-final-autofix-20260928
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build official tree
        run: pnpm run build
      - name: Validate lint
        run: pnpm run lint:contracts-ready
      - name: Validate translations
        run: pnpm run verify-translation-pairing
