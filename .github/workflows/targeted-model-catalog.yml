name: Targeted model catalog regression

on:
  pull_request:

permissions:
  contents: read

jobs:
  targeted-model-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Run built-in route lifecycle regression
        run: pnpm exec vitest run packages/llm/llm-pi-ai/tests/builtin-routes-loader.spec.ts
