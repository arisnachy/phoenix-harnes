name: tmp generate Cordis client catalog

on:
  push:
    branches:
      - fix/stable-cordis-inflow-workspace-20260913

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Generate client catalog
        run: pnpm run gen-client-catalog
      - name: Commit generated catalog when changed
        shell: bash
        run: |
          if git diff --quiet -- packages/extensions/cordis-client-runner/src/client/slot-catalog.ts; then
            echo "catalog already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/extensions/cordis-client-runner/src/client/slot-catalog.ts
          git commit -m "chore(ui): regenerate client slot catalog"
          git push origin HEAD:fix/stable-cordis-inflow-workspace-20260913
