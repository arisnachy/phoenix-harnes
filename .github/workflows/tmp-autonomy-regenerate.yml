name: Temporary autonomy generator

on:
  push:
    branches: [tmp/autonomy-generator]
    paths:
      - .github/workflows/tmp-autonomy-regenerate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/autonomy-generator
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate official docs
        run: |
          pnpm run gen-config-catalog
          pnpm run gen-module-graph
          pnpm run gen-doc-graphs
          pnpm run gen-cordis-catalog
      - name: Commit generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs packages/extensions/tool-cordis/src/api-catalog.ts
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'chore(tmp): regenerate autonomy docs'
          git push origin HEAD:tmp/autonomy-generator
