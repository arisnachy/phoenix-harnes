name: Phoenix Interactive 3D Regression

on:
  pull_request:
    branches: [main, stable]
    paths:
      - 'packages/hardness/adapters/src/scene3d-tool.ts'
      - 'packages/hardness/adapters/src/index.ts'
      - 'packages/hardness/adapters/tests/scene3d-tool.spec.ts'
      - 'packages/hardness/adapters/tests/adapters.spec.ts'
      - 'packages/client/ui-conversation/src/client/chat/Scene3DView.tsx'
      - 'packages/client/ui-conversation/src/client/chat/Scene3DView.module.css'
      - 'packages/client/ui-conversation/src/client/chat/HardnessArtifactBody.tsx'
      - 'packages/client/ui-conversation/src/client/artifact.ts'
      - 'packages/client/ui-conversation/src/client/index.ts'
      - 'packages/client/ui-conversation/tests/scene3d-view.client.spec.tsx'
      - '.github/workflows/phoenix-interactive-3d-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scene-3d:
    name: Native geometric 3D and orbit controls
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify portable 3D tool, viewer and existing artifact compatibility
        run: |
          pnpm exec vitest run \
            packages/hardness/adapters/tests/scene3d-tool.spec.ts \
            packages/hardness/adapters/tests/adapters.spec.ts \
            packages/client/ui-conversation/tests/scene3d-view.client.spec.tsx \
            packages/client/ui-conversation/tests/hardness-artifact-renderer.client.spec.tsx \
            packages/client/ui-conversation/tests/universal-artifact-surface.client.spec.tsx
