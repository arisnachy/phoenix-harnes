name: Phoenix PR 1132 preserve new main sports logic

# Deliberately one-shot and branch-scoped; never alters main/stable.
on:
  push:
    branches:
      - fix/phoenix-dual-core-integration-20261023
    paths:
      - .github/workflows/phoenix-pr1132-resolve-known-main.yml

permissions:
  contents: write

concurrency:
  group: phoenix-pr1132-resolve-known-main
  cancel-in-progress: false

jobs:
  preserve-new-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/phoenix-dual-core-integration-20261023
          fetch-depth: 0
          persist-credentials: true
      - name: Merge newest main, preserving audited newer sports-rendering logic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phoenix CI Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'Already synchronized with main'
            exit 0
          fi
          if git merge --no-ff --no-commit origin/main; then
            echo 'Clean non-fast-forward integration'
          else
            # Audited vs abef3229: PR sides differ from common base in formatting;
            # main sides implement the latest automatic inline sports renderer.
            # Abort if any unexpected conflict appears: no blanket -X theirs.
            expected=$(printf '%s\n' \
              'packages/client/ui-conversation/src/client/chat/AssistantMarkdown.tsx' \
              'packages/client/ui-conversation/src/client/chat/ToolActivityFlow.tsx' \
              'packages/core/tool-sports/src/index.ts' | sort)
            actual=$(git diff --name-only --diff-filter=U | sort)
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Conflict set changed; refuse an unreviewed merge"
              git diff --name-only --diff-filter=U
              git merge --abort
              exit 1
            fi
            for file in \
              packages/client/ui-conversation/src/client/chat/AssistantMarkdown.tsx \
              packages/client/ui-conversation/src/client/chat/ToolActivityFlow.tsx \
              packages/core/tool-sports/src/index.ts; do
              # New main implementation delivers native sports cards directly,
              # unlike the PR's outdated expectation to print JSON fences.
              git checkout --theirs -- "$file"
              git add -- "$file"
            done
          fi
          git diff --cached --check
          git commit -m 'merge: carry forward new main sports rendering and Phoenix fixes into PR 1132'
          git push origin HEAD:fix/phoenix-dual-core-integration-20261023
