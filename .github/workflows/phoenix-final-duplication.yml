name: Phoenix final duplication

on:
  push:
    branches: [repair-final-duplication-20260928]

permissions:
  contents: read

jobs:
  duplication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair-final-duplication-20260928
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run duplication
