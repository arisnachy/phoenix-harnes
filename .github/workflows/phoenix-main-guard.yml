name: PHOENIX main guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phoenix-main-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compiled-main:
    name: main exact SHA / typecheck and build
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      DSH_GATE_CONCURRENCY: '1'
      DSH_PUBLINT_CONCURRENCY: '2'
      DSH_TELEMETRY_DISABLED: '1'
      PHOENIX_BUILD_TIMINGS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install immutable workspace
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Prove host and client contracts
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'phoenix-typecheck.log'
          pnpm run typecheck 2>&1 | Tee-Object -FilePath $log
          $commandExit = $LASTEXITCODE
          if ($commandExit -ne 0) { exit $commandExit }
          $timingAdvisories = @(Select-String -Path $log -SimpleMatch '[PLUGIN_TIMINGS]')
          if ($timingAdvisories.Count -gt 0) {
            Write-Warning "Build tooling emitted $($timingAdvisories.Count) plugin timing advisories; compiler exit status remains authoritative."
            $timingAdvisories | Select-Object -First 5 | ForEach-Object { Write-Warning $_.Line }
          }
      - name: Verify release, MCP recovery, and HARDNESS regressions
        shell: pwsh
        run: |
          pnpm exec vitest run scripts/ci-workflow.spec.ts packages/host/plugin-inventory/tests/mcp-managed.spec.ts packages/host/plugin-inventory/tests/inventory.spec.ts packages/hardness/hardness/tests/operating-protocol.spec.ts packages/hardness/hardness/tests/resolver.spec.ts packages/hardness/hardness/tests/cognitive-workflow.spec.ts packages/goal/goal-round-driver/tests/strategy.spec.ts packages/goal/goal-round-driver/tests/goal-round-driver.spec.ts packages/goal/goal-round-driver/tests/mission-fence.spec.ts packages/goal/goal-round-driver/tests/autonomy-prompt.spec.ts packages/core/agent/tests/model-selection.spec.ts packages/mcp/chrome-connector/tests/browser-interactions.spec.ts packages/mcp/chrome-connector/tests/connector.spec.ts packages/mcp/chrome-connector/tests/vault-presence.spec.ts packages/api/remotes/tests/agent-lookup.spec.ts packages/client/ui-workspace/tests/cleanup.client.spec.ts packages/bundle/web-app/tests/mini-browser.spec.ts packages/mcp/mcp-client/tests/mcp-client.spec.ts packages/mcp/chrome-connector/tests/form-layout-memory.spec.ts packages/session-learning/tool-session-learning/tests/procedural.spec.ts packages/credentials/secret-vault/tests/secure-login.spec.ts packages/credentials/secret-vault/tests/identity-registry.spec.ts packages/client/ui-conversation/tests/mini-browser.client.spec.tsx packages/client/ui-conversation/tests/mini-browser-flow.client.spec.ts packages/client/ui-conversation/tests/secure-ask.client.spec.tsx packages/llm/llm-pi-ai/tests/config.spec.ts packages/llm/llm-pi-ai/tests/convert.spec.ts packages/llm/llm-pi-ai/tests/catalog.spec.ts packages/llm/llm-pi-ai/tests/context.spec.ts packages/llm/llm-retry/tests/retry.spec.ts packages/hardness/adapters/tests/research-publish.spec.ts

      - name: Build the exact main SHA
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'phoenix-build.log'
          pnpm run build 2>&1 | Tee-Object -FilePath $log
          $commandExit = $LASTEXITCODE
          if ($commandExit -ne 0) { exit $commandExit }
          $timingAdvisories = @(Select-String -Path $log -SimpleMatch '[PLUGIN_TIMINGS]')
          if ($timingAdvisories.Count -gt 0) {
            Write-Warning "Build tooling emitted $($timingAdvisories.Count) plugin timing advisories; compiler exit status remains authoritative."
            $timingAdvisories | Select-Object -First 5 | ForEach-Object { Write-Warning $_.Line }
          }
      - name: Verify native Windows inventory
        shell: pwsh
        run: pnpm run check:ci:windows-blocking
