name: PHOENIX main guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phoenix-main-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compiled-main:
    name: main exact SHA / typecheck and build
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      DSH_GATE_CONCURRENCY: '1'
      DSH_PUBLINT_CONCURRENCY: '2'
      DSH_TELEMETRY_DISABLED: '1'
      PHOENIX_BUILD_TIMINGS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install immutable workspace
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Prove host and client contracts
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'phoenix-typecheck.log'
          pnpm run typecheck 2>&1 | Tee-Object -FilePath $log
          $commandExit = $LASTEXITCODE
          if ($commandExit -ne 0) { exit $commandExit }
          if (Select-String -Path $log -SimpleMatch '[PLUGIN_TIMINGS]' -Quiet) {
            Write-Error 'PLUGIN_TIMINGS regression detected during typecheck.'
            Select-String -Path $log -SimpleMatch '[PLUGIN_TIMINGS]' -Context 0,8
            exit 1
          }
      - name: Build the exact main SHA
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'phoenix-build.log'
          pnpm run build 2>&1 | Tee-Object -FilePath $log
          $commandExit = $LASTEXITCODE
          if ($commandExit -ne 0) { exit $commandExit }
          if (Select-String -Path $log -SimpleMatch '[PLUGIN_TIMINGS]' -Quiet) {
            Write-Error 'PLUGIN_TIMINGS regression detected during exact-SHA build.'
            Select-String -Path $log -SimpleMatch '[PLUGIN_TIMINGS]' -Context 0,8
            exit 1
          }
      - name: Verify native Windows inventory
        shell: pwsh
        run: pnpm run check:ci:windows-blocking
