name: PR58 release autofix

on:
  push:
    branches:
      - feat/codex-graft-full

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/codex-graft-full
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply authorization release closure
        run: python3 scripts/kira-pr58-auth-contract-fix.py
      - name: Repair deterministic source contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old in text:
                  p.write_text(text.replace(old, new, 1))

          # The monorepo must typecheck AuthorizationService from source truth,
          # not from a generated package declaration that can lag the source.
          p = Path('tsconfig.base.json')
          text = p.read_text()
          anchor = '      "@deepseek-ai/dsh-authorization/types": ["./packages/credentials/authorization/src/types.ts"],\n'
          root = '      "@deepseek-ai/dsh-authorization": ["./packages/credentials/authorization/src/index.ts"],\n'
          google = '      "@deepseek-ai/dsh-authorization/google": ["./packages/credentials/authorization/src/google-broker.ts"],\n'
          if root not in text and anchor in text:
              text = text.replace(anchor, root + anchor, 1)
          if google not in text and anchor in text:
              text = text.replace(anchor, anchor + google, 1)
          p.write_text(text)

          rep('packages/credentials/authorization/src/index.ts', '   * cannot be disconnected by deleting storage behind its back.\n   */\n  async disconnect(key: CredentialKey, signal?: AbortSignal): Promise<void> {', '   * cannot be disconnected by deleting storage behind its back.\n   * @param key - credential record whose provider session should be disconnected.\n   * @param signal - optional cancellation signal for provider teardown.\n   * @returns once provider teardown completed and the marker is verified absent.\n   */\n  async disconnect(key: CredentialKey, signal?: AbortSignal): Promise<void> {')

          p = Path('packages/credentials/authorization/src/google-broker.ts'); t = p.read_text()
          fixes = [
            ('/** Resolve broker configuration without inventing scopes or a deployment identity. */\nexport function resolveGoogleSpec(config: Config): ResolvedSpec {', '/**\n * Resolve broker configuration without inventing scopes or a deployment identity.\n * @param config - deployment-owned Google OAuth client id and requested scopes.\n * @returns validated, normalized broker configuration.\n */\nexport function resolveGoogleSpec(config: Config): ResolvedSpec {'),
            ('  /** Secret-free telemetry exists only while this process owns a live grant. */\n  async inspect(): Promise<AuthorizationTelemetry | undefined> {', '  /**\n   * Secret-free telemetry exists only while this process owns a live grant.\n   * @returns sanitized Google account and service capability telemetry, when connected.\n   */\n  async inspect(): Promise<AuthorizationTelemetry | undefined> {'),
            ('  /** Execute one request inside a fixed Google service boundary. */\n  async request(request: GoogleApiRequest): Promise<GoogleApiResponse> {', '  /**\n   * Execute one request inside a fixed Google service boundary.\n   * @param request - bounded Google service request.\n   * @returns the bounded response without credential-bearing headers.\n   */\n  async request(request: GoogleApiRequest): Promise<GoogleApiResponse> {'),
            ('  /** Clear the process grant and secret-free marker even when provider revocation fails. */\n  async disconnect(): Promise<{ revoked: boolean }> {', '  /**\n   * Clear the process grant and secret-free marker even when provider revocation fails.\n   * @returns whether Google acknowledged token revocation.\n   */\n  async disconnect(): Promise<{ revoked: boolean }> {')]
          for old, new in fixes:
              if new not in t and old in t: t = t.replace(old, new, 1)
          p.write_text(t)

          p = Path('packages/guard/timeout-policy/src/exec-policy.ts'); t = p.read_text()
          fixes = [
            ("export type ExecPolicyDecision = 'allow' | 'prompt' | 'forbidden'", "/** One monotonic command-policy outcome. */\nexport type ExecPolicyDecision = 'allow' | 'prompt' | 'forbidden'"),
            ('export type ExecPolicyPatternPart = string | readonly string[]', '/** One exact token or accepted alternatives at one prefix position. */\nexport type ExecPolicyPatternPart = string | readonly string[]'),
            ('export interface ExecPolicyRule {', '/** One validated token-prefix rule and its examples. */\nexport interface ExecPolicyRule {'),
            ('export interface ExecPolicyConfig {', '/** Optional exec-policy configuration. */\nexport interface ExecPolicyConfig {'),
            ('export interface CompiledExecPolicy {', '/** Immutable runtime form of a validated exec policy. */\nexport interface CompiledExecPolicy {'),
            ('export interface ExecPolicyEvaluation {', '/** Decision returned for one classified shell command. */\nexport interface ExecPolicyEvaluation {'),
            ('/** Compile and self-test an exec policy before it can affect live tools. */\nexport function compileExecPolicy', '/**\n * Compile and self-test an exec policy before it can affect live tools.\n * @param config - source rules and shell-tool settings.\n * @returns immutable validated runtime policy.\n */\nexport function compileExecPolicy'),
            ('/** Evaluate one shell command without changing the surrounding policy chain. */\nexport function evaluateExecPolicy', '/**\n * Evaluate one shell command without changing the surrounding policy chain.\n * @param command - raw shell command.\n * @param policy - compiled policy to evaluate.\n * @returns the strictest match or undefined.\n */\nexport function evaluateExecPolicy')]
          for old, new in fixes:
              if new not in t and old in t: t = t.replace(old, new, 1)
          p.write_text(t)

          p = Path('packages/sdk/client/src/api.ts'); t = p.read_text()
          fixes = [
            ('  get client(): HarnessClient {', '  /** Current low-level transport client owned by this harness. */\n  get client(): HarnessClient {'),
            ('  /** Whether the current runtime explicitly advertised one v2 lifecycle capability. */\n  supports(capability: keyof HarnessSdkCapabilities): boolean {', '  /**\n   * Query a negotiated v2 lifecycle capability.\n   * @param capability - lifecycle capability to query.\n   * @returns true only when advertised.\n   */\n  supports(capability: keyof HarnessSdkCapabilities): boolean {'),
            ('  session(sessionId?: string): HarnessSession {', '  /**\n   * Create a stable session handle.\n   * @param sessionId - optional stable id.\n   * @returns a session handle sharing this runtime.\n   */\n  session(sessionId?: string): HarnessSession {'),
            ('  run(input: string | ContentBlock[], options?: RunOptions): Promise<RunResult> {', '  /**\n   * Run one turn.\n   * @param input - prompt or content blocks.\n   * @param options - optional run settings.\n   * @returns settled turn result.\n   */\n  run(input: string | ContentBlock[], options?: RunOptions): Promise<RunResult> {'),
            ("  async run(input: string | ContentBlock[], options?: Pick<RunOptions, 'onNotification'>): Promise<RunResult> {", "  /**\n   * Run one turn in this stable session.\n   * @param input - prompt or content blocks.\n   * @param options - optional notification observer.\n   * @returns settled turn result.\n   */\n  async run(input: string | ContentBlock[], options?: Pick<RunOptions, 'onNotification'>): Promise<RunResult> {"),
            ("  /** Cancel this session's current activity without closing the runtime or discarding queued follow-up work. */\n  async interrupt()", "  /**\n   * Cancel this session's current activity without closing the runtime.\n   * @returns whether the session existed and was running.\n   */\n  async interrupt()"),
            ('  /** Dispose this SDK-owned session while preserving the shared PHOENIX runtime for other sessions. */\n  async close()', '  /**\n   * Dispose this SDK-owned session while preserving the shared runtime.\n   * @returns whether a live SDK session was found and closed.\n   */\n  async close()')]
          for old, new in fixes:
              if new not in t and old in t: t = t.replace(old, new, 1)
          if '/** @returns once the shared runtime subprocess is closed. */\n  close(): Promise<void> {' not in t and '  close(): Promise<void> {' in t:
              t = t.replace('  close(): Promise<void> {', '  /** @returns once the shared runtime subprocess is closed. */\n  close(): Promise<void> {', 1)
          p.write_text(t)

          rep('packages/subagent/subagent-codex/src/account.ts', 'export async function readCodexAccountSnapshot(\n', '/**\n * Read one secret-free native Codex account snapshot.\n * @param ctx - PHOENIX service context.\n * @param config - Codex bridge configuration.\n * @param signal - optional cancellation signal.\n * @returns account, quota, usage, and connector metadata without OAuth secrets.\n */\nexport async function readCodexAccountSnapshot(\n')
          rep('packages/subagent/subagent-codex/src/account.ts', 'export function registerCodexAccountFlow(\n', '/**\n * Register native Codex account authorization.\n * @param ctx - PHOENIX service context.\n * @param config - Codex bridge configuration.\n * @returns disposer for the registered flow.\n */\nexport function registerCodexAccountFlow(\n')

          p = Path('packages/client/ui-conversation/src/client/chat/structured-error.ts'); t = p.read_text()
          fixes = [
            ('export interface StructuredErrorField {', '/** One bounded field promoted from a provider error payload. */\nexport interface StructuredErrorField {'),
            ('export interface StructuredErrorPresentation {', '/** Safe user-facing normalization of one structured provider failure. */\nexport interface StructuredErrorPresentation {'),
            ('/** Translate only generic error prose, never identifiers, provider/model names, enum values, IDs or URLs. */\nexport function translateGenericErrorProse(value: string): string {', '/**\n * Translate only generic error prose.\n * @param value - provider prose to normalize.\n * @returns normalized prose with identifiers preserved.\n */\nexport function translateGenericErrorProse(value: string): string {'),
            (' * Arbitrary chat JSON is unaffected because callers use this only on error nodes.\n */\nexport function formatStructuredError(', ' * Arbitrary chat JSON is unaffected because callers use this only on error nodes.\n * @param input - JSON error string.\n * @param explicitCode - optional transport/status code.\n * @returns a bounded presentation model or undefined.\n */\nexport function formatStructuredError(')]
          for old, new in fixes:
              if new not in t and old in t: t = t.replace(old, new, 1)
          p.write_text(t)

          rep('packages/host/apiproxy/src/fetch/client.ts', 'export class InProcessApiClient extends AbstractApiClient {', '/** API client routing fetches directly into an in-process host handler. */\nexport class InProcessApiClient extends AbstractApiClient {')
          rep('docs/subsystems/sandbox.md', '  /** Explicit approved mode override, which outranks session policy. */', '  /** Explicit approved mode override, which outranks session policy but not HARDNESS runtime protection. */')

          p = Path('packages/sandbox/sandbox-policy/README.md'); t = p.read_text()
          paragraph = "One `sandbox:policy` contribution in the current runtime-context snapshot for every agent session. It does not enumerate mounted capabilities. Tool plugins retain operation and escalation guidance, approval policy contributes separately to the same snapshot, and plan guidance remains `dsh-plan-mode`'s system section. With launcher HARDNESS protection active, the same contribution states that the live PHOENIX runtime and data home are protected and directs self-modification to the isolated evolution worktree.\n\n"
          marker = '### Current file sandbox policy\n\n#### What the model sees\n\n' + paragraph
          if marker in t: t = t.replace(marker, '### Current file sandbox policy\n\n' + paragraph + '#### What the model sees\n\n', 1)
          p.write_text(t)

          for dead in ['scripts/plan-phoenix-scope-migration.ts', 'scripts/promote-client-artifacts.ts']:
              Path(dead).unlink(missing_ok=True)
          PY
      - name: Regenerate repository-owned artifacts
        run: |
          pnpm run gen-client-catalog
          pnpm run gen-config-catalog
          pnpm run gen-doc-graphs
          pnpm run gen-module-graph
          pnpm run gen-cordis-catalog
      - name: Refresh affected translation pair records
        run: |
          pnpm run verify-translation-pairing --write \
            .agents/notes/implemented/process/2026-08-24-phoenix-package-scope-migration.md \
            docs/codex-plugin-arsenal.md \
            docs/config-catalog.md \
            docs/event-producer-consumer.md \
            docs/module-graph.md \
            packages/credentials/authorization/README.md
      - run: git diff --check
      - name: Commit deterministic repair
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[pr58-autofix] repair authorization and release contracts'
          git push origin HEAD:feat/codex-graft-full
