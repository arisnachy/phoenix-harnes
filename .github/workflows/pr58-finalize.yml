name: PR58 final merge and validation closure

on:
  push:
    branches:
      - feat/codex-graft-full

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/codex-graft-full
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Merge current main without discarding either side
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts to resolve deterministically:\n%s\n' "${conflicts[*]}"
            for path in "${conflicts[@]}"; do
              case "$path" in
                packages/credentials/authorization/src/google-broker.ts|packages/credentials/authorization/README.md)
                  # #58 owns functional connector telemetry + provider disconnect and its contract documentation.
                  git checkout --ours -- "$path"
                  ;;
                docs/config-catalog.i18n.yaml|docs/config-catalog.md|docs/config-catalog.zh.md|docs/subsystems/sandbox.i18n.yaml|docs/subsystems/sandbox.md|docs/subsystems/sandbox.zh.md|packages/client/ui-conversation/src/client/chat/structured-error.ts|packages/extensions/cordis-client-runner/src/client/slot-catalog.ts|packages/extensions/tool-cordis/src/api-catalog.ts|tsconfig.base.json)
                  # main is newer here; generated surfaces are regenerated below.
                  git checkout --theirs -- "$path"
                  ;;
                *)
                  echo "Unplanned merge conflict: $path" >&2
                  exit 1
                  ;;
              esac
              git add -- "$path"
            done
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

      - name: Regenerate canonical repository-owned surfaces
        run: |
          pnpm run gen-client-catalog
          pnpm run gen-cordis-api
          pnpm run gen-config-catalog
          pnpm run gen-doc-graphs
          pnpm run gen-module-graph
          pnpm run gen-cordis-catalog

      - name: Synchronize paired generated technical structures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Reciprocal language switcher required by the pairing contract.
          p = Path('docs/codex-plugin-arsenal.md')
          text = p.read_text()
          switcher = 'English | [中文](codex-plugin-arsenal.zh.md)'
          if switcher not in text:
              lines = text.splitlines()
              if not lines or not lines[0].startswith('# '):
                  raise SystemExit('codex-plugin-arsenal.md has no H1')
              lines[1:1] = ['', switcher]
              p.write_text('\n'.join(lines) + ('\n' if text.endswith('\n') else ''))

          # Config catalog code is generated technical contract. Preserve Chinese
          # prose, but keep each generated TS fence byte-identical to English.
          en_path = Path('docs/config-catalog.md')
          zh_path = Path('docs/config-catalog.zh.md')
          en = en_path.read_text()
          zh = zh_path.read_text()
          fence = re.compile(r'```ts config-catalog\n.*?\n```', re.S)
          en_blocks = fence.findall(en)
          zh_blocks = fence.findall(zh)
          if len(en_blocks) != len(zh_blocks):
              raise SystemExit(f'config-catalog fence count differs after main merge: EN={len(en_blocks)} ZH={len(zh_blocks)}')
          iterator = iter(en_blocks)
          zh = fence.sub(lambda _: next(iterator), zh)
          zh_path.write_text(zh)

          # Module graph graph/table are generated technical data, not prose.
          en_path = Path('docs/module-graph.md')
          zh_path = Path('docs/module-graph.zh.md')
          en = en_path.read_text()
          zh = zh_path.read_text()
          mermaid = re.compile(r'```mermaid\n.*?\n```', re.S)
          en_graph = mermaid.search(en)
          zh_graph = mermaid.search(zh)
          if not en_graph or not zh_graph:
              raise SystemExit('module graph mermaid block missing')
          zh = zh[:zh_graph.start()] + en_graph.group(0) + zh[zh_graph.end():]

          def table_span(text: str):
              lines = text.splitlines(keepends=True)
              start = next((i for i, line in enumerate(lines) if line.startswith('| Package | Group | Depends on |')), None)
              if start is None:
                  raise SystemExit('module graph technical table header missing')
              end = start
              while end < len(lines) and lines[end].startswith('|'):
                  end += 1
              return lines, start, end

          en_lines, es, ee = table_span(en)
          zh_lines, zs, ze = table_span(zh)
          zh_lines[zs:ze] = en_lines[es:ee]
          zh_path.write_text(''.join(zh_lines))
          PY

      - name: Refresh translation pairing records
        run: |
          pnpm run verify-translation-pairing --write \
            .agents/notes/implemented/process/2026-08-24-phoenix-package-scope-migration.md \
            docs/codex-plugin-arsenal.md \
            docs/config-catalog.md \
            docs/event-producer-consumer.md \
            docs/module-graph.md \
            docs/subsystems/credentials.md \
            docs/subsystems/sandbox.md \
            docs/subsystems/subprocess.md \
            packages/credentials/authorization/README.md \
            packages/sandbox/sandbox-policy/README.md
          pnpm run verify-translation-pairing

      - name: Remove finalizer before validating final tree
        run: rm .github/workflows/pr58-finalize.yml

      - name: Verify exact final tree
        run: |
          git diff --check
          pnpm run check:ci:static
          pnpm run typecheck
          pnpm exec vitest run \
            packages/host/apiproxy/tests/api-proxy-authorization.spec.ts \
            packages/host/apiproxy/tests/client-handler.spec.ts \
            packages/host/apiproxy/tests/fetch-carrier.spec.ts \
            packages/client/ui-settings-models/tests/authorization-panel.client.spec.tsx
          pnpm run build

      - name: Commit validated merge closure
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git status --short
          git commit -m 'fix(pr58): finalize authorization and release gates'
          git push origin HEAD:feat/codex-graft-full
