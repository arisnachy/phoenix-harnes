name: PR58 final merge and validation closure

on:
  push:
    branches:
      - feat/codex-graft-full

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/codex-graft-full
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Merge current main without discarding either side
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts to resolve deterministically:\n%s\n' "${conflicts[*]}"
            for path in "${conflicts[@]}"; do
              case "$path" in
                packages/credentials/authorization/src/google-broker.ts|packages/credentials/authorization/README.md)
                  git checkout --ours -- "$path"
                  ;;
                docs/config-catalog.i18n.yaml|docs/config-catalog.md|docs/config-catalog.zh.md|docs/subsystems/sandbox.i18n.yaml|docs/subsystems/sandbox.md|docs/subsystems/sandbox.zh.md|packages/client/ui-conversation/src/client/chat/structured-error.ts|packages/extensions/cordis-client-runner/src/client/slot-catalog.ts|packages/extensions/tool-cordis/src/api-catalog.ts|tsconfig.base.json)
                  git checkout --theirs -- "$path"
                  ;;
                *)
                  echo "Unplanned merge conflict: $path" >&2
                  exit 1
                  ;;
              esac
              git add -- "$path"
            done
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

      - name: Repair merged workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Regenerate canonical repository-owned surfaces
        run: |
          pnpm run gen-client-catalog
          pnpm run gen-cordis-api
          pnpm run gen-config-catalog
          pnpm run gen-doc-graphs
          pnpm run gen-module-graph
          pnpm run gen-cordis-catalog

      - name: Close authored fallback documentation pairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def add_switcher(path: Path, zh_name: str) -> None:
              text = path.read_text()
              switcher = f'English | [中文]({zh_name})'
              if switcher in text:
                  return
              lines = text.splitlines()
              if not lines or not lines[0].startswith('# '):
                  raise SystemExit(f'{path}: missing H1')
              lines[1:1] = ['', switcher]
              path.write_text('\n'.join(lines) + ('\n' if text.endswith('\n') else ''))

          plan = Path('docs/superpowers/plans/2026-08-26-web-search-free-fallback.md')
          add_switcher(plan, '2026-08-26-web-search-free-fallback.zh.md')
          Path('docs/superpowers/plans/2026-08-26-web-search-free-fallback.zh.md').write_text(r'''# 免费网页搜索回退 — Implementation Plan

[English](2026-08-26-web-search-free-fallback.md) | 中文

> **面向智能体工作者：** 必须使用相应的子技能：推荐 superpowers:subagent-driven-development，或使用 superpowers:executing-plans，按任务逐项执行本计划。步骤使用复选框（`- [ ]`）语法跟踪。

**Goal:** 当主要网页提供商因额度、配额或可用性失败时，让 PHOENIX 继续通过 Chrome/Bing/DuckDuckGo 进行研究。

**Architecture:** 保持 `ctx.web` 负责选择，并增加显式回退策略，为浏览器和免费 HTTP 使用独立提供商。在 web 层分类可恢复错误，保留规范化词汇，并避免任何秘密进入错误或追踪。

**Tech Stack:** TypeScript ESM、Cordis、Vitest、专用 Playwright/Chrome、fetch 和 HTML fixture。

