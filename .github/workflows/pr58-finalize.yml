          spec = Path('docs/superpowers/specs/2026-08-26-web-search-free-fallback-design.md')
          add_switcher(spec, '2026-08-26-web-search-free-fallback-design.zh.md')
          Path('docs/superpowers/specs/2026-08-26-web-search-free-fallback-design.zh.md').write_text(r'''# 免费网页研究回退

[English](2026-08-26-web-search-free-fallback-design.md) | 中文

## 目标

避免主要提供商的额度、配额、认证、限制或可用性故障终止研究。PHOENIX 应尝试通过专用浏览器走可验证的免费路线；如果不可用，则尝试免费的 HTTP 路线。

## 范围

仅修改网页搜索能力。不修改身份、凭据、核心 prompt、全局 sandbox 或付费提供商。主要提供商可用时仍保持最高优先级。

## 设计

`ctx.web.search()` 将使用显式回退策略。它先执行已配置提供商。可恢复错误会在不暴露秘密的前提下分类：配额/额度、401/403、429、超时、提供商不可用和瞬态故障。遇到这些错误时，先尝试专用浏览器提供商，再尝试免费 HTTP 提供商。验证错误、显式取消或模糊配置不会静默回退。

浏览器提供商使用与个人配置文件隔离的 Chrome 会话，访问已配置的免费搜索引擎，提取标题/URL/snippet，并返回 `dsh-web` 的规范化词汇。每次尝试都有超时、结果限制和保证清理。如果 Chrome 未安装或无法启动，该错误会转换为可恢复的不可用状态并继续回退链。

免费 HTTP 路线是最后手段，必须容忍不完整 HTML、反机器人页面、重定向和无结果。Bing 作为初始搜索引擎；DuckDuckGo 作为替代。来源按 URL 去重，绝不伪造引用。

最终响应保留来源，并增加所使用提供商和已尝试路线的不敏感元数据用于诊断。错误消息不包含密钥、token、header 或带凭据的 URL。

## 验收标准

- 主要提供商的模拟额度错误会到达 Chrome/HTTP 并返回来源。
- 401、429 和超时会触发回退；用户取消不会触发回退。
- Chrome 使用专用配置文件，并在完成或失败时关闭。
- Bing 和 DuckDuckGo 按可配置顺序测试，并在获得有效结果时停止。
- 重复来源被删除，并遵守 `maxResults`。
- 所有路线均不可用时，返回包含已尝试路线且不含秘密的结构化错误。
- 测试使用 fixtures 保持确定性；独立 smoke 在 Chrome 可用时验证真实导航。

## 晋升

实现先集成到 `main`，执行聚焦测试、typecheck、build 和相关 gates。只有全部绿色才创建/晋升 `stable`；存在失败或未审查变更时，不进行 push 或晋升。
''')
          PY

      - name: Synchronize paired generated technical structures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/codex-plugin-arsenal.md')
          text = p.read_text()
          switcher = 'English | [中文](codex-plugin-arsenal.zh.md)'
          if switcher not in text:
              lines = text.splitlines()
              if not lines or not lines[0].startswith('# '):
                  raise SystemExit('codex-plugin-arsenal.md has no H1')
              lines[1:1] = ['', switcher]
              p.write_text('\n'.join(lines) + ('\n' if text.endswith('\n') else ''))

          en_path = Path('docs/config-catalog.md')
          zh_path = Path('docs/config-catalog.zh.md')
          en = en_path.read_text()
          zh = zh_path.read_text()
          timeout_anchor = '<a id="deepseek-aidsh-tool-call-timeout-policy"></a>'
          next_anchor = '<a id="deepseek-aidsh-tool-fs"></a>'
          if timeout_anchor in en and timeout_anchor not in zh:
              start = en.index(timeout_anchor)
              end = en.index(next_anchor, start)
              section = en[start:end]
              section = section.replace('\nRequires: `tools`\n', '\n需要：`tools`\n', 1)
              section = section.replace('\nSource: [', '\n来源：[', 1)
              if next_anchor not in zh:
                  raise SystemExit('config-catalog Chinese insertion anchor missing')
              zh = zh.replace(next_anchor, section + next_anchor, 1)
              zh = re.sub(r'^- `@deepseek-ai/dsh-tool-call-timeout-policy`[^\n]*\n', '', zh, count=1, flags=re.M)

          fence = re.compile(r'```ts config-catalog\n.*?\n```', re.S)
          en_blocks = fence.findall(en)
          zh_blocks = fence.findall(zh)
          if len(en_blocks) != len(zh_blocks):
              raise SystemExit(f'config-catalog fence count differs after synchronization: EN={len(en_blocks)} ZH={len(zh_blocks)}')
          iterator = iter(en_blocks)
          zh = fence.sub(lambda _: next(iterator), zh)
          zh_path.write_text(zh)

          en_path = Path('docs/module-graph.md')
          zh_path = Path('docs/module-graph.zh.md')
          en = en_path.read_text()
          zh = zh_path.read_text()
          mermaid = re.compile(r'```mermaid\n.*?\n```', re.S)
          en_graph = mermaid.search(en)
          zh_graph = mermaid.search(zh)
          if not en_graph or not zh_graph:
              raise SystemExit('module graph mermaid block missing')
          zh = zh[:zh_graph.start()] + en_graph.group(0) + zh[zh_graph.end():]

          def table_span(text: str):
              lines = text.splitlines(keepends=True)
              start = next((i for i, line in enumerate(lines) if line.startswith('| Package | Group | Depends on |')), None)
              if start is None:
                  raise SystemExit('module graph technical table header missing')
              end = start
              while end < len(lines) and lines[end].startswith('|'):
                  end += 1
              return lines, start, end

          en_lines, es, ee = table_span(en)
          zh_lines, zs, ze = table_span(zh)
          zh_lines[zs:ze] = en_lines[es:ee]
          zh_path.write_text(''.join(zh_lines))
          PY

