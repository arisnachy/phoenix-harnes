name: PR58 integrate current main

on:
  push:
    branches:
      - feat/codex-graft-full

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/codex-graft-full
          fetch-depth: 0
      - name: Integrate current main and remove temporary finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts to resolve deterministically:\n%s\n' "${conflicts[*]}"
            for path in "${conflicts[@]}"; do
              case "$path" in
                packages/credentials/authorization/src/google-broker.ts|packages/credentials/authorization/README.md|docs/codex-plugin-arsenal.zh.md)
                  git checkout --ours -- "$path"
                  ;;
                .agents/notes/implemented/process/2026-08-24-phoenix-package-scope-migration.i18n.yaml|.agents/notes/implemented/process/2026-08-24-phoenix-package-scope-migration.md|.agents/notes/implemented/process/2026-08-24-phoenix-package-scope-migration.zh.md|docs/codex-plugin-arsenal.i18n.yaml|docs/config-catalog.i18n.yaml|docs/config-catalog.md|docs/config-catalog.zh.md|docs/event-producer-consumer.i18n.yaml|docs/module-graph.i18n.yaml|docs/subsystems/sandbox.i18n.yaml|docs/subsystems/sandbox.md|docs/subsystems/sandbox.zh.md|docs/superpowers/plans/2026-08-26-web-search-free-fallback.zh.md|docs/superpowers/specs/2026-08-26-web-search-free-fallback-design.zh.md|packages/client/ui-conversation/src/client/chat/structured-error.ts|packages/credentials/authorization/README.i18n.yaml|packages/extensions/cordis-client-runner/src/client/slot-catalog.ts|packages/extensions/tool-cordis/src/api-catalog.ts|tsconfig.base.json)
                  git checkout --theirs -- "$path"
                  ;;
                *)
                  echo "Unplanned merge conflict: $path" >&2
                  exit 1
                  ;;
              esac
              git add -- "$path"
            done
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          git rm .github/workflows/pr58-finalize.yml
          git add -A
          git commit -m 'chore(pr58): integrate current main before merge'
          git push origin HEAD:feat/codex-graft-full
