name: E2E (real DeepSeek API)

# Credential-bound external integration suite. This downstream does not assume
# the upstream repository's DeepSeek secret exists. Real API execution is an
# explicit repository opt-in: set DSH_REAL_API_E2E_ENABLED=1 and configure
# DEEPSEEK_API_KEY_EXTERNAL. When enabled, preflight remains fail-closed so a
# missing key cannot turn the self-skipping suite into a false green.
#
# SECURITY — NEVER change this trigger to `pull_request_target`. `pull_request`
# keeps repository secrets away from fork/Dependabot code.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '17 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  configuration:
    runs-on: ubuntu-latest
    name: real API E2E configuration
    steps:
      - name: Report downstream E2E mode
        env:
          ENABLED: ${{ vars.DSH_REAL_API_E2E_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${ENABLED:-}" = "1" ]; then
            echo "::notice::Real DeepSeek API E2E is enabled. The execution job will require DEEPSEEK_API_KEY_EXTERNAL and fail closed if it is missing."
          else
            echo "::notice::Real DeepSeek API E2E is disabled for this downstream. Set DSH_REAL_API_E2E_ENABLED=1 and configure DEEPSEEK_API_KEY_EXTERNAL to enable the credential-bound suite."
          fi

  e2e:
    needs: configuration
    runs-on: ubuntu-latest
    name: e2e
    # External API execution is opt-in and never receives secrets for untrusted
    # PR code. Disabled mode is reported by the configuration job above rather
    # than failing because an upstream-only secret is absent.
    if: >-
      vars.DSH_REAL_API_E2E_ENABLED == '1'
      && (
        github.event_name != 'pull_request'
        || !(github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]')
      )
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Preflight (require DEEPSEEK_API_KEY)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::DSH_REAL_API_E2E_ENABLED=1 but DEEPSEEK_API_KEY_EXTERNAL is missing or empty."
            echo "::error::Refusing to run a self-skipping external suite as a false green."
            exit 1
          fi
          echo "DEEPSEEK_API_KEY present."

      - name: Build (lib for the e2e example bins)
        run: pnpm run build:official

      - name: E2E tests (real DeepSeek API)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DSH_E2E_MAX_WORKERS: 14
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e
