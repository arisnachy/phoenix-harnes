name: Targeted Model Surfaces

on:
  push:
    branches:
      - fix/model-surfaces-optional-plugininventory

permissions:
  contents: read

jobs:
  model-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Run model surface suites
        run: pnpm exec vitest run packages/client/ui-settings-models/tests/apply.client.spec.ts packages/client/ui-settings-models/tests/optional-plugin-inventory.client.spec.ts packages/client/ui-model-selection/tests/browser-plugin.client.spec.ts
