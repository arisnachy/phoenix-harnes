name: Temporary backport Cordis to stable branch

on:
  push:
    branches:
      - backport/cordis-visual-workspace-stable-20260913

permissions:
  contents: write

jobs:
  backport:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: backport/cordis-visual-workspace-stable-20260913
          fetch-depth: 0
          persist-credentials: true
      - run: |
          git fetch origin e7bc5008a7a57fc69eaaa7dcc8533651638fcbb2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick e7bc5008a7a57fc69eaaa7dcc8533651638fcbb2
          git push origin HEAD:backport/cordis-visual-workspace-stable-20260913
