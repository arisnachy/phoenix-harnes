name: Targeted UI Settings Models

on:
  push:
    branches:
      - fix/ui-settings-models-plugininventory-inject

permissions:
  contents: read

jobs:
  ui-settings-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Run focused loader regression
        run: pnpm exec vitest run packages/client/ui-settings-models/tests/apply.client.spec.ts packages/client/ui-settings-models/tests/plugin-inventory-inject.client.spec.ts
