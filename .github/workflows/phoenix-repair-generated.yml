name: PHOENIX repair generated state

on:
  push:
    branches:
      - phoenix/full-reforge-20260824

permissions:
  contents: write

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[run-repair-generated]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Apply deterministic PHOENIX repairs
        run: python scripts/phoenix-repair-generated-state.py
      - name: Regenerate source-owned catalogs
        run: |
          pnpm run gen-cordis-catalog
          pnpm run gen-client-catalog
          pnpm run gen-config-catalog
          pnpm run gen-module-graph
          pnpm run gen-doc-graphs
      - name: Synchronize generated Chinese counterparts
        run: python scripts/phoenix-repair-generated-i18n.py
      - name: Re-record reviewed bilingual pairs
        run: |
          pnpm run verify-translation-pairing --write packages/sandbox/sandbox-policy/README.md
          pnpm run verify-translation-pairing --write .agents/notes/implemented/process/2026-08-24-phoenix-package-scope-migration.md
          pnpm run verify-translation-pairing --write docs/codex-plugin-arsenal.md
          pnpm run verify-translation-pairing --write docs/subsystems/sandbox.md
          pnpm run verify-translation-pairing --write docs/config-catalog.md
          pnpm run verify-translation-pairing --write docs/event-producer-consumer.md
          pnpm run verify-translation-pairing --write docs/module-graph.md
      - name: Remove one-shot helper scripts
        run: rm scripts/phoenix-repair-generated-state.py scripts/phoenix-repair-generated-i18n.py
      - name: Verify repaired static gates
        run: |
          pnpm run verify-type-equiv
          pnpm run verify-cordis-catalog
          pnpm run verify-client-catalog
          pnpm run verify-config-catalog
          pnpm run verify-agent-note-format
          pnpm run verify-package-readme-model-experience
          pnpm run verify-module-graph
          pnpm run verify-translation-pairing
          pnpm run knip
          pnpm run phoenix:scope:check
      - name: Commit generated repair
        run: |
          git config user.name 'PHOENIX CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repair changes remained to commit.'
            exit 0
          fi
          git commit -m 'fix(ci): repair generated catalogs, i18n and static gates'
          git push origin HEAD:phoenix/full-reforge-20260824
