name: PHOENIX ESPN Core betting intelligence
on:
  pull_request:
    paths:
      - 'packages/core/tool-sports/src/espn-core-intelligence.ts'
      - 'packages/core/tool-sports/src/index.ts'
      - 'packages/core/tool-sports/src/espn-odds.ts'
      - 'packages/core/tool-sports/tests/espn-core-intelligence.test.mjs'
      - '.github/workflows/phoenix-espn-core-intelligence.yml'
  push:
    branches: [main,stable]
    paths:
      - 'packages/core/tool-sports/src/espn-core-intelligence.ts'
      - 'packages/core/tool-sports/tests/espn-core-intelligence.test.mjs'
      - '.github/workflows/phoenix-espn-core-intelligence.yml'
permissions:
  contents: read
jobs:
  espn-core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate ESPN routes, provider references and safe error behavior
        run: node --experimental-strip-types --test packages/core/tool-sports/tests/espn-core-intelligence.test.mjs
      - name: Strict host build
        run: pnpm run build:lib:host
