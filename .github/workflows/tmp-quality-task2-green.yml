name: Temporary quality task2 GREEN

on:
  push:
    branches:
      - feat/quality-foresight-completion-20260915
    paths:
      - .github/workflows/tmp-quality-task2-green.yml

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec vitest run packages/quality/quality-session/tests/quality-session.spec.ts
      - run: pnpm exec tsc -p packages/quality/quality/tsconfig.json --noEmit
      - run: pnpm exec tsc -p packages/quality/quality-session/tsconfig.json --noEmit
