name: Temporary KIRA Team generated-output refresh

on:
  push:
    branches: [feat/kira-live-team-chat-20260930]

permissions:
  contents: write

concurrency:
  group: tmp-kira-team-regenerate
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kira-live-team-chat-20260930
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Refresh renamed Team snapshot references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("examples/headless-agent/team.cordis.snapshot.yml")
          s = p.read_text()
          s = s.replace("@phoenix-ai/dsh-experimental-agent-team", "@phoenix-ai/dsh-agent-team")
          s = s.replace("@phoenix-ai/dsh-experimental-tool-agent-team", "@phoenix-ai/dsh-tool-agent-team")
          p.write_text(s)
          PY

      - name: Regenerate repository-owned outputs
        shell: bash
        run: |
          set -euo pipefail
          pnpm run gen-cordis-catalog
          pnpm run gen-client-catalog
          pnpm run gen-tool-catalog
          pnpm run gen-config-catalog
          pnpm run gen-persistence-catalog
          pnpm run gen-doc-graphs
          pnpm run gen-module-graph
          pnpm exec tsx scripts/verify-translation-pairing.ts --write docs/persistence-catalog.md docs/subsystems/agent-team.md

      - name: Commit generated outputs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Generated outputs already synchronized."
            exit 0
          fi
          git config user.name "phoenix-ci-bot"
          git config user.email "phoenix-ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(team): regenerate catalogs after stable promotion"
          git push origin HEAD:feat/kira-live-team-chat-20260930
