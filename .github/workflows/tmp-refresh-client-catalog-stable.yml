name: Temporary refresh stable client catalog

on:
  push:
    branches:
      - backport/cordis-visual-workspace-stable-20260913

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: backport/cordis-visual-workspace-stable-20260913
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run gen-client-catalog
      - name: Commit regenerated catalog
        run: |
          if git diff --quiet -- packages/extensions/cordis-client-runner/src/client/slot-catalog.ts; then
            echo "Client catalog already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/extensions/cordis-client-runner/src/client/slot-catalog.ts
          git commit -m "chore(catalog): regenerate stable client catalog"
          git push origin HEAD:backport/cordis-visual-workspace-stable-20260913
