name: PHOENIX static repair generator

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/global-static-gates-20260913'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Apply deterministic static repairs
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, content):
              Path(path).write_text(content)

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          def load_json(path):
              return json.loads(read(path))

          def save_json(path, value):
              write(path, json.dumps(value, indent=2, ensure_ascii=False) + '\n')

          sdk_path = 'python/sdk-runtime/package.json'
          sdk = load_json(sdk_path)
          sdk['dependencies']['@phoenix-ai/dsh-hardness-adapters'] = 'workspace:^'
          sdk['dependencies']['@phoenix-ai/dsh-tool-session-learning'] = 'workspace:^'
          save_json(sdk_path, sdk)

          conversation_path = 'packages/client/ui-conversation/package.json'
          conversation = load_json(conversation_path)
          for section in ('peerDependencies', 'devDependencies'):
              deps = conversation.setdefault(section, {})
              deps['@phoenix-ai/dsh-session'] = 'workspace:^'
              deps['@phoenix-ai/dsh-user-approval'] = 'workspace:^'
          save_json(conversation_path, conversation)

          headless_path = 'packages/bundle/headless/package.json'
          headless = load_json(headless_path)
          headless.get('dependencies', {}).pop('@phoenix-ai/dsh-code-runtime-python', None)
          save_json(headless_path, headless)

          knip_path = 'knip.json'
          knip = load_json(knip_path)
          binaries = knip.setdefault('ignoreBinaries', [])
          if 'codex' not in binaries:
              binaries.append('codex')
              binaries.sort()
          workspaces = knip.get('workspaces', {})
          if isinstance(workspaces.get('examples'), dict):
              workspaces['examples'].pop('ignoreDependencies', None)
          if isinstance(workspaces.get('packages/bundle/base'), dict):
              workspaces['packages/bundle/base'].pop('ignoreDependencies', None)
          save_json(knip_path, knip)

          replace_once(
              'packages/goal/goal-round-driver/src/index.ts',
              '/** Provider quota cannot be repaired by another automatic goal round. */\nexport function isTerminalGoalQuota(error: unknown): boolean {',
              '''/**\n * Provider quota cannot be repaired by another automatic goal round.\n * @param error - Unknown provider or harness error to classify.\n * @returns Whether the error represents a terminal provider quota condition.\n */\nexport function isTerminalGoalQuota(error: unknown): boolean {''',
          )

          replace_once(
              'packages/mcp/chrome-connector/src/server.ts',
              "/** Build Chrome/Edge flags for PHOENIX's isolated CDP browser. */\nexport function buildDedicatedBrowserArgs(profileDir: string, headless = false): string[] {",
              '''/**\n * Build Chrome/Edge flags for PHOENIX's isolated CDP browser.\n * @param profileDir - Dedicated browser profile directory.\n * @param headless - Whether to launch Chromium in headless mode.\n * @returns Browser argv for the isolated PHOENIX CDP session.\n */\nexport function buildDedicatedBrowserArgs(profileDir: string, headless = false): string[] {''',
          )

          replace_once(
              'packages/mcp/mcp-client/src/connection.ts',
              ' * @param lifecycle - Optional model-safe state publisher for the connector registry.\n * @returns Handle with a `ready` promise for startup-await and a `dispose` for teardown.',
              ' * @param lifecycle - Optional model-safe state publisher for the connector registry.\n * @param transportOptions - Optional transport-specific configuration such as OAuth.\n * @returns Handle with a `ready` promise for startup-await and a `dispose` for teardown.',
          )

          oauth = 'packages/mcp/mcp-client/src/oauth.ts'
          replace_once(oauth,
              '''/**\n * Build the SDK OAuth provider for one MCP server. Token and registration data\n * are read and written only through the supplied host-owned store.\n */''',
              '''/**\n * Build the SDK OAuth provider for one MCP server. Token and registration data\n * are read and written only through the supplied host-owned store.\n * @param options - Server identity, callback URL, persistence, and redirect callback.\n * @returns SDK OAuth provider backed by the supplied host-owned state store.\n */''')
          replace_once(oauth,
              '/** Credential-provider adapter that stores only an opaque MCP OAuth grant. */\nexport function createCredentialStateStore(credentials: CredentialProvider, key: CredentialKey): McpOAuthStateStore {',
              '''/**\n * Create a credential-provider adapter that stores only an opaque MCP OAuth grant.\n * @param credentials - Host credential provider that owns persistent grant records.\n * @param key - Credential key scoped to one MCP server.\n * @returns OAuth state store backed by the host credential provider.\n */\nexport function createCredentialStateStore(credentials: CredentialProvider, key: CredentialKey): McpOAuthStateStore {''')
          replace_once(oauth,
              '  get redirectUri(): string {',
              '''  /** @returns Bound loopback OAuth redirect URI after startup. */\n  get redirectUri(): string {''')
          replace_once(oauth,
              '  async start(): Promise<void> {',
              '''  /** @returns Promise that resolves when the loopback callback server is listening. */\n  async start(): Promise<void> {''')
          replace_once(oauth,
              '  begin(expectedState: string, signal?: AbortSignal): McpOAuthCallbackAttempt {',
              '''  /**\n   * Begin one OAuth callback attempt.\n   * @param expectedState - CSRF state value that must match the callback.\n   * @param signal - Optional abort signal for cancelling the attempt.\n   * @returns Pending callback attempt containing the authorization-code promise.\n   */\n  begin(expectedState: string, signal?: AbortSignal): McpOAuthCallbackAttempt {''')
          replace_once(oauth,
              '  async close(): Promise<void> {',
              '''  /** @returns Promise that resolves after the callback server closes. */\n  async close(): Promise<void> {''')
          replace_once(oauth,
              '/** Whether a stored state contains a token that the SDK can use or refresh. */\nexport function hasUsableMcpOAuthTokens(state: McpOAuthState | undefined): boolean {',
              '''/**\n * Whether a stored state contains a token that the SDK can use or refresh.\n * @param state - Persisted or volatile OAuth state to inspect.\n * @returns Whether an access or refresh token is available.\n */\nexport function hasUsableMcpOAuthTokens(state: McpOAuthState | undefined): boolean {''')
          replace_once(oauth,
              '''export class McpOAuthController {\n  readonly key: CredentialKey\n  readonly callbackServer: McpOAuthCallbackServer\n  readonly ready: Promise<void>''',
              '''export class McpOAuthController {\n  /** Credential key that scopes this MCP server's OAuth grant. */\n  readonly key: CredentialKey\n  /** Loopback server that receives this MCP server's OAuth callback. */\n  readonly callbackServer: McpOAuthCallbackServer\n  /** Resolves when the callback server is ready to accept authorization. */\n  readonly ready: Promise<void>''')
          replace_once(oauth,
              '  async isAuthorized(): Promise<boolean> {',
              '''  /** @returns Whether this MCP server currently has usable OAuth tokens. */\n  async isAuthorized(): Promise<boolean> {''')
          replace_once(oauth,
              '  provider(onAuthorizationUrl: (url: URL) => void | Promise<void> = () => undefined): OAuthClientProvider {',
              '''  /**\n   * Build an SDK OAuth provider for this controller.\n   * @param onAuthorizationUrl - Callback invoked with the user authorization URL.\n   * @returns OAuth provider bound to this controller's server and state store.\n   */\n  provider(onAuthorizationUrl: (url: URL) => void | Promise<void> = () => undefined): OAuthClientProvider {''')
          replace_once(oauth,
              '  async authorize(session: AuthorizationSession): Promise<void> {',
              '''  /**\n   * Run one interactive OAuth authorization flow.\n   * @param session - Host authorization session used for user notifications and cancellation.\n   * @returns Promise that resolves after authorization succeeds.\n   */\n  async authorize(session: AuthorizationSession): Promise<void> {''')
          replace_once(oauth,
              '  async disconnect(): Promise<void> {',
              '''  /** @returns Promise that resolves after stored authorization is cleared. */\n  async disconnect(): Promise<void> {''')
          # Replace the controller close, not the callback-server close already documented above.
          text = read(oauth)
          marker = '  async disconnect(): Promise<void> {'
          pos = text.index(marker)
          close_pos = text.index('  async close(): Promise<void> {', pos)
          text = text[:close_pos] + '  /** @returns Promise that resolves after the OAuth callback server closes. */\n' + text[close_pos:]
          write(oauth, text)

          replace_once(
              'packages/mcp/mcp-client/src/transport.ts',
              '''export function createTransport(config: Config, options: TransportOptions = {}): Transport {''',
              '''/**\n * Create the configured MCP transport.\n * @param config - Resolved MCP transport configuration.\n * @param options - Optional transport additions such as an OAuth provider.\n * @returns Stdio or Streamable HTTP transport matching the configuration.\n */\nexport function createTransport(config: Config, options: TransportOptions = {}): Transport {''',
          )
          PY
      - name: Refresh lockfile and generated catalogs
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run prepare:change
      - name: Commit generated repair
        run: |
          if git diff --quiet; then
            echo 'No generated repair changes.'
            exit 0
          fi
          git config user.name 'phoenix-ci-repair'
          git config user.email '127772990+arisnachy@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): regenerate static contracts'
          git push origin HEAD:${{ github.head_ref }}
