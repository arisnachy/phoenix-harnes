# PHOENIX HARDNESS product overlay. Loaded after the selected profile and before
# user-supplied Codex MCP patches. Generic web_search belongs to the harness and
# uses the built-in keyless SearXNG provider regardless of which LLM is active.

- id: web
  config:
    searchProvider: searxng
    searxngBaseURL: !!js process.env.PHOENIX_SEARXNG_URL ?? 'http://127.0.0.1:8888'
