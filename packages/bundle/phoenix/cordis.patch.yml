# PHOENIX profile layer. Apply after the standard dsh-base bundle.
# It adds PHOENIX policy/intelligence while keeping the DSH capability seams.
#
# The base bundle already mounts @deepseek-ai/dsh-llm-pi-ai dormant. PHOENIX
# activates only the verified OrcaRouter free route here. Ollama remains
# operator/discovery-configured because PHOENIX must never invent a local model
# id that may not be installed.

- id: llm-pi-ai
  config:
    providers:
      orcarouter:
        displayName: OrcaRouter Free
        apiKeyEnv: ORCAROUTER_API_KEY
        api: openai-completions
        baseURL: https://api.orcarouter.ai/v1
        compat:
          thinkingFormat: deepseek
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: orcarouter/free
            name: OrcaRouter Free
            contextWindow: 1048576
            # Deliberately conservative PHOENIX cap; upstream can expose more.
            maxTokens: 32768
            reasoningEfforts:
              off:
              high: high

- insert:
    - id: phoenix-ai-bus
      name: '@deepseek-ai/dsh-phoenix-ai-bus'
      config:
        localProvider: ollama
        remoteFreeProvider: orcarouter

    - id: phoenix-runtime
      name: '@deepseek-ai/dsh-phoenix-runtime'
      config:
        routing: true
        failover: true
        agentRoi: true
        localEvolution: true
        maxFailoversPerStep: 2

    # Official Codex app-server bridge. Registration alone grants no authority;
    # PHOENIX routing/ROI and the existing subagent tool remain the gate.
    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'

    # Official Claude Code Agent SDK bridge. Same authority boundary as Codex.
    - id: subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'
