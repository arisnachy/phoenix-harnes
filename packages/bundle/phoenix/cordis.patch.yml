# PHOENIX HARDNESS product overlay. Loaded after the selected profile and before
# user-supplied Codex MCP patches. It moves generic web_search onto the harness-
# owned SearXNG service without removing optional commercial providers.

- id: web
  config:
    searchProvider: searxng

- insert:
    - id: web-search-searxng
      name: '@deepseek-ai/dsh-web-search-searxng'
      config:
        baseURL: !!js process.env.PHOENIX_SEARXNG_URL ?? 'http://127.0.0.1:8888'
