- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'
  config:
    path: !!js process.env.PHOENIX_GOOGLE_REAL_CREDENTIALS_PATH
    watch: false

- id: authorization
  name: '@deepseek-ai/dsh-authorization'

- id: authorization-google
  name: '@deepseek-ai/dsh-authorization/google'
  config:
    clientId: test-client.apps.googleusercontent.com
    scopes:
      - https://www.googleapis.com/auth/drive
