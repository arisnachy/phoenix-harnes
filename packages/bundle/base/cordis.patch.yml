# The dsh-base bundle patch: the shared core of every dsh profile, applied as
# ONE insert over the empty profile root. Later bundle patches and the user's
# profile cordis.patch.yml address these rows by id, with the last write
# winning per row.
#
# A patch replaces the targeted row's whole `config` rather than merging into
# it, so a row whose value differs by mode does NOT live here: it belongs to
# each mode bundle, keeping any single row down to one bundle layer plus the
# user's. Mode-specific rows appear below only with shared plugin identity and
# neutral defaults; each mode bundle restates its complete configuration.
#
# Row order carries no load semantics (activation is service-availability
# driven); the grouping is for readers.

- insert:
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'

    - id: hmr
      name: '@deepseek-ai/cordis-plugin-hmr'
      config:
        root: ['.']

    - id: llm
      name: '@phoenix-ai/dsh-llm'

    - id: session
      name: '@phoenix-ai/dsh-session'

    - id: typert
      name: '@phoenix-ai/dsh-typert-registry'

    - id: typert-loader
      name: '@phoenix-ai/dsh-typert-loader'

    - id: typert-gateway
      name: '@phoenix-ai/dsh-api-gateway'

    - id: session-title
      name: '@phoenix-ai/dsh-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-title-llm
      name: '@phoenix-ai/dsh-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 64
        timeoutMs: 60000

    - id: user-questions
      name: '@phoenix-ai/dsh-user-questions'

    - id: agent
      name: '@phoenix-ai/dsh-agent'

    # The transport-independent default for Agents created by entry points.
    # Settings may supply a saved selection; consumers read it at creation time.
    - id: agent-default-model
      name: '@phoenix-ai/dsh-agent-default-model'
      config:
        provider: openrouter
        model: openrouter/free

    - id: jobs
      name: '@phoenix-ai/dsh-jobs-local'

    - id: llm-retry
      name: '@phoenix-ai/dsh-llm-retry'

    # User-settings document (`$DSH_HOME/settings.yaml`, hot-reloaded): a
    # `llm-deepseek:` or `llm-pi-ai:` section there overrides the adapter entries
    # below without a restart, and is what the web Models page writes.
    - id: settings
      name: '@phoenix-ai/dsh-settings-file'

    # Private local profile. Every value is excluded from model context until
    # the user opts in for that individual field in General settings.
    - id: user-profile
      name: '@phoenix-ai/dsh-user-profile'

    # Credential sources: inherited environment over the managed
    # `$DSH_HOME/.credentials.yaml`, with project and user `.env` fallbacks.
    # Adapters resolve references per request; the Models page writes only the
    # managed document, which is never materialized into the process environment.
    - id: credentials
      name: '@phoenix-ai/dsh-credentials-local'

    # Interactive provider sign-in (for example ChatGPT/Codex OAuth) is a
    # separate capability from API-key storage. The authorization service owns
    # the human conversation while each provider owns its protocol and writes
    # the resulting credential through the credential store above.
    - id: authorization
      name: '@phoenix-ai/dsh-authorization'

    # Google Workspace authorization is opt-in until a deployment supplies its
    # verified Desktop OAuth client id. Access/refresh tokens are stored only in
    # the owner-scoped opaque credential grant; authorization/model surfaces see
    # metadata and Google API results, never the grant payload or Bearer header.
    # Google installed apps do not support incremental authorization, so the
    # enabled provider requests exactly the shipped Workspace capability set.
    - id: authorization-google
      name: '@phoenix-ai/dsh-authorization/google'
      config:
        clientId: !!js process.env.PHOENIX_GOOGLE_OAUTH_CLIENT_ID
        scopes:
          - https://www.googleapis.com/auth/gmail.modify
          - https://www.googleapis.com/auth/calendar
          - https://www.googleapis.com/auth/drive
          - https://www.googleapis.com/auth/documents
          - https://www.googleapis.com/auth/spreadsheets
          - https://www.googleapis.com/auth/presentations
          - https://www.googleapis.com/auth/contacts

    # The pi-ai multi-provider adapter starts with PHOENIX's OpenRouter route.
    # Its key resolves per request from the credential store or the inherited
    # OPENROUTER_API_KEY environment variable; no secret is stored in this tree.
    # Omitting `models` intentionally exposes pi-ai's installed OpenRouter catalog,
    # including `openrouter/free`, while Settings -> Models can replace the route
    # catalog or add other providers without restarting the app.
    - id: llm-pi-ai
      name: '@phoenix-ai/dsh-llm-pi-ai'
      config:
        providers:
          openrouter:
            apiKeyEnv: OPENROUTER_API_KEY

    - id: session-persistence-jsonl
      name: '@phoenix-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')

    # Durable image bytes live outside the append-only session log. Messages
    # keep content-addressed references that this shared backend resolves for
    # provider requests and authorized history reads.
    - id: attachment-local
      name: '@phoenix-ai/dsh-attachment-local'

    # Full-text session search is opt-in. `openAt: never` keeps
    # ctx.sessionQuery mounted — exact reads, titles, and lineage traces
    # (session export, subagent-fork Workspace inheritance) stay available —
    # while search calls fail with SESSION_QUERY_SEARCH_DISABLED and SQLite is
    # never opened; the Web sidebar search matches titles and workspace names
    # only. Deployments enabling content search override `openAt` to
    # `first-search` or `startup` in a later patch layer (profile
    # cordis.patch.yml or a --patch overlay), typically with a durable `path`.
    - id: session-query-sqlite
      name: '@phoenix-ai/dsh-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never

    # Shared projection registry: subagent catalog identity (mode/label) folds
    # through its registered units, so the `list_agents` surface below fails
    # loud without it; web layers reuse this same mount for list rows.
    - id: session-projection
      name: '@phoenix-ai/dsh-session-projection'

    # Session telemetry is mounted but disabled by default. DSH_TELEMETRY_MODE
    # explicitly opts into FULL or FEEDBACK_ONLY reporting; uploading mirrors
    # session-log records onto OTLP/HTTP logs with no session-telemetry/record redaction
    # rule, so exports are the raw captured copy. The deployment stance, env
    # seams, and follow-ups are pinned in the default-off Agent Note.
    # DSH_TELEMETRY_OTLP_URL overrides the production endpoint. A non-empty
    # DSH_TELEMETRY_DISABLED — any value, including '0'/'false' — opts the
    # process out (the launchers patch the row disabled; config cannot disable
    # a row). Exports carry the harness home's anonymous user id ($DSH_HOME/.anonymous-user-id,
    # random UUID; delete the file to reset the identity) as the Resource's
    # user.id. The exporter/processor values normally bound the shutdown drain
    # to ~1s against an unreachable collector: exporter.timeoutMillis is both
    # the per-attempt socket timeout and the retry deadline (1s effectively
    # disables the SDK's 5-try backoff), while maxExportBatchSize == maxQueueSize
    # (both explicit) makes the drain a single batch. The SDK awaits
    # exporter.forceFlush() outside exportTimeoutMillis, so the backend's 3s
    # shutdownTimeoutMillis is the load-bearing outer bound when a transport
    # promise never settles. Every CLI exit path drains it by disposing the root
    # on SIGINT/SIGTERM.
    - id: session-telemetry-otel
      name: '@phoenix-ai/dsh-session-telemetry-otel'
      config:
        mode: !!js process.env.DSH_TELEMETRY_MODE || 'DISABLED'
        shutdownTimeoutMillis: 3000
        exporter:
          url: !!js process.env.DSH_TELEMETRY_OTLP_URL ?? 'https://harness-telemetry.deepseeksvc.com/v1/logs'
          compression: gzip
          timeoutMillis: 1000
        processor:
          scheduledDelayMillis: 10000
          maxQueueSize: 2048
          maxExportBatchSize: 2048
          exportTimeoutMillis: 1500

    - id: subprocess
      name: '@phoenix-ai/dsh-subprocess-local'

    # Every shipped CLI mode starts with the same file-effect boundary.
    # An explicit danger-full-access environment selection carries the same
    # no-approval policy as the matching permission preset; other modes retain
    # the interactive approval default below.
    - id: sandbox
      name: '@phoenix-ai/dsh-sandbox-local'

    - id: sandbox-policy
      name: '@phoenix-ai/dsh-sandbox-policy'
      config:
        mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()

    - id: bash-sandbox
      name: '@phoenix-ai/dsh-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: '@phoenix-ai/dsh-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: approval
      name: '@phoenix-ai/dsh-user-approval'
      config:
        # Full access is already the user's explicit permission choice; a
        # second approval escalation would contradict that selected mode.
        policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    - id: permission
      name: '@phoenix-ai/dsh-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    - id: shell-env
      name: '@phoenix-ai/dsh-shell-env'

    - id: tool-bash
      name: '@phoenix-ai/dsh-tool-bash'
      disabled: !!js process.platform === 'win32'

    - id: tool-pwsh
      name: '@phoenix-ai/dsh-tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: tool-jobs
      name: '@phoenix-ai/dsh-tool-jobs'

    - id: fs-observation-policy
      name: '@phoenix-ai/dsh-fs-observation-policy'

    - id: tool-fs
      name: '@phoenix-ai/dsh-tool-fs'

    - id: tool-fs-search
      name: '@phoenix-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: agent-instructions
      name: '@phoenix-ai/dsh-agent-instructions'
      config:
        maxBytes: 65536

    - id: skill
      name: '@phoenix-ai/dsh-skill'

    - id: skill-filesystem
      name: '@phoenix-ai/dsh-skill-filesystem'

    - id: skill-badge
      name: '@phoenix-ai/dsh-skill-badge'
      disabled: true

    - id: tool-skill
      name: '@phoenix-ai/dsh-tool-skill'

    - id: commands
      name: '@phoenix-ai/dsh-commands'

    - id: command-feedback
      name: '@phoenix-ai/dsh-command-feedback'

    - id: goal
      name: '@phoenix-ai/dsh-goal'

    - id: goal-round-driver
      name: '@phoenix-ai/dsh-goal-round-driver'

    - id: command-goal
      name: '@phoenix-ai/dsh-command-goal'

    - id: plan-mode
      name: '@phoenix-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

    - id: token-meter
      name: '@phoenix-ai/dsh-token-meter'

    - id: compaction-basic
      name: '@phoenix-ai/dsh-compaction-basic'
      # Economy guard: compact earlier, retain a smaller recent window, and do
      # not spend extra model calls retrying compaction. This is deliberately
      # conservative; quality is measured in phoenix-self before tightening it.
      config:
        thresholdRatio: 0.72
        retainRatio: 0.10
        maxTokens: 4096
        compactionRetries: 0
        maxOverflowRetries: 0

    # Human `/compact`: one useful reduction below the automatic threshold. Backend
    # independent, so it follows whichever compaction service this leaf mounts.
    - id: command-compact
      name: '@phoenix-ai/dsh-command-compact'

    - id: subagent
      name: '@phoenix-ai/dsh-subagent'

    - id: subagent-spawn-in-process
      name: '@phoenix-ai/dsh-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@phoenix-ai/dsh-subagent-fork-in-process'
      config:
        providerName: fork

    # Continuable background children are selected per delegation tool. The
    # separately loaded follow-up tool registers the one global `send_message`.
    - id: tool-subagent-control
      name: '@phoenix-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@phoenix-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@phoenix-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
        # One generation by default; descendants require an explicit overlay.
        maxDepth: 1

    # Fork stays one-shot: a continuable child's `report` tool and prompt
    # section precede the inherited history a fork exists to reuse; one-shot
    # fork children install neither, keeping the parent's request prefix.
    # See .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
    - id: tool-subagent-fork
      name: '@phoenix-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot
        # Keep forked work one generation deep unless an overlay opts in.
        maxDepth: 1

    # Optional direct-child return channel; absent from roots and one-shot agents.
    - id: tool-subagent-report
      name: '@phoenix-ai/dsh-tool-subagent-report'

    - id: workflow-worker-thread
      name: '@phoenix-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn
        # Explicit workflows remain available, but the default deployment cannot
        # fan out hundreds of agents or consume all cores without an overlay.
        maxConcurrentAgents: 1
        maxTotalAgents: 4

    - id: tool-workflow
      name: '@phoenix-ai/dsh-tool-workflow'

    - id: timeout-policy
      name: '@phoenix-ai/dsh-tool-call-timeout-policy'

    - id: spill-local
      name: '@phoenix-ai/dsh-spill-local'

    - id: spill-policy
      name: '@phoenix-ai/dsh-spill-policy'
      config:
        maxInlineBytes: 50000

    # Durability checkpoints before each model request and top-level dispatch.
    - id: session-checkpoint-policy
      name: '@phoenix-ai/dsh-session-checkpoint-policy'

    # Compacts oversized tool results before the broader conversation compactor
    # runs, preserving the model-visible result within the configured budget.
    - id: tool-result-pruner
      name: '@phoenix-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    - id: tool-todo
      name: '@phoenix-ai/dsh-tool-todo'
      config:
        allowParallelInProgress: true

    # Persisted same-session goals reach the model and the slash menu here; the
    # domain, driver, and `/goal` command are above.
    - id: tool-goal
      name: '@phoenix-ai/dsh-tool-goal'
      config:
        # A goal cannot enter complete until a fresh read-only structured judge
        # independently approves the whole objective.
        requireJudge: true
        judgeProvider: spawn

    # Fresh-agent Ralph iteration over a build-time-fixed script.
    - id: tool-ralph
      name: '@phoenix-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

    - id: tool-str-replace-editor
      name: '@phoenix-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

    # Consecutive-repeat reminders on the tool chain.
    - id: repeat-tool-reminder
      name: '@phoenix-ai/dsh-repeat-tool-reminder'
      config:
        thresholds: [3, 5, 8]
        argumentsPreviewChars: 500

    # Every mode enables the stable model-facing web_search tool. OpenRouter
    # search resolves the same OPENROUTER_API_KEY managed by Settings -> Models
    # and uses the provider's current server-tool contract. Fetch stays disabled
    # because a model-chosen URL needs a separate SSRF policy. Search is a full
    # auxiliary model request, so the shipped route gets a 60s budget.
    - id: web
      name: '@phoenix-ai/dsh-web'
      config:
        searchProvider: openrouter
        searchFallbackProviders: [free-html]

    - id: web-search-openrouter
      name: '@phoenix-ai/dsh-web-search-openrouter'
      config:
        apiKeyEnv: OPENROUTER_API_KEY

    # Keyless fallback: uses public HTML search endpoints when the paid route
    # fails recoverably (quota, credits, rate limit, auth, timeout, or outage).
    - id: web-search-free
      name: '@phoenix-ai/dsh-web-search-free'
      config:
        engines: [bing, duckduckgo]
        timeoutMs: 8000

    - id: tool-web
      name: '@phoenix-ai/dsh-tool-web'
      config:
        fetch: false
        searchTimeoutMs: 60000

    # ── rows every mode mounts, whose values each overlay may state ──────────────

    # Secret-free lifecycle state for MCP servers. MCP client overlays publish their
    # current connection and public-tool generation through this shared registry.
    - id: mcp-connector-registry
      name: '@phoenix-ai/dsh-mcp-connector-registry'

    # The tool registry. Presentation mode is a deployment choice; omitting it here
    # keeps the schema default (native).
    - id: tools
      name: '@phoenix-ai/dsh-tools'

    # Provider-neutral capability inventory. The JSON provider remains opt-in;
    # this base row mounts the in-memory service and its source projections.
    - id: hardness
      name: '@phoenix-ai/dsh-hardness'

    - id: hardness-adapters
      name: '@phoenix-ai/dsh-hardness-adapters'

    # The deployment persona is a deployment choice; plan-mode and tool plugins own
    # their own prompt sections.
    - id: system-prompt
      name: '@phoenix-ai/dsh-system-prompt'
      config:
        persona: |
          You are PHOENIX, a warm, persistent, and safety-governed agent harness.
          Reply in the language of the user's latest message unless the user
          explicitly requests another language. Keep user-visible progress and
          reasoning summaries in that language; never reveal hidden chain of
          thought. Address the user by name only after they have supplied it,
          and use emoji sparingly when it suits their tone.

          Pursue the requested outcome with bounded retries and specialist
          subagents when useful. Before a destructive or high-impact action,
          confirm that it is necessary, identify the exact target, prefer a
          recoverable operation, and keep a rollback path. New tools and learned
          workflows must be isolated, tested, reviewable, and explicitly
          promoted before they can alter the trusted runtime.

    # Agents created at startup. The base stays empty; raw overlays may create
    # agents, while Web creates sessions on client request.
    - id: agent-loop
      name: '@phoenix-ai/dsh-agent-loop'
      config:
        agents: []

    # The sandboxed filesystem provider. `cwd` defaults to `process.cwd()`; an
    # overlay can pin another workspace.
    - id: fs-sandbox
      name: '@phoenix-ai/dsh-fs-sandbox'

    # The native DeepSeek adapter. No key or endpoint is inlined: both resolve per
    # request from the `llm-deepseek:` settings section over this entry, with the
    # key coming from the credential store below. Thinking defaults are a deployment
    # choice.
    - id: llm-deepseek
      name: '@phoenix-ai/dsh-llm-deepseek'
