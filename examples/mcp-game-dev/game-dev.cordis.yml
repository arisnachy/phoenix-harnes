# Optional game-development MCP connector pack for PHOENIX.
#
# Enable only the connectors installed on this workstation. Blender uses the
# Blender Foundation MCP source already pinned by PHOENIX. Unity, Unreal,
# Godot and gameplay bridges are intentionally command-configured: there is no
# single vendor-official MCP server for all versions, so PHOENIX must not
# auto-execute an arbitrary community repository.
#
# Global opt-in:
#   PHOENIX_GAME_DEV_ENABLE=1
#
# Per-engine stdio commands:
#   PHOENIX_UNITY_MCP_COMMAND / PHOENIX_UNITY_MCP_ARGS
#   PHOENIX_UNREAL_MCP_COMMAND / PHOENIX_UNREAL_MCP_ARGS
#   PHOENIX_GODOT_MCP_COMMAND / PHOENIX_GODOT_MCP_ARGS
#   PHOENIX_GAMEPLAY_MCP_COMMAND / PHOENIX_GAMEPLAY_MCP_ARGS

- insert:
    - id: mcp-blender-game-dev
      name: '@phoenix-ai/dsh-mcp-client'
      disabled: !!js process.env.PHOENIX_GAME_DEV_ENABLE !== '1'
      config:
        transport: stdio
        serverName: blender
        command: !!js process.env.PHOENIX_BLENDER_MCP_COMMAND ?? 'uvx'
        args: !!js process.env.PHOENIX_BLENDER_MCP_ARGS ? JSON.parse(process.env.PHOENIX_BLENDER_MCP_ARGS) : ['--from', 'git+https://projects.blender.org/lab/blender_mcp.git@v1.0.0#subdirectory=mcp', 'blender-mcp']
        env:
          BLENDER_MCP_HOST: !!js process.env.PHOENIX_BLENDER_MCP_HOST ?? 'localhost'
          BLENDER_MCP_PORT: !!js process.env.PHOENIX_BLENDER_MCP_PORT ?? '9876'
        cwd: ''
        toolCallTimeoutMs: 120000
        startupTimeoutMs: 120000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 60

    - id: mcp-unity-game-dev
      name: '@phoenix-ai/dsh-mcp-client'
      disabled: !!js process.env.PHOENIX_GAME_DEV_ENABLE !== '1' || !process.env.PHOENIX_UNITY_MCP_COMMAND
      config:
        transport: stdio
        serverName: unity
        command: !!js process.env.PHOENIX_UNITY_MCP_COMMAND ?? 'node'
        args: !!js process.env.PHOENIX_UNITY_MCP_ARGS ? JSON.parse(process.env.PHOENIX_UNITY_MCP_ARGS) : []
        env: {}
        cwd: !!js process.env.PHOENIX_UNITY_MCP_CWD ?? ''
        toolCallTimeoutMs: 120000
        startupTimeoutMs: 30000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 60

    - id: mcp-unreal-game-dev
      name: '@phoenix-ai/dsh-mcp-client'
      disabled: !!js process.env.PHOENIX_GAME_DEV_ENABLE !== '1' || !process.env.PHOENIX_UNREAL_MCP_COMMAND
      config:
        transport: stdio
        serverName: unreal
        command: !!js process.env.PHOENIX_UNREAL_MCP_COMMAND ?? 'uv'
        args: !!js process.env.PHOENIX_UNREAL_MCP_ARGS ? JSON.parse(process.env.PHOENIX_UNREAL_MCP_ARGS) : []
        env: {}
        cwd: !!js process.env.PHOENIX_UNREAL_MCP_CWD ?? ''
        toolCallTimeoutMs: 180000
        startupTimeoutMs: 60000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 60

    - id: mcp-godot-game-dev
      name: '@phoenix-ai/dsh-mcp-client'
      disabled: !!js process.env.PHOENIX_GAME_DEV_ENABLE !== '1' || !process.env.PHOENIX_GODOT_MCP_COMMAND
      config:
        transport: stdio
        serverName: godot
        command: !!js process.env.PHOENIX_GODOT_MCP_COMMAND ?? 'node'
        args: !!js process.env.PHOENIX_GODOT_MCP_ARGS ? JSON.parse(process.env.PHOENIX_GODOT_MCP_ARGS) : []
        env: {}
        cwd: !!js process.env.PHOENIX_GODOT_MCP_CWD ?? ''
        toolCallTimeoutMs: 120000
        startupTimeoutMs: 30000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 60

    - id: mcp-gameplay-game-dev
      name: '@phoenix-ai/dsh-mcp-client'
      disabled: !!js process.env.PHOENIX_GAME_DEV_ENABLE !== '1' || !process.env.PHOENIX_GAMEPLAY_MCP_COMMAND
      config:
        transport: stdio
        serverName: gameplay
        command: !!js process.env.PHOENIX_GAMEPLAY_MCP_COMMAND ?? 'node'
        args: !!js process.env.PHOENIX_GAMEPLAY_MCP_ARGS ? JSON.parse(process.env.PHOENIX_GAMEPLAY_MCP_ARGS) : []
        env: {}
        cwd: !!js process.env.PHOENIX_GAMEPLAY_MCP_CWD ?? ''
        toolCallTimeoutMs: 120000
        startupTimeoutMs: 30000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 60
