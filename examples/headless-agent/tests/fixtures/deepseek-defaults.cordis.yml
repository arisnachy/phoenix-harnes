- id: base
  name: '@phoenix-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        config:
          baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
          thinking: enabled
          reasoningEffort: low
          # Keep this comfortably above scheduler stalls in the parallel
          # snapshot job. The mock still emits three delayed SSE comments, so
          # the adapter's keep-alive parsing remains exercised without turning
          # hosted-runner contention into a transport retry.
          streamIdleTimeoutMs: 2000
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless DeepSeek adapter defaults snapshot.'
      - id: persistence
        config:
          root: './.sessions'
