<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>PHOENIX · Conexión segura</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #27352e; background: #faf7f0 }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center }
    main { box-sizing: border-box; max-width: 32rem; padding: 2rem; line-height: 1.55 }
    h1 { font-size: 1.35rem; margin: 0 0 .8rem; font-weight: 650 }
    p { margin: 0 0 1rem }
    .muted { color: #626f68; font-size: .9rem }
    a { color: #206658; }
    #status { padding: .75rem 0; }
  </style>
  <script defer src="/oauth-waiting.js"></script>
</head>
<body>
  <main role="status" aria-live="polite">
    <h1>Conectando con tu proveedor…</h1>
    <p id="status">PHOENIX está preparando la autorización. Esta pestaña se abrirá en el proveedor cuando reciba una URL segura.</p>
    <p class="muted">Si no avanza, vuelve a PHOENIX para revisar el mensaje del conector. No introduzcas claves ni contraseñas en esta página.</p>
    <p><a href="/">Volver a PHOENIX</a></p>
  </main>
</body>
</html>
