<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fbf7ef" />
  <title>PHOENIX · Preparando autorización</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fbf7ef; color: #2d2a26; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    main { width: min(560px, 100%); text-align: center; padding: 40px 34px; border: 1px solid rgba(45,42,38,.12); border-radius: 28px; background: rgba(255,255,255,.48); box-shadow: 0 18px 60px rgba(80,65,45,.08); }
    .mark { width: 58px; height: 58px; margin: 0 auto 18px; border-radius: 18px; display: grid; place-items: center; background: #fffaf2; border: 1px solid rgba(45,42,38,.12); font-size: 28px; }
    h1 { margin: 0 0 10px; font-size: 24px; line-height: 1.2; }
    p { margin: 0; color: #716b64; font-size: 16px; line-height: 1.55; }
    .spinner { width: 26px; height: 26px; margin: 24px auto 0; border-radius: 50%; border: 3px solid rgba(45,42,38,.13); border-top-color: #2d2a26; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">☾</div>
    <h1>Preparando autorización…</h1>
    <p>PHOENIX está obteniendo la página segura del proveedor. Esta pestaña se redirigirá automáticamente.</p>
    <div class="spinner" aria-hidden="true"></div>
  </main>
</body>
</html>
