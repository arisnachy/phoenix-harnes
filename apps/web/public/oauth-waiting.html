<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fbf7ef" />
  <title>PHOENIX · Preparando autorización</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fbf7ef; color: #2d2a26; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    main { width: min(560px, 100%); text-align: center; padding: 40px 34px; border: 1px solid rgba(45,42,38,.12); border-radius: 28px; background: rgba(255,255,255,.48); box-shadow: 0 18px 60px rgba(80,65,45,.08); }
    .mark { width: 58px; height: 58px; margin: 0 auto 18px; border-radius: 18px; display: grid; place-items: center; background: #fffaf2; border: 1px solid rgba(45,42,38,.12); font-size: 28px; }
    h1 { margin: 0 0 10px; font-size: 24px; line-height: 1.2; }
    p { margin: 0; color: #716b64; font-size: 16px; line-height: 1.55; }
    .spinner { width: 26px; height: 26px; margin: 24px auto 0; border-radius: 50%; border: 3px solid rgba(45,42,38,.13); border-top-color: #2d2a26; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">☾</div>
    <h1>Preparando autorización…</h1>
    <p id="status">PHOENIX está obteniendo la página segura del proveedor. Esta pestaña se redirigirá automáticamente.</p>
    <div class="spinner" aria-hidden="true"></div>
  </main>
  <script>
    (() => {
      const status = document.getElementById('status')
      const spinner = document.querySelector('.spinner')
      const allowedOrigin = window.location.origin

      const safeProviderUrl = (value) => {
        if (typeof value !== 'string') return null
        try {
          const url = new URL(value)
          return url.protocol === 'https:' || (url.protocol === 'http:' && (url.hostname === '127.0.0.1' || url.hostname === 'localhost'))
            ? url
            : null
        } catch {
          return null
        }
      }

      window.addEventListener('message', (event) => {
        if (event.origin !== allowedOrigin) return
        const data = event.data
        if (data === null || typeof data !== 'object') return

        if (data.type === 'phoenix/oauth-navigate') {
          const target = safeProviderUrl(data.url)
          if (target === null) {
            if (status) status.textContent = 'PHOENIX rechazó una URL de autorización no segura.'
            if (spinner) spinner.hidden = true
            return
          }
          window.location.replace(target.href)
          return
        }

        if (data.type === 'phoenix/oauth-status' && typeof data.message === 'string') {
          if (status) status.textContent = data.message
          if (data.state === 'error' && spinner) spinner.hidden = true
        }
      })

      // Tell the opener only after the message listener is active. This removes
      // the timing race where the consent URL arrived before this page loaded.
      try {
        if (window.opener !== null) {
          window.opener.postMessage({ type: 'phoenix/oauth-ready' }, allowedOrigin)
        }
      } catch {
        // If the opener was severed by browser isolation, the manual link in
        // PHOENIX remains available and no provider URL is exposed here.
      }
    })()
  </script>
</body>
</html>
