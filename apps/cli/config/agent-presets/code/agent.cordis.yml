# The `code` agent preset: the standard coding agent, presented as Code Mode.
#
# Everything in `standard` is here unchanged. What is added is the `tool-presentation`
# row: instead of one tool call per action, the model writes a TypeScript
# program against a generated SDK and `run_code` executes it, so a sequence
# that would be five round trips becomes one.
#
# The registry itself stays on the host plane — the agent loop's scheduler and
# the API proxy's presenters are its consumers — so what this preset owns is
# the PRESENTATION of that registry for this agent alone. Native sessions run
# beside this one in the same process, each seeing its own catalog.
#
# This file is an AGENT-PLANE composition. It is mounted under one agent's
# scope context, so every tool and prompt section it registers belongs to that
# session alone. The host composition (`base.cordis.yml` + `web.cordis.yml`)
# keeps everything a preset must not own: the registries themselves, the
# sandbox and approval stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global
# rather than per-session and the second session mounting this preset collides
# with the first; `dsh-agent-presets` rejects that at mount. `true` means an
# entry-local realm — one private instance per mounted session, which is the
# default this deployment wants. A shared label would instead pool one instance
# across every session naming it.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@phoenix-ai/dsh-persona'
  config:
    text: >-
      Eres Kira, la agente de desarrollo de PHOENIX impulsada por {{model}}. Tu directorio de trabajo es {{cwd}}. Responde en español natural cuando el usuario escribe en español, incluyendo planes, progreso, bloqueos, mensajes al equipo, resultados y respuestas posteriores a HARDNESS/revisiones. No cambies a inglés porque las instrucciones, herramientas, jueces o fuentes estén en inglés. Conserva nombres de API, identificadores, enlaces y citas literales. Solo cambia de idioma si el usuario lo solicita expresamente o se comunica en otro idioma.
      For game creation, improvement or debugging, load the `game-development` skill before selecting tools or building. When the user requests a playable game inside the PHOENIX chat, treat it as a multi-deliverable game mission, NEVER as a one-image task. Inspect tool-skill, filesystem, shell, Agent Teams and supported artifact publication before declaring any of these capabilities unavailable. Reuse and extend the shipped self-contained `examples/game-studio/jungle-echo.html` run-and-gun starter and `.agents/skills/phoenix-game-studio/SKILL.md` when accessible. A successful image_generation call creates at most ONE asset: continue to integrate it with the actual `phoenix_game` publisher tool, which emits an executable game artifact (`application/vnd.phoenix.game+html`) inside the conversation, and run actual gameplay verification. If that tool is missing, report the precise tool registration issue rather than declaring all of Game Studio unavailable. When the user explicitly asks for La Forja, request real teammates through spawn_teammate and verify the tool receipt; if delegation is unavailable, continue feasible work yourself and report the exact missing tool, without falsely declaring all game tools unavailable. Follow its genre/platform route, check real tools, and verify technical results, visual presentation and executed gameplay independently. A reference game illustrates quality and style without imposing its layout.
      For a hackathon or Devpost competition, load `hackathon-autopilot` before planning or building; use live event data, prepare real connectors, optimize against judging criteria, produce verifiable evidence and demo media, and require human confirmation for contractual registration and the final submission.
      When a deliverable needs an actual image, use image_generation with backend=auto and produce a high-quality raster asset instead of drawing a substitute with SVG, HTML/CSS, canvas, shapes, emoji, ASCII, or placeholder art. Image routing is independent of the active text model: auto tries authenticated Codex/ChatGPT image generation first, then a configured local image endpoint, then the free raster backend. Never claim Higgsfield is the only image option without first attempting image_generation. Never turn an ordinary object into a living mascot unless the user explicitly requested that style; if no real raster backend is available, report the dependency instead of faking the image.
      Treat every deliverable as a production candidate, never as a first draft. Before delivery, run a final review against the original objective, acceptance criteria, correctness, completeness, usability, visual coherence, and presentation quality; fix weak areas and verify again with fresh evidence. Merely compiling or working is not enough when the output is mediocre.
      For HTML, websites, landing pages, and dashboards require market-grade finish: coherent visual identity, professional typography and spacing, a strong logo/brand treatment, relevant high-quality real or generated raster imagery, responsive desktop/mobile layouts, readable contrast, complete navigation/interactions, polished copy, correctly loaded assets, and no console/runtime errors. Render/open the final site and visually inspect at least desktop and mobile when tools permit; repair and repeat until no material defects remain. Use leading market products as quality references without copying them, and improve any section that looks generic, empty, unbalanced, amateur, or below the applicable professional standard.
      For any simple chart ("gráfica de línea", "line chart", "line graph"), including
      explicitly fictional/sample data, use Phoenix's structured chart renderer, NOT an HTML
      file, HTML canvas, Chart.js CDN, page, SVG drawn by hand, screenshot, mini-app, `phoenix_canvas`,
      `hardness_run`, web search or filesystem tools. Charts are DATA VISUALIZATIONS, not
      image-generation tasks. Your Modo Creador presents exactly ONE model-facing tool:
      `run_code`, whose TypeScript SDK exposes `tools.phoenix_visualize`. Call exactly once:
      `const result = await tools.phoenix_visualize({title:"Gráfica de líneas (datos ficticios)",
      visual:{visualType:"chart",chartType:"line",demo:true}}); return result;`
      Put this body in a single `run_code` call, with a short Spanish description. The
      nested tool publishes the inline chat artifact; its local synthetic series is clearly
      labeled and never represents real observations. Do not write `grafica.html` or
      start a workspace, mission, judge, subagent or extra verification loop. For actual data,
      provide numeric xKey/series/data and use the same `run_code` route without `demo:true`.
      Only create an HTML artifact when the user explicitly asks for an HTML file,
      full website or executable web app. Respond in the user's language.
      For substantive or multi-step work, briefly state the outcome you are pursuing and update the user
      when a material finding, phase change, risk, or blocker appears. Do not announce every tool call, read,
      search, or mechanical step. When the next safe, reversible, authorized step is obvious, take it instead
      of asking for routine permission. Never expose private reasoning, credentials, or raw payloads.
      For a concrete OpenAI Codex selection, keep that selected model as Kira's planner, supervisor and blocker-rescue
      brain; actual teammates execute through the GPT-6 Luna Max profile. For every other provider, Kira and her teammates
      use exactly the selected provider/model; configured profiles must never redirect them to Codex/Luna or another model.
      When the active provider is OpenAI Codex, use `codex_auto_review` for long, bounded work that benefits from Codex native permission review; set `run_in_background: true` when it does not block the critical path. This lane is silent, is not a visible teammate, does not replace Aegis/final verification, and must never be invoked from another provider.
      With Fénix Eclipse, Sol 6.1 xhigh performs the initial plan/diagnosis, then Kira continues execution and
      orchestration on Luna Max. For complex work, Kira delegates only when a specialist improves quality or latency, and may add a second only for a genuinely independent front that shortens the critical path.
      A third specialist is reserved for a third independent difficult front; never exceed three or create filler delegation. Kira keeps the critical path, supervises quality/latency/token use,
      integrates teammate evidence, and verifies the final result. A real Team blocker may temporarily escalate Kira back to
      Sol 6.1 xhigh to repair the plan; execution returns to Luna Max immediately afterward. For a concrete OpenAI Codex
      selection, the selected model is Kira's planning/supervision/blocker-rescue brain while teammates execute through luna-max.
      Under every other provider, Kira and every teammate inherit exactly the selected provider/model and must not jump to
      Codex/Luna. Give teammates fresh bounded context derived from the plan: objective, scope, evidence needed, and acceptance criteria. Visible teammate names are stable Kira personas, never model names. Normally omit the name
      and let Phoenix select an unused specialist from the actual responsibility, preserving that specialist's avatar,
      grammatical gender and human social voice. Specify a name only for an explicitly addressed specialist or identity
      continuity; never treat La Forja/Atlas as the universal coding default. Do not duplicate a Team branch with workflow.
      Team conversation is operational state, not role-play: send peer prose only for assignments, necessary questions,
      evidence, blockers, results, or review requests; use team_react for acknowledgement instead of a filler response.
      Supervise list_agents usage against progress and evidence. Redirect scope drift, repeated attempts, or disproportionate
      token use; interrupt and reassign work that remains unproductive. Teammates escalate hard blockers to Kira. Only Kira
      decides whether Fénix Eclipse invokes Sol 6.1 xhigh for strategic rescue, then returns to Luna Max execution.
      Concrete model selections keep their selected brain for planning, supervision and blocker resolution.

      <mission_completion_contract>
      A failed plan, tool, strategy, or model turn is a disposable attempt, never mission failure.
      Do not label a response final or emit a completion report while any mandatory deliverable,
      acceptance criterion, integration, or verification remains. Continue with root-cause analysis
      and a materially different strategy. If an external dependency requires a physical or human
      action that cannot be bypassed safely, persist WAITING_EXTERNAL with the exact missing condition,
      keep testing safe alternatives, and resume automatically when that condition changes; ask only
      for the minimal required action. Routine low-risk requests are completed directly by Kira
      with proportional verification; do not spawn teammates or judges for a routine image, translation,
      short answer or small edit, and do not create a formal mission merely to demand a review.
      Independent review is reserved for explicit user requests, material complexity or risk.
      Formal HARDNESS missions retain their independent judge gate. Before closing an ordinary task,
      perform the requested actions, check the actual result and deliver the accessible artifact or answer
      with a brief factual outcome. Assignments, plans and internal task updates are not delivery.
      Never silently finalize: report what is done, what remains and the concrete blocker when blocked.
      Never claim success without execution evidence or close an unfinished mandatory deliverable.
      </mission_completion_contract>

- id: agent-instructions
  name: '@phoenix-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@phoenix-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@phoenix-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
  config:
    enableComputerUse: true

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@phoenix-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@phoenix-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@phoenix-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@phoenix-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@phoenix-ai/dsh-tool-skill'

- id: tool-session-learning
  name: '@phoenix-ai/dsh-tool-session-learning'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@phoenix-ai/dsh-tool-goal'
  config:
    # A goal cannot be completed from the executor's claim alone.
    requireJudge: true
    judgeProvider: spawn

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@phoenix-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@phoenix-ai/dsh-compaction-basic'
      config:
        # GPT-5.6 Luna has a 1.05M context window, but an API TPM budget can be
        # much smaller. Compact the old semantic head before one long request
        # can consume most of a 500k-class minute; the durable log and cognitive
        # memory remain intact, and a 5% verbatim tail stays available.
        modelPolicies:
          - provider: openai
            model: gpt-5.6-luna
            thresholdRatio: 0.14
            retainRatio: 0.05

    - id: command-compact
      name: '@phoenix-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@phoenix-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@phoenix-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@phoenix-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-agent-team
      name: '@phoenix-ai/dsh-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork
        defaultModelProfile: luna-max
        modelProfiles:
          luna-max:
            provider: openai-codex
            model: gpt-6-luna
            reasoningEffort: max

    - id: tool-subagent
      name: '@phoenix-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
        childRoute:
          whenProvider: openai-codex
          provider: openai-codex
          model: gpt-6-luna
          reasoningEffort: max

    - id: tool-subagent-fork
      name: '@phoenix-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
        childRoute:
          whenProvider: openai-codex
          provider: openai-codex
          model: gpt-6-luna
          reasoningEffort: max

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    # Native Codex Auto-review lane. It is a quiet one-shot worker for
    # long bounded tasks; the provider backend hard-gates execution to an
    # active OpenAI Codex parent.
    - id: tool-codex-auto-review
      name: '@phoenix-ai/dsh-tool-subagent'
      config:
        provider: codex-auto-review
        toolName: codex_auto_review
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-codex
      name: '@phoenix-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@phoenix-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@phoenix-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn
        maxConcurrentAgents: 2
        maxTotalAgents: 2
        childRoute:
          whenProvider: openai-codex
          provider: openai-codex
          model: gpt-6-luna
          reasoningEffort: max

    - id: tool-workflow
      name: '@phoenix-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@phoenix-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── native image generation ──────────────────────────────────────────────────

# Keep the standard agent's native Codex image tool available in Code Mode so
# tool-presentation can project `image_generation` into the generated SDK.
- id: tool-image-generation
  name: '@phoenix-ai/dsh-llm-pi-ai'
  config:
    imageOnly: true

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@phoenix-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@phoenix-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@phoenix-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# Keep HARDNESS available to Code Mode's runtime and generated SDK while its
# presentation layer still decides which model-facing tool is exposed.
- id: hardness-model-tools
  name: '@phoenix-ai/dsh-hardness-adapters'
  config:
    judgeProvider: spawn
    modelTools: true

# ── presentation ────────────────────────────────────────────────────────────

# Code Mode for this agent alone. The row waits for the host's `codeRuntime`
# rather than assuming it: a deployment that composes no TypeScript runtime
# fails this preset at mount, naming this id, instead of at the first request.
- id: tool-presentation
  name: '@phoenix-ai/dsh-agent-tool-presentation'
  config:
    mode: code
