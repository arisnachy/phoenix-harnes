<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clima · Santo Domingo</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #1d2a3a; background: #f7fafc; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 20px; background: linear-gradient(145deg, #fbfdff, #edf4fa); }
    .card { width: min(100%, 480px); padding: 22px; border: 1px solid #dce7f0; border-radius: 20px; background: #fff; box-shadow: 0 10px 28px rgba(66, 94, 122, .11); }
    .heading { display: flex; align-items: center; gap: 12px; }
    .icon { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 13px; background: #f7d1b3; font-size: 23px; }
    h1 { margin: 0; font-size: 19px; letter-spacing: -.02em; }
    .location { margin: 3px 0 0; color: #748399; font-size: 13px; }
    .summary { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 18px; }
    .temperature { color: #bd6e50; font-size: 46px; line-height: .9; font-weight: 750; letter-spacing: -.06em; }
    .condition { color: #536b84; font-size: 14px; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .metric { padding: 11px 12px; border-radius: 13px; background: #f0f5fa; }
    .metric-label { display: block; color: #7b8b9e; font-size: 11px; }
    .metric-value { display: block; margin-top: 4px; color: #405b76; font-size: 16px; font-weight: 700; }
    .note { margin: 14px 0 0; color: #8a98a8; font-size: 11px; }
    @media (max-width: 430px) { .card { padding: 18px; } .metrics { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="weather-title">
    <header class="heading">
      <span class="icon" aria-hidden="true">🌤️</span>
      <div><h1 id="weather-title">Estado del tiempo</h1><p class="location">Santo Domingo · Actualizado ahora</p></div>
    </header>
    <section class="summary" aria-label="Condición actual"><strong class="temperature">29°</strong><span class="condition">Parcialmente nublado</span></section>
    <section class="metrics" aria-label="Métricas meteorológicas">
      <div class="metric"><span class="metric-label">Humedad</span><strong class="metric-value">74%</strong></div>
      <div class="metric"><span class="metric-label">Viento</span><strong class="metric-value">18 km/h</strong></div>
      <div class="metric"><span class="metric-label">Sensación</span><strong class="metric-value">32°</strong></div>
    </section>
    <p class="note">Datos de demostración para validar la previsualización HTML sandbox.</p>
  </main>
</body>
</html>
